name: Build and pack py packages
on:
  workflow_call:
    inputs:
      deploy:
        required: false
        type: boolean
        default: false
      release:
        required: false
        type: boolean
        default: false
      pre_commit:
        required: false
        type: boolean
        default: false
      run_black:
        required: false
        type: boolean
        default: false
        description: When 'true' black is run stopping the pipeline if any files are not properly formatted
      with_docs:
        required: false
        type: boolean
        default: false
        description: When true documentation is published, the branch gh-pages must be created manually 'git checkout --orphan gh-pages && touch .nojekyll && git add .nojekyll && git commit -m "Initial commit" && git push --set-upstream origin gh-pages'
      prod_publish_repos:
        required: false
        type: string
        default: '["ppa-main"]'
      prod_publish_pypi:
        required: false
        type: string
        default: 'pypi-edge'
      PYTHON_VERSION:
        required: false
        type: string
        default: "3.8.10"
    secrets:
      auto_commit_user:
        required: false # only when deploy true
      auto_commit_mail:
        required: false # only when deploy true
      auto_commit_password:
        required: false
      registry_user:
        required: true
      registry_password:
        required: true
      nexus_publisher_user:
        required: true
      nexus_publisher_password:
        required: true
      gh_token:
        required: true
      sonar_token:
        required: true

jobs:
  RefreshSource:
    if: ${{ ! inputs.deploy }}
    runs-on: ubuntu-22.04
    steps:
      - uses: docker://chinthakagodawita/autoupdate-action:v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ secrets.auto_commit_password }}'
          MERGE_MSG: "Branch was auto-updated."

  Pre-commit:
    if: ${{ inputs.pre_commit }}
    runs-on: ubuntu-22.04
    container:
      image: registry.aws.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}

      - name: Install dependencies and package
        run: |
          python3 -m pip install pip --upgrade
          python3 -m pip install -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple --extra-index-url https://pypi.org/simple -r build-requirements.txt
          python3 -m pip install -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple --extra-index-url https://pypi.org/simple .

          python3 -m pip install pre-commit

      - name: Run pre-commit
        run: |
          git config --global --add safe.directory $(pwd)
          python3 -m pre_commit run --show-diff-on-failure --color=always --all-files

  Build:
    if: ${{ ! inputs.release }}
    runs-on: ubuntu-22.04
    container:
      image: registry.aws.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    outputs:
      package_name: ${{ steps.bump.outputs.py_pkg_name }}
      package_version: ${{ steps.bump.outputs.py_pkg_version }}
      raise_commit : ${{steps.commit_id.outputs.commit_id}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Disabling shallow clone is recommended for improving relevancy of reporting
        fetch-depth: 0
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}

    - name: Upgrade pip
      run: python -m pip install pip --upgrade

    - name: Configure pip with custom index
      run: |
        mkdir -p ~/.config/pip
        echo "[global]" > ~/.config/pip/pip.conf
        echo "index-url = https://artifacts.cloud.mov.ai/repository/pypi-experimental/simple" >> ~/.config/pip/pip.conf
        echo "extra-index-url =" >> ~/.config/pip/pip.conf
        echo "  https://pypi.org/simple" >> ~/.config/pip/pip.conf
        echo "trusted-host =" >> ~/.config/pip/pip.conf
        echo "  artifacts.cloud.mov.ai" >> ~/.config/pip/pip.conf
        echo "  pypi.org" >> ~/.config/pip/pip.conf

    - name: Install build-requirements
      run: python -m pip install -r build-requirements.txt

    - name: Install python package
      run: python -m pip install .

    - name: Run Black
      if: ${{ inputs.run_black }}
      run: |
        python -m black \
          --line-length 100 \
          --diff \
          --check \
          .

    - name: Python Linters
      # run linters isolated so no issues are masked from SonarCloud
      run: |
        python -m flake8 \
          --isolated \
          --exclude dist,.*\.egg-info,.git,__pycache__,.tox,venv \
          --max-complexity 10 \
          --max-line-length 100 \
          --exit-zero \
          --output-file flake8-report.txt

        # pylint seems to not have a way to ignore configuration files
        # so we need to provide it a dummy one
        touch dummy-pylint-config

        python -m pylint \
          --rcfile dummy-pylint-config \
          --ignore-patterns dist,.*\.egg-info,.git,__pycache__,.tox,venv \
          --max-line-length 100 \
          --exit-zero \
          --output pylint-report.txt \
          .

    - name: Run tests
      run: |
        docker compose version || docker-compose --version
        if [ -f tox.ini ]; then
            # run tests and generates coverage.xml
            tox
        else
            # run tests
            python -m pytest tests/
        fi

    - name: Create SonarCloud project and disable autoscan
      uses: MOV-AI/action-sonarcloud-proj-config@v1
      with:
        sonar_org: 'mov-ai'
        sonar_token: ${{ secrets.sonar_token }}

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v4.2.1
      env:
        GITHUB_TOKEN: ${{ github.token }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.sonar_token }}
      with:
        projectBaseDir: ./
        args: >
          -Dsonar.organization=mov-ai
          -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
          -Dsonar.sources=.
          -Dsonar.scm.provider=git
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
          -Dsonar.coverage.exclusions=tests/**,docs/**
          -Dsonar.cpd.exclusions=tests/**,docs/**
          -Dsonar.python.version=3
          -Dsonar.python.flake8.reportPaths=flake8-report.txt
          -Dsonar.python.pylint.reportPaths=pylint-report.txt
          -Dsonar.python.coverage.reportPaths=coverage.xml

    - name: Link to SonarCloud dashboard
      shell: bash
      run: |
        echo "Please check report here: https://sonarcloud.io/project/overview?id=${{ github.repository_owner }}_${{ github.event.repository.name }}"

    - name: Raise version
      id: bump
      run: |
        python -m venv venv --clear
        . venv/bin/activate
        pip install bump-my-version==0.29.0
        bump-my-version bump build --no-tag --no-commit

        pkg_name=$(cat pyproject.toml | grep '^name = "' | cut -d '"' -f2)
        current_version=$(bump-my-version show current_version)
        echo "Bumped ${pkg_name} to version ${current_version}"

        echo "py_pkg_name=${pkg_name}" >> $GITHUB_OUTPUT
        echo "py_pkg_version=${current_version}" >> $GITHUB_OUTPUT

    - name: Commit auto raise version
      id: raise
      run: |
        git config --global --add safe.directory $(pwd)
        git config --global user.name ${{ secrets.auto_commit_user }}
        git config --global user.email ${{ secrets.auto_commit_mail }}
        git commit -am "[skip actions] Automatic Bump of build version to ${{ steps.bump.outputs.py_pkg_version }}"

    - name: Set branch output
      if: ${{ inputs.deploy }}
      id: var_branch
      run: |
        echo "Branch name is: ${GITHUB_REF#refs/heads/}"
        echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    - name: Raise App version
      if: ${{ inputs.deploy }}
      uses: CasperWA/push-protected@v2.14.0
      with:
        token: ${{ secrets.auto_commit_password }}
        branch: ${{ steps.var_branch.outputs.branch }}
        unprotect_reviews: true

    - name: Commit of version
      if: ${{ inputs.deploy }}
      id: commit_id
      run: |
        commit_hash=$(git log --format="%H" -n 1)
        echo "commit_id=${commit_hash}" >> $GITHUB_OUTPUT

    - name: build
      run: |
        python -m pip install build
        python -m build

    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: dist/*
        retention-days: 5

    - name: Publish package to TestPyPI Experimental
      uses: pypa/gh-action-pypi-publish@v1.11.0
      with:
        user: ${{ secrets.nexus_publisher_user }}
        password: ${{ secrets.nexus_publisher_password }}
        repository-url: https://artifacts.cloud.mov.ai/repository/pypi-experimental/

    - name: Build docs
      if: ${{ inputs.with_docs }}
      run: |
        VERSION=${GITHUB_REF##*/} tox -e docs
    - name: Checkout gh-pages
      if: ${{ inputs.deploy && inputs.with_docs }}
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages

    - name: Push docs
      if: ${{ inputs.deploy && inputs.with_docs }}
      run: |
        cd gh-pages
        # create .nojekyll
        touch .nojekyll
        # delete old folder if existed
        rm -rf ${GITHUB_REF##*/}
        # copy new docs and root index.html
        cp -r ../docs/build/* .
        # update versions.json
        ls -mQd */ | sed 's/\///g' | sed 's/^/[/' | sed 's/$/]/' > versions.json
        # set user
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        git config --global user.name "${{ github.actor }}"
        # commit docs
        git add .
        git commit -am "Updating docs for commit ${GITHUB_SHA} in ${GITHUB_REF}"
        # overwrite the contents of the gh-pages branch on our github.com repo
        git push --force --set-upstream origin gh-pages

    - name: Publish package to TestPyPI Integration
      if: ${{ inputs.deploy }}
      uses: pypa/gh-action-pypi-publish@v1.11.0
      with:
        user: ${{ secrets.nexus_publisher_user }}
        password: ${{ secrets.nexus_publisher_password }}
        repository-url: https://artifacts.cloud.mov.ai/repository/pypi-integration/


  Debian-Pack:
    if: ${{ ! inputs.release }}
    needs: [Build]
    runs-on: ubuntu-22.04
    container:
      image: registry.aws.cloud.mov.ai/qa/ros-buildtools-noetic:v2.0.10
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    outputs:
      package_name: ${{ needs.Build.outputs.package_name }}
      package_version: ${{ needs.Build.outputs.package_version }}
      raise_commit: ${{needs.Build.outputs.raise_commit}}
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Download a single artifact
      uses: actions/download-artifact@v4
      with:
        name: packages
        path: dist

    - name: Raise & Pack
      run: |
        dch -b -v "${{ needs.Build.outputs.package_version }}" "Auto created package version ${{ needs.Build.outputs.package_version }}"
        PKG_VERSION_ANCHOR='$PKG_VERSION'
        if test -f "./debian/postinst"; then
          sed -i "s/$PKG_VERSION_ANCHOR/${{ needs.Build.outputs.package_version }}/g" ./debian/postinst
        fi

        if test -f "./debian/prerm"; then
          sed -i "s/$PKG_VERSION_ANCHOR/${{ needs.Build.outputs.package_version }}/g" ./debian/prerm
        fi

        dpkg-buildpackage -nc -d -b -rfakeroot -us -uc -tc
        mkdir artifacts && \
        cp ../*.deb artifacts

    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: artifacts/*.deb
        retention-days: 5

  Publish:
    needs: [Debian-Pack]
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-22.04
    container:
      image: registry.aws.cloud.mov.ai/devops/py-buildserver:latest
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Publish to Nexus ppa-dev
        shell: bash
        run: |
            NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
            NEXUS_REPO="ppa-dev"

            for file in artifacts/*.deb
            do
              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
              -H "Content-Type: multipart/form-data" \
              --data-binary "@$file" \
              -w '%{http_code}' \
              "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

              #retry
              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Retrying"

                RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@$file" \
                  -w '%{http_code}' \
                  "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
              fi

              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Exiting"
                exit 1
              fi

            done

      - name: Publish to Nexus ppa-testing
        shell: bash
        run: |
            NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
            NEXUS_REPO="ppa-testing"

            for file in artifacts/*.deb
            do
              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
              -H "Content-Type: multipart/form-data" \
              --data-binary "@$file" \
              -w '%{http_code}' \
              "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

              #retry
              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Retrying"

                RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@$file" \
                  -w '%{http_code}' \
                  "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
              fi

              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Exiting"
                exit 1
              fi

            done

      - name: Create Github Release
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          title="Release of ${{ needs.Debian-Pack.outputs.package_version }}"
          git config --global --add safe.directory $(pwd)
          gh release create -p -t "$title" -n "Release notes for ${{ needs.Debian-Pack.outputs.package_name }}" \
          --target ${{ needs.Debian-Pack.outputs.raise_commit }} \
          --generate-notes \
          ${{ needs.Debian-Pack.outputs.package_version }}

          # add all files in the artifacts folder
          assets=()
          for asset in dist/*; do
            # do nothing if folder is empty
            if [[ $asset != "dist/*" ]]; then
              gh release upload ${{ needs.Debian-Pack.outputs.package_version }} $asset
            fi
          done
          for asset in artifacts/*; do
            # do nothing if folder is empty
            if [[ $asset != "artifacts/*" ]]; then
              gh release upload ${{ needs.Debian-Pack.outputs.package_version }} $asset
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

  Release-Pypi:
    if: ${{ inputs.release }}
    runs-on: ubuntu-22.04
    container:
      image: registry.aws.cloud.mov.ai/devops/py-buildserver:latest
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Fetch python artifact from github release
        run: |
          mkdir dist
          git config --global --add safe.directory $(pwd)
          cd dist
          gh release download ${{ steps.vars.outputs.tag}} -p *.whl
          gh release download ${{ steps.vars.outputs.tag}} -p *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Publish package to prod PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          user: ${{ secrets.nexus_publisher_user }}
          password: ${{ secrets.nexus_publisher_password }}
          repository-url: https://artifacts.cloud.mov.ai/repository/${{ inputs.prod_publish_pypi }}/


  Release-Deb:
    needs: [Release-Pypi]
    strategy:
      matrix:
        publish_repo: ${{ fromJSON(inputs.prod_publish_repos) }}
    if: ${{ inputs.release }}
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set tag output
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

    - name: Fetch debian artifacts from github release
      run: |
        mkdir artifacts
        git config --global --add safe.directory $(pwd)
        cd artifacts
        gh release download ${{ steps.vars.outputs.tag}} -p *.deb
      env:
        GITHUB_TOKEN: ${{ secrets.gh_token }}

    - name: Publish to Nexus
      shell: bash
      run: |
            NEXUS_REPO="${{ matrix.publish_repo }}"
            if [ "$NEXUS_REPO" != "ppa-public" ]; then
              NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
            else
              NEXUS_ENDPOINT="artifacts.aws.cloud.mov.ai"
            fi

            for file in artifacts/*.deb
            do
              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
              -H "Content-Type: multipart/form-data" \
              --data-binary "@$file" \
              -w '%{http_code}' \
              "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

              #retry
              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Retrying"

                RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@$file" \
                  -w '%{http_code}' \
                  "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
              fi

              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Exiting"
                exit 1
              fi

            done

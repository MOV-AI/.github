name: Build and pack py packages
on:
  workflow_call:
    inputs:
      deploy:
        required: false
        type: boolean
        default: false
      release:
        required: false
        type: boolean
        default: false
      pre_commit:
        required: false
        type: boolean
        default: false
      run_black:
        required: false
        type: boolean
        default: false
        description: When 'true' black is run stopping the pipeline if any files are not properly formatted
      with_docs:
        required: false
        type: boolean
        default: false
        description: When true documentation is published, the branch gh-pages must be created manually 'git checkout --orphan gh-pages && touch .nojekyll && git add .nojekyll && git commit -m "Initial commit" && git push --set-upstream origin gh-pages'
      prod_publish_repos:
        required: false
        type: string
        default: '["ppa-main"]'
      prod_publish_pypi:
        required: false
        type: string
        default: 'pypi-edge'
      PYTHON_VERSION:
        required: true
        type: string
        default: "3.8.10"
      test_on_host:
        required: false
        type: boolean
        default: false
        description: When true the tests are run on the host machine, otherwise they are run inside a container. Useful when running tests using docker compose
    secrets:
      auto_commit_user:
        required: false # only when deploy true
      auto_commit_mail:
        required: false # only when deploy true
      auto_commit_password:
        required: false
      registry_user:
        required: true
      registry_password:
        required: true
      nexus_publisher_user:
        required: true
      nexus_publisher_password:
        required: true
      gh_token:
        required: true
      sonar_token:
        required: true
env:
  REGISTRY: "registry.hel.mov.ai"

jobs:
  Build:
    uses: MOV-AI/.github/.github/workflows/py-workflow.yml@v2.3
    secrets: inherit
    with:
      pre_commit: true
      deploy: false
      with_docs: true
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION }}

  Debian-Pack:
    if: ${{ always() && ! inputs.release && needs.Build.result == 'success' }}
    needs: [Build]
    runs-on: ubuntu-22.04
    container:
      image: registry.aws.cloud.mov.ai/qa/ros-buildtools-noetic:v2.0.10
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    outputs:
      package_name: ${{ steps.bump.outputs.py_pkg_name }}
      package_version: ${{ steps.bump.outputs.py_pkg_version }}
      raise_commit: ${{needs.Build.outputs.raise_commit}}
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download a single artifact
      uses: actions/download-artifact@v4
      with:
        name: packages
        path: dist

    - name: Get package name
      id: bump
      run: |
        python -m venv venv --clear
        . venv/bin/activate
        pip install bump-my-version==0.29.0

        pkg_name=$(cat pyproject.toml | grep '^name = "' | cut -d '"' -f2)
        current_version=$(bump-my-version show current_version)

        echo "py_pkg_name=${pkg_name}" >> $GITHUB_OUTPUT
        echo "py_pkg_version=${current_version}" >> $GITHUB_OUTPUT

    - name: Raise & Pack
      run: |
        dch -b -v "${{ steps.bump.outputs.package_version }}" "Auto created package version ${{ steps.bump.outputs.package_version }}"
        PKG_VERSION_ANCHOR='$PKG_VERSION'
        if test -f "./debian/postinst"; then
          sed -i "s/$PKG_VERSION_ANCHOR/${{ steps.bump.outputs.package_version }}/g" ./debian/postinst
        fi

        if test -f "./debian/prerm"; then
          sed -i "s/$PKG_VERSION_ANCHOR/${{ steps.bump.outputs.package_version }}/g" ./debian/prerm
        fi

        dpkg-buildpackage -nc -d -b -rfakeroot -us -uc -tc
        mkdir artifacts && \
        cp ../*.deb artifacts

    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: artifacts/*.deb
        retention-days: 5

  Publish:
    needs: [Debian-Pack]
    if: ${{ always() && inputs.deploy && needs.Debian-Pack.result == 'success' }}
    runs-on: ubuntu-22.04
    container:
      image: registry.aws.cloud.mov.ai/devops/py-buildserver:latest
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Publish to Nexus ppa-dev
        shell: bash
        run: |
            NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
            NEXUS_REPO="ppa-dev"

            for file in artifacts/*.deb
            do
              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
              -H "Content-Type: multipart/form-data" \
              --data-binary "@$file" \
              -w '%{http_code}' \
              "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

              #retry
              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Retrying"

                RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@$file" \
                  -w '%{http_code}' \
                  "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
              fi

              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Exiting"
                exit 1
              fi

            done

      - name: Publish to Nexus ppa-testing
        shell: bash
        run: |
            NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
            NEXUS_REPO="ppa-testing"

            for file in artifacts/*.deb
            do
              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
              -H "Content-Type: multipart/form-data" \
              --data-binary "@$file" \
              -w '%{http_code}' \
              "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

              #retry
              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Retrying"

                RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@$file" \
                  -w '%{http_code}' \
                  "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
              fi

              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Exiting"
                exit 1
              fi

            done

      - name: Create Github Release
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          title="Release of ${{ needs.Debian-Pack.outputs.package_version }}"
          git config --global --add safe.directory $(pwd)
          gh release create -p -t "$title" -n "Release notes for ${{ needs.Debian-Pack.outputs.package_name }}" \
          --target ${{ needs.Debian-Pack.outputs.raise_commit }} \
          --generate-notes \
          ${{ needs.Debian-Pack.outputs.package_version }}

          # add all files in the artifacts folder
          assets=()
          for asset in dist/*; do
            # do nothing if folder is empty
            if [[ $asset != "dist/*" ]]; then
              gh release upload ${{ needs.Debian-Pack.outputs.package_version }} $asset
            fi
          done
          for asset in artifacts/*; do
            # do nothing if folder is empty
            if [[ $asset != "artifacts/*" ]]; then
              gh release upload ${{ needs.Debian-Pack.outputs.package_version }} $asset
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

  Release-Pypi:
    if: ${{ inputs.release }}
    runs-on: ubuntu-22.04
    container:
      image: registry.aws.cloud.mov.ai/devops/py-buildserver:latest
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Fetch python artifact from github release
        run: |
          mkdir dist
          git config --global --add safe.directory $(pwd)
          cd dist
          gh release download ${{ steps.vars.outputs.tag}} -p *.whl
          gh release download ${{ steps.vars.outputs.tag}} -p *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Publish package to prod PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          user: ${{ secrets.nexus_publisher_user }}
          password: ${{ secrets.nexus_publisher_password }}
          repository-url: https://artifacts.cloud.mov.ai/repository/${{ inputs.prod_publish_pypi }}/

  Release-Deb:
    needs: [Release-Pypi]
    strategy:
      matrix:
        publish_repo: ${{ fromJSON(inputs.prod_publish_repos) }}
    if: ${{ inputs.release }}
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set tag output
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

    - name: Fetch debian artifacts from github release
      run: |
        mkdir artifacts
        git config --global --add safe.directory $(pwd)
        cd artifacts
        gh release download ${{ steps.vars.outputs.tag}} -p *.deb
      env:
        GITHUB_TOKEN: ${{ secrets.gh_token }}

    - name: Publish to Nexus
      shell: bash
      run: |
            NEXUS_REPO="${{ matrix.publish_repo }}"
            if [ "$NEXUS_REPO" != "ppa-public" ]; then
              NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
            else
              NEXUS_ENDPOINT="artifacts.aws.cloud.mov.ai"
            fi

            for file in artifacts/*.deb
            do
              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
              -H "Content-Type: multipart/form-data" \
              --data-binary "@$file" \
              -w '%{http_code}' \
              "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

              #retry
              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Retrying"

                RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@$file" \
                  -w '%{http_code}' \
                  "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
              fi

              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Exiting"
                exit 1
              fi

            done

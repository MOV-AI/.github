name: Build and pack Ros packages
on:
  workflow_call:
    inputs:
      deploy:
        required: false
        type: string
        default: 'false'
      release:
        required: false
        type: string
        default: 'false'
      ros_distro:
        required: true
        type: string
      install_test:
        required: false
        type: boolean
        default: false
      prod_publish_repos:
        required: false
        type: string
        default: '["ppa-main"]'
      build_modes:
        required: false
        type: string
        default: '["release"]'
      PYTHON_VERSION:
        required: false
        type: string
        default: "3.8.10"
      run_catkin_tests:
        required: false
        type: boolean
        default: true
      propagate_to_projects:
        required: false
        type: boolean
        default: false
      MOBTEST_VERSION:
        required: false
        type: string
        default: "0.0.6.1"
      ROS_BUILDTOOLS_TAG:
        required: false
        type: string
        default: "v2.1.1"
      MOBROS_VERSION:
        required: false
        type: string
        default: "2.1.1.2"
      INSTALL_CONFLICT_HANDLING:
        required: false
        type: string
        default: ""
      component_name:
        required: false
        type: string
      vs_product_name:
        required: false
        type: string
      vs_product_version_pattern:
        required: false
        type: string
      test_repo_name:
        required: false
        type: string
      test_version:
        required: false
        type: string
      test_set:
        required: false
        type: string
      cluster:
        required: false
        default: "mary"
        type: string
      debug_component_tests_keep_alive:
        required: false
        default: false
        type: boolean
      run_stack_tests:
        required: false
        type: boolean
        default: true

    secrets:
      auto_commit_user:
        required: true
      auto_commit_mail:
        required: true
      auto_commit_pwd:
        required: true
      registry_user:
        required: true
      registry_password:
        required: true
      nexus_publisher_user:
        required: true
      nexus_publisher_password:
        required: true
      aws_sqs_rosdep_access_key:
        required: true
      aws_sqs_rosdep_secret_access_key:
        required: true
      gh_token:
        required: true
      sonar_token:
        required: true
      aws_access_key_id:
        required: false
      aws_secret_access_key:
        required: false
      proxmox_ve_sim_username:
        required: false
      proxmox_ve_sim_password:
        required: false
      ssh_priv_key:
        required: false
      slack_token_id:
        required: false


env:
  AWS_ACCESS_KEY_ID: ${{ secrets.aws_access_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_access_key }}
  AWS_DEFAULT_REGION: "eu-west-1"

jobs:

  RefreshSource:
    if: ${{ inputs.deploy == 'false' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: docker://chinthakagodawita/autoupdate-action:v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ secrets.auto_commit_pwd }}'
          MERGE_MSG: "Branch was auto-updated."
  
  Check-pre-commit:
    outputs:
      pre_commit_exists: ${{ steps.check.outputs.exists }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check if pre-commit config exists
        id: check
        run: |
          if [ -f ".pre-commit-config.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  Pre-commit:
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.ros_distro) }}
    needs: [Check-pre-commit]
    outputs:
      pre_commit_exists: ${{ needs.Check-pre-commit.outputs.pre_commit_exists }}
    if: ${{ needs.Check-pre-commit.outputs.pre_commit_exists == 'true' }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-${{ matrix.distro }}:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install yamllint -y
          python3 -m pip install pip --upgrade
          python3 -m pip install -r ./dev-requirements.txt

      - name: Run pre-commit
        run: |
          git config --global --add safe.directory $(pwd)
          python -m pre_commit run --show-diff-on-failure --color=always --all-files

  Build:
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.ros_distro) }}
        build_mode: ${{ fromJSON(inputs.build_modes) }}
    if: ${{ always() && inputs.release == 'false' && (needs.Pre-commit.result == 'success' || needs.Pre-commit.result == 'skipped') }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-${{ matrix.distro }}:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    needs: [Pre-commit]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clean repository from invalid package.xml files
      run: |
        python3 -m pip install catkin_lint --quiet --no-cache-dir
        echo "Identifying and removing package.xml files that cause internal errors in catkin_lint..."
        find -L ./ -type f -name 'package.xml' ! -path '*/.git/*' ! -path '*/.github/*' 2>/dev/null | while read -r file; do
          pkg_dir=$(dirname "$file")
          output=$(catkin_lint --quiet "$pkg_dir" 2>&1) || true
          if echo "$output" | grep -q "internal error"; then
            rm -vf "$file"
            echo "::warning file=$file::Removed package.xml that causes internal errors"
          fi
        done

    - name: Validate Repository Package.xml
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        expected_url="<url>$GITHUB_SERVER_URL/$GITHUB_REPOSITORY</url>"
        VALIDATION_FILE="/tmp/verification-failed"
        find -L ./ -type f -name 'package.xml' -exec sh -c '

        search_result=$(cat $0 | grep "$1")
        is_movai_package=$(cat $0 | grep "<name>movai_")

        # is movai package ?
        if [ -n "$is_movai_package" ]:
        then
          if [ -z "$search_result" ]:
          then
              echo "\e[31m$0"
              echo "$0" >> $2
          fi
        fi

        ' {} $expected_url $VALIDATION_FILE \;

        if [ -f $VALIDATION_FILE ];
        then
            echo "::error Validation failed::The following package.xml files are missing the URL tag"
            for file in $(cat $VALIDATION_FILE); do
                echo "::error file=$file::Please add $expected_url to the package.xml"
            done
            exit 1
        fi

    - name: Install Mobros
      run: |
        sudo apt update
        sudo apt install -y mobros=${{ inputs.MOBROS_VERSION }}

    - name: Setup link to Ros userspace
      run: |
        mkdir /opt/mov.ai/user/cache/ros/src/
        ln -s $(pwd)/* /opt/mov.ai/user/cache/ros/src/

    - name: Raise version and validate Ros repository
      run: mobros raise --workspace="$(pwd)"

    - name: Install build Requirements
      run: |
        sudo apt update
        sudo mobros install-build-dependencies --workspace="$(pwd)"

    - name: Build
      run: mobros build --mode ${{ matrix.build_mode }}

    - name: Pack
      run: |
        export MOVAI_OUTPUT_DIR="$(pwd)/artifacts"
        mobros pack --workspace="$(pwd)" --mode ${{ matrix.build_mode }}

    - name: Run post-build hooks
      if: ${{ needs.Pre-commit.outputs.pre_commit_exists == 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install yamllint -y
        python3 -m pip install -r ./dev-requirements.txt
        source /opt/mov.ai/workspaces/USER_ROS1/setup.bash
        git config --global --add safe.directory $(pwd)
        python3 -m pre_commit run --hook-stage manual --show-diff-on-failure --color=always --all-files

    - name: Run Catkin tests
      if: ${{ inputs.run_catkin_tests }}
      shell: bash
      run: |
        cd $ROS1_USER_WS
        catkin test

    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: artifacts/*
        retention-days: 5

    - name: Print generated packages
      run: |
        ls -la artifacts

    - name: Print generated rosdep
      run: |
        cat /usr/local/rosdep/ros-pkgs.yaml

    - name: Rosdep Publish
      if: ${{ inputs.deploy == 'true' }}
      run: |
        export AWS_DEFAULT_REGION="eu-west-1"
        export AWS_ACCESS_KEY_ID="${{ secrets.aws_sqs_rosdep_access_key }}"
        export AWS_SECRET_ACCESS_KEY='${{ secrets.aws_sqs_rosdep_secret_access_key }}'
        mobros publish
        cat /usr/local/rosdep/ros-pkgs.yaml

  Test:
    if: ${{ inputs.release == 'false' }}
    runs-on: ubuntu-22.04
    needs: [Build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          submodules: recursive

      - name: Install Mobtest
        run: |
          python3 -m pip install \
          -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple --extra-index-url https://pypi.org/simple \
          mobtest==${{ inputs.MOBTEST_VERSION }} --ignore-installed

      - name: Mobtest validations
        run: |
          mobtest repo --issues ./mobtest-issues.json .

      - name: Create SonarCloud project and disable autoscan
        if: ${{ false }}
        uses: MOV-AI/action-sonarcloud-proj-config@v1
        with:
          sonar_org: 'mov-ai'
          sonar_token: ${{ secrets.sonar_token }}

      - name: SonarCloud Scan
        if: ${{ false }}
        uses: SonarSource/sonarcloud-github-action@v1.8
        env:
          GITHUB_TOKEN: ${{ github.token }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.sonar_token }}
        with:
          projectBaseDir: ./
          args: >
            -Dsonar.organization=mov-ai
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.scm.provider=git
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.externalIssuesReportPaths=./mobtest-issues.json

      - name: Link to SonarCloud dashboard
        shell: bash
        run: |
          echo "Please check report here: https://sonarcloud.io/project/overview?id=${{ github.repository_owner }}_${{ github.event.repository.name }}"

  Package-Install-Test:
    if: ${{ inputs.release == 'false' }}
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.ros_distro) }}
        build_mode: ${{ fromJSON(inputs.build_modes) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-${{ matrix.distro }}:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    needs: [Build]
    steps:
      - name: Checkout
        if: ${{ inputs.install_test }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download artifacts
        if: ${{ inputs.install_test }}
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Install mobros
        if: ${{ inputs.install_test }}
        run: |
          sudo apt update
          sudo apt install mobros=${{ inputs.MOBROS_VERSION }} -y
      - name: Install debian artifacts
        if: ${{ inputs.install_test }}
        run: |
          cd artifacts/
          PACKAGES_INSTALL="$(find -L ./ -name "*.deb")"
          echo $PACKAGES_INSTALL
          INSTALL_CONFLICT_HANDLING=${{ inputs.INSTALL_CONFLICT_HANDLING }}
          if [ "$INSTALL_CONFLICT_HANDLING" != "" ]; then
            PACKAGES_INSTALL="$PACKAGES_INSTALL $INSTALL_CONFLICT_HANDLING"
          fi
          sudo mobros install $PACKAGES_INSTALL -y --upgrade-installed --fail-on-apt-update

      - name: Mobtest project validations
        if: ${{ inputs.install_test }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m pip install -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple --extra-index-url https://pypi.org/simple mobtest==${{ inputs.MOBTEST_VERSION }} --ignore-installed
          mobtest proj /opt/ros/${{ matrix.distro }}/share/

  Package-Stack-Tests:
    if: ${{ inputs.release == 'false' && inputs.deploy == 'true' && inputs.run_stack_tests }}
    needs: [Build]
    uses: MOV-AI/.github/.github/workflows/integration-build-robotics-component.yml@v2.3
    with:
      vs_product_name: ${{ inputs.vs_product_name }}
      vs_product_version_pattern: ${{ inputs.vs_product_version_pattern }}
      component_name: ${{ inputs.component_name }}
      test_repo_name: ${{ inputs.test_repo_name }}
      test_set: ${{ inputs.test_set }}
      test_version: ${{ inputs.test_version }}
      cluster: ${{ inputs.cluster }}
      debug_component_tests_keep_alive: ${{ inputs.debug_component_tests_keep_alive }}
    secrets: inherit

  Publish:
    if: ${{ always() && (needs.Package-Install-Test.result == 'success' || needs.Package-Install-Test.result == 'skipped') && (needs.Test.result == 'success' || needs.Test.result == 'skipped') && (needs.Package-Stack-Tests.result == 'success' || needs.Package-Stack-Tests.result == 'skipped') && inputs.deploy == 'true' }}
    runs-on: ubuntu-22.04
    needs:  [Package-Install-Test,Test,Package-Stack-Tests]
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-noetic:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download a single artifact
      uses: actions/download-artifact@v4
      with:
        name: packages
        path: artifacts

    - name: Print generated packages
      run: |
        ls -la .

    - name: Install Mobros
      run: python3 -m pip install mobros==${{ inputs.MOBROS_VERSION }} --ignore-installed

    - name: Raise version and validate Ros repository
      run: mobros raise --workspace="$(pwd)"

    - name: Find package details
      id: vars-after-raise
      run: |
            main_package=$(cat /tmp/main-package.mobrosinfo)
            build_version_section=$(cat $main_package | grep build_version)
            version_section=$(cat $main_package | grep "<version")
            main_version=$(echo $version_section | sed 's/ //g' | sed -e 's/<\w*>'//g | sed -e 's/<\/\w*>'//g)
            buildid=$(echo $build_version_section | sed 's/ //g' | sed -e 's/<\w*>'//g | sed -e 's/<\/\w*>'//g)
            VERSION="$main_version-$buildid"
            #echo ::set-output name=ros_pkg_version::$VERSION
            echo "ros_pkg_version=$VERSION" >> $GITHUB_OUTPUT

    - name: Publish to Nexus ppa-testing
      shell: bash
      run: |
          NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
          NEXUS_REPO="ppa-testing"

          for file in artifacts/*.deb
          do
            RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
            -H "Content-Type: multipart/form-data" \
            --data-binary "@$file" \
            -w '%{http_code}' \
            "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

            #retry
            if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
              echo "Failed upload with $RETURN_CODE. Retrying"

              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                -H "Content-Type: multipart/form-data" \
                --data-binary "@$file" \
                -w '%{http_code}' \
                "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
            fi

            if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
              echo "Failed upload with $RETURN_CODE. Exiting"
              exit 1
            fi

          done

    - name: Commit raise version
      id: raise
      run: |
        git config --global --add safe.directory $(pwd)
        git config --global user.name '${{ secrets.auto_commit_user }}'
        git config --global user.email '${{ secrets.auto_commit_mail }}'
        git config --global user.password ${{ secrets.auto_commit_pwd }}
        git pull
        git add **package.xml
        git commit -m "[skip actions] Automatic Bump of build version"

    - name: Prepare raise variables
      id: pre_raise
      run: |
        #echo ::set-output name=branch::${GITHUB_REF#refs/heads/}
        echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    - name: Raise App version
      uses: CasperWA/push-protected@v2.14.0
      with:
        token: ${{ secrets.auto_commit_pwd }}
        branch: ${{ steps.pre_raise.outputs.branch }}
        unprotect_reviews: true

    - name: Create Github Release
      shell: bash
      run: |
        commit_hash=$(git log --format="%H" -n 1)
        product_version=${{ steps.vars-after-raise.outputs.ros_pkg_version }}
        previous_version_option=""
        if gh release view ${{ steps.vars-after-raise.outputs.ros_pkg_version }} &>/dev/null; then
          previous_version_option="--notes-start-tag ${{ steps.vars-after-raise.outputs.ros_pkg_version }}"
        fi
        gh release create -p --generate-notes $previous_version_option --target $commit_hash -t "Release of $product_version" $product_version
        # add all files in the artifacts folder
        find artifacts -type f -exec gh release upload $product_version {} \;
      env:
        GITHUB_TOKEN: ${{ secrets.gh_token }}

    - name: Propagate release
      if: ${{ inputs.propagate_to_projects }}
      continue-on-error: true
      shell: bash
      run: |
        gh workflow run .github/workflows/PropagateRosToProjectsOnDispatch.yml \
          --repo MOV-AI/qa-automations \
          -f repo_name=${GITHUB_REPOSITORY#*/} \
          -f repo_version=${{ steps.vars-after-raise.outputs.ros_pkg_version }}
      env:
        GITHUB_TOKEN: ${{ secrets.auto_commit_pwd }}

  Release:
    strategy:
      matrix:
        publish_repo: ${{ fromJSON(inputs.prod_publish_repos) }}
    if: ${{ inputs.release == 'true' }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-noetic:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set tag output
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

    - name: Fetch artifact from github release
      run: |
        git config --global --add safe.directory $(pwd)
        mkdir artifacts
        cd artifacts
        gh release download ${{ steps.vars.outputs.tag}} -p *.deb
      env:
        GITHUB_TOKEN: ${{ secrets.gh_token }}

    - name: Publish to Nexus
      shell: bash
      run: |
            NEXUS_REPO="${{ matrix.publish_repo }}"
            if [ "$NEXUS_REPO" != "ppa-public" ]; then
              NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
            else
              NEXUS_ENDPOINT="artifacts.aws.cloud.mov.ai"
            fi

            for file in artifacts/*.deb
            do
              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
              -H "Content-Type: multipart/form-data" \
              --data-binary "@$file" \
              -w '%{http_code}' \
              "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

              #retry
              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Retrying"

                RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@$file" \
                  -w '%{http_code}' \
                  "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
              fi

              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Exiting"
                exit 1
              fi

            done

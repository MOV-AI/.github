name: Build and pack Ros packages
on:
  workflow_call:
    inputs:
      deploy:
        required: false
        type: string
        default: 'false'
      release:
        required: false
        type: string
        default: 'false'
      ros_distro:
        required: true
        type: string
        description: 'ROS distribution to build for, e.g. ["noetic"] or ["humble"]. Array format is required to allow for future support of multiple distributions in a single workflow run.'
      install_test:
        required: false
        type: boolean
        default: false
      prod_publish_repos:
        required: false
        type: string
        default: '["ppa-main"]'
      test_publish_repo:
        required: false
        type: string
        default: 'ppa-testing'
        description: Repository name for testing builds
      build_modes:
        required: false
        type: string
        default: '["release"]'
      run_catkin_tests:
        required: false
        type: boolean
        default: true
        description: Whether to run catkin tests during the build process (ROS1 only)
      propagate_to_projects:
        required: false
        type: boolean
        default: false
      MOBTEST_VERSION:
        required: false
        type: string
        default: "0.0.7.2"
      ROS_BUILDTOOLS_TAG:
        required: false
        type: string
        default: "3.0.11"
      FLOW_INITIATOR_TAG:
        required: false
        type: string
        default: "4.10.1.1"
      MOBROS_VERSION:
        required: false
        type: string
        default: "2.1.1.6"
      INSTALL_CONFLICT_HANDLING:
        required: false
        type: string
        default: ""
      component_name:
        required: false
        type: string
      vs_product_name:
        required: false
        type: string
      vs_product_version_pattern:
        required: false
        type: string
      test_repo_name:
        required: false
        type: string
      test_version:
        required: false
        type: string
      test_set:
        required: false
        type: string
      cluster:
        required: false
        default: "mary"
        type: string
      debug_component_tests_keep_alive:
        required: false
        default: false
        type: boolean
      run_stack_tests:
        required: false
        type: boolean
        default: false
      handle_submodules_on_deploy:
        required: false
        type: string
        default: "true"

    secrets:
      auto_commit_user:
        required: true
      auto_commit_mail:
        required: true
      auto_commit_pwd:
        required: true
      registry_user:
        required: true
      registry_password:
        required: true
      nexus_publisher_user:
        required: true
      nexus_publisher_password:
        required: true
      aws_sqs_rosdep_access_key:
        required: true
      aws_sqs_rosdep_secret_access_key:
        required: true
      gh_token:
        required: true
      sonar_token:
        required: true
      aws_access_key_id:
        required: false
      aws_secret_access_key:
        required: false
      proxmox_ve_sim_username:
        required: false
      proxmox_ve_sim_password:
        required: false
      ssh_priv_key:
        required: false
      slack_token_id:
        required: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.aws_access_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_access_key }}
  AWS_DEFAULT_REGION: "eu-west-1"
  ROS_DISTRO: ${{ fromJson(inputs.ros_distro)[0] }} # Currently only single distro is supported, so we take the first element of the array

jobs:
  RefreshSource:
    if: ${{ inputs.deploy == 'false' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: docker://chinthakagodawita/autoupdate-action:v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ secrets.auto_commit_pwd }}'
          MERGE_MSG: "Branch was auto-updated."

  Check-static-analysis-config:
    outputs:
      pre_commit_exists: ${{ steps.check.outputs.exists }}
      static_test_image_name: ${{ steps.distro_vars.outputs.static_test_image_name }}
      ros_workspace: ${{ steps.distro_vars.outputs.ros_workspace }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check if pre-commit config exists
        id: check
        run: |
          if [ -f ".pre-commit-config.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute distro specific vars
        id: distro_vars
        run: |
          if [ "${ROS_DISTRO}" = "noetic" ]; then
            # TODO: migrate to ros1-workspace:5.3.0.1 for EE 3.0 once the image is available
            # for now we need to use flow-initiator-noetic which contains the necessary pre-commit dependencies
            static_test_image_name="registry.cloud.mov.ai/qa/flow-initiator-noetic:${{ inputs.FLOW_INITIATOR_TAG }}"
            ros_workspace="/opt/mov.ai/workspaces/USER_ROS1"
          elif [ "${ROS_DISTRO}" = "humble" ]; then
            # TODO: expose the tag as an input once we have a stable image with the necessary pre-commit dependencies
            # for now we use spawner-base-humble which might not contain all the necessary dependencies
            static_test_image_name="registry.cloud.mov.ai/qa/spawner-base-humble:3.2.2"
            ros_workspace="/opt/mov.ai/workspaces/USER_ROS2"
          else
            echo "Unsupported ROS distribution: ${ROS_DISTRO}"
            exit 1
          fi

          echo "static_test_image_name=$static_test_image_name" >> $GITHUB_OUTPUT
          echo "ros_workspace=$ros_workspace" >> $GITHUB_OUTPUT

  Static-analysis:
    needs: [Check-static-analysis-config]
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.ros_distro) }}
    outputs:
      pre_commit_exists: ${{ needs.Check-static-analysis-config.outputs.pre_commit_exists }}
    if: ${{ needs.Check-static-analysis-config.outputs.pre_commit_exists == 'true' }}
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.Check-static-analysis-config.outputs.static_test_image_name }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run static analysis
        uses: MOV-AI/.github/.github/actions/pre-commit@v3
        with:
          args: "--color=always --show-diff-on-failure --all-files"
          ROS_WORKSPACE: ${{ needs.Check-static-analysis-config.outputs.ros_workspace }}
          GITHUB_TOKEN: ${{ secrets.gh_token }}

  Build:
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.ros_distro) }}
        build_mode: ${{ fromJSON(inputs.build_modes) }}
    if: ${{ always() && inputs.release == 'false' && (needs.Static-analysis.result == 'success' || needs.Static-analysis.result == 'skipped') }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-${{ matrix.distro }}:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    needs: [Static-analysis]

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Clean repository from invalid package.xml files
      run: |
        python3 -m pip install catkin_lint --quiet --no-cache-dir
        echo "Identifying and removing package.xml files that cause internal errors in catkin_lint..."
        find -L ./ -type f -name 'package.xml' ! -path '*/.git/*' ! -path '*/.github/*' 2>/dev/null | while read -r file; do
          pkg_dir=$(dirname "$file")
          output=$(catkin_lint --quiet "$pkg_dir" 2>&1) || true
          if echo "$output" | grep -q "internal error"; then
            rm -vf "$file"
            echo "::warning file=$file::Removed package.xml that causes internal errors"
          fi
        done

    - name: Validate Repository Package.xml
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        expected_url="<url>$GITHUB_SERVER_URL/$GITHUB_REPOSITORY</url>"
        echo "Expected URL: $expected_url"
        VALIDATION_FILE="/tmp/verification-failed"
        find -L ./ -type f -name 'package.xml' -exec sh -c '

        search_result=$(grep "$1" "$0")
        is_movai_package=$(grep "<name>movai_" "$0")

        # is movai package ?
        if [ -n "$is_movai_package" ]; then
          if [ -z "$search_result" ]; then
              echo "\e[31m$0"
              echo "$0" >> "$2"
          fi
        fi

        ' {} "$expected_url" "$VALIDATION_FILE" \;

        if [ -f "$VALIDATION_FILE" ]; then
            echo "::error Validation failed::The following package.xml files are missing the URL tag"
            while IFS= read -r file; do
              echo "::error file=$file::Please add $expected_url to the package.xml"
            done < "$VALIDATION_FILE"
            exit 1
        fi

    - name: Install Mobros and build tools
      run: |
        python3 -m pip install -i https://artifacts.cloud.mov.ai/repository/pypi-edge/simple --extra-index-url https://pypi.org/simple mobros==${{ inputs.MOBROS_VERSION }} --ignore-installed
        if [ "${{ matrix.distro }}" = "noetic" ]; then
          python3 -m pip install --upgrade wheel build
        else
          python3 -m pip install --upgrade 'setuptools>=70.0,<80' jaraco-functools wheel build
        fi

    - name: Setup link to Ros userspace
      run: |
        mkdir /opt/mov.ai/user/cache/ros/src/
        ln -s "$(pwd)"/* /opt/mov.ai/user/cache/ros/src/
        if [ "${{ matrix.distro }}" = "noetic" ]; then
          echo "ROS1 detected, no link to workspaces needed"
        elif [ "${{ matrix.distro }}" = "humble" ]; then
          echo "ROS2 detected, linking source to ROS2 workspace"
          ln -s "$(pwd)"/* /opt/mov.ai/workspaces/USER_ROS2/
        fi

    - name: Raise version and validate Ros repository
      run: mobros raise --workspace="$(pwd)"

    - name: Install build Requirements
      run: |
        sudo apt update
        sudo mobros install-build-dependencies --workspace="$(pwd)"

    - name: Build
      run: mobros build --mode ${{ matrix.build_mode }}

    - name: Pack
      run: |
        export MOVAI_OUTPUT_DIR="$(pwd)/artifacts"
        mobros pack --workspace="$(pwd)" --mode ${{ matrix.build_mode }}

    - name: Check for Python packages
      id: check_setup
      shell: bash
      run: |
        echo "Searching for Python packages with setup.py..."
        # Find all directories with setup.py files (excluding .git and .github directories)
        if find . -type f -name "setup.py" ! -path '*/.git/*' ! -path '*/.github/*' | grep -q .; then
          echo "setup_found=true" >> $GITHUB_OUTPUT
          echo "✓ Found setup.py file(s), will proceed with wheel building"
        else
          echo "setup_found=false" >> $GITHUB_OUTPUT
          echo "No setup.py files found, skipping wheel building"
        fi

    - name: Build Python wheels
      if: steps.check_setup.outputs.setup_found == 'true'
      shell: bash
      run: |
        export _PYTHON_BUILD_WHEEL_PKG=1
        find . -type f -name "setup.py" ! -path '*/.git/*' ! -path '*/.github/*' | while read -r setup_file; do
          pkg_dir=$(dirname "$setup_file")
          echo "Building wheel for: $pkg_dir"

          # Check if this is a ROS package (has package.xml)
          if [ -f "$pkg_dir/package.xml" ]; then
            echo "Building wheel for ROS package at: $pkg_dir"
            cd "$pkg_dir"

            # Build the wheel
            python3 -m build --wheel --no-isolation 2>&1 | tee build.log

            # Check if build was successful
            if [ ${PIPESTATUS[0]} -eq 0 ]; then
              if [ -d "dist" ]; then
                mkdir -p "../artifacts"
                cp dist/*.whl "../artifacts/" || echo "No wheels found in dist directory"
                echo "Successfully built wheels for $pkg_dir"
              fi
            else
              echo "Failed to build wheel for $pkg_dir"
            fi

            cd - > /dev/null
          fi
        done

    - name: Run Catkin tests
      if: ${{ inputs.run_catkin_tests && matrix.distro == 'noetic' }}
      shell: bash
      run: |
        cd $ROS1_USER_WS
        catkin test

    - name: Archive binary
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: artifacts/*
        retention-days: 5

    - name: Print generated packages
      run: |
        echo "=== Debian packages ===" && ls -la artifacts/*.deb 2>/dev/null || echo "No .deb files"
        echo "=== Python wheels ===" && ls -la artifacts/*.whl 2>/dev/null || echo "No .whl files"

    - name: Print generated rosdep
      run: |
        cat /usr/local/rosdep/ros-pkgs.yaml

    - name: Rosdep Publish
      if: ${{ inputs.deploy == 'true' }}
      run: |
        export AWS_DEFAULT_REGION="eu-west-1"
        export AWS_ACCESS_KEY_ID="${{ secrets.aws_sqs_rosdep_access_key }}"
        export AWS_SECRET_ACCESS_KEY='${{ secrets.aws_sqs_rosdep_secret_access_key }}'
        mobros publish
        cat /usr/local/rosdep/ros-pkgs.yaml

    - name: Publish wheels to PyPI Experimental
      shell: bash
      run: |
          WHEEL_COUNT=$(find artifacts -name "*.whl" | wc -l)
          if [ "$WHEEL_COUNT" -gt 0 ]; then
            echo "Found $WHEEL_COUNT wheel(s) to publish to PyPI Experimental"
            python3 -m pip install twine
            python3 -m twine upload --repository-url https://artifacts.aws.cloud.mov.ai/repository/pypi-experimental/ \
            --username "${{ secrets.nexus_publisher_user }}" \
            --password "${{ secrets.nexus_publisher_password }}" \
            artifacts/*.whl

          else
            echo "No wheels found, skipping PyPI publish"
          fi

  Post-build-static-analysis:
    if: ${{ inputs.release == 'false' && needs.Check-static-analysis-config.outputs.pre_commit_exists == 'true' }}
    needs: [Check-static-analysis-config, Build]
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.Check-static-analysis-config.outputs.static_test_image_name }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: artifacts

    - name: Install Mobros
      run: |
        python3 -m pip install -i https://artifacts.cloud.mov.ai/repository/pypi-edge/simple --extra-index-url https://pypi.org/simple mobros==${{ inputs.MOBROS_VERSION }} --ignore-installed

    - name: Check package is installable
      shell: bash
      run: |
        # Add test_publish_repo to apt sources to resolve dependencies
        echo "deb [arch=all] https://artifacts.cloud.mov.ai/repository/${{ inputs.test_publish_repo }} testing main" | sudo tee /etc/apt/sources.list.d/ppa-testing.list
        sudo apt update

        cd artifacts/
        PACKAGES_TO_INSTALL="${{ inputs.INSTALL_CONFLICT_HANDLING }}"
        PACKAGES_TO_INSTALL=$(find -L ./ -name "*.deb")
        sudo mobros install $PACKAGES_TO_INSTALL -y --upgrade-installed --fail-on-apt-update

    - name: Run post-build static analysis
      uses: MOV-AI/.github/.github/actions/pre-commit@v3
      with:
        args: "--hook-stage manual --show-diff-on-failure --color=always --all-files"
        GITHUB_TOKEN: ${{ secrets.gh_token }}

  Test:
    if: ${{ always() && inputs.release == 'false' && needs.Build.result == 'success' &&  fromJSON(inputs.ros_distro)[0] == 'noetic' && (needs.Post-build-static-analysis.result == 'success' || needs.Post-build-static-analysis.result == 'skipped') }}
    runs-on: ubuntu-22.04
    needs: [Build,Post-build-static-analysis]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          submodules: recursive

      - name: Install Mobtest
        run: |
          python3 -m pip install \
          -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple --extra-index-url https://pypi.org/simple \
          mobtest==${{ inputs.MOBTEST_VERSION }} --ignore-installed

      - name: Mobtest validations
        run: |
          mobtest repo --issues ./mobtest-issues.json .

      - name: Create SonarCloud project and disable autoscan
        if: ${{ false }}
        uses: MOV-AI/action-sonarcloud-proj-config@v1
        with:
          sonar_org: 'mov-ai'
          sonar_token: ${{ secrets.sonar_token }}

      - name: SonarCloud Scan
        if: ${{ false }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}
        with:
          projectBaseDir: ./
          args: >
            -Dsonar.organization=mov-ai
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.scm.provider=git
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.externalIssuesReportPaths=./mobtest-issues.json

      - name: Link to SonarCloud dashboard
        shell: bash
        run: |
          echo "Please check report here: https://sonarcloud.io/project/overview?id=${{ github.repository_owner }}_${{ github.event.repository.name }}"

  Package-Install-Test:
    if: ${{ always() && inputs.release == 'false' && needs.Build.result == 'success' && (needs.Post-build-static-analysis.result == 'success' || needs.Post-build-static-analysis.result == 'skipped') }}
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.ros_distro) }}
        build_mode: ${{ fromJSON(inputs.build_modes) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-${{ matrix.distro }}:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    needs: [Build,Post-build-static-analysis]
    steps:
      - name: Checkout
        if: ${{ inputs.install_test }}
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download artifacts
        if: ${{ inputs.install_test }}
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - name: Install mobros
        if: ${{ inputs.install_test }}
        run: |
          sudo apt update
          python3 -m pip install mobros==${{ inputs.MOBROS_VERSION }} --ignore-installed

      - name: Install debian artifacts
        if: ${{ inputs.install_test }}
        run: |
          cd artifacts/
          PACKAGES_TO_INSTALL="${{ inputs.INSTALL_CONFLICT_HANDLING }}"
          PACKAGES_TO_INSTALL=$(find -L ./ -name "*.deb")
          sudo mobros install $PACKAGES_TO_INSTALL -y --upgrade-installed --fail-on-apt-update

      - name: Mobtest project validations
        if: ${{ inputs.install_test }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m pip install -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple --extra-index-url https://pypi.org/simple mobtest==${{ inputs.MOBTEST_VERSION }} --ignore-installed
          mobtest proj /opt/ros/${{ matrix.distro }}/share/

  Package-Stack-Tests:
    if: ${{ always() && inputs.release == 'false' && inputs.deploy == 'true' && inputs.run_stack_tests && needs.Build.result == 'success' && (needs.Post-build-static-analysis.result == 'success' || needs.Post-build-static-analysis.result == 'skipped') }}
    needs: [Build,Post-build-static-analysis]
    uses: MOV-AI/.github/.github/workflows/integration-build-robotics-component.yml@v2.3
    with:
      vs_product_name: ${{ inputs.vs_product_name }}
      vs_product_version_pattern: ${{ inputs.vs_product_version_pattern }}
      component_name: ${{ inputs.component_name }}
      test_repo_name: ${{ inputs.test_repo_name }}
      test_set: ${{ inputs.test_set }}
      test_version: ${{ inputs.test_version }}
      cluster: ${{ inputs.cluster }}
      debug_component_tests_keep_alive: ${{ inputs.debug_component_tests_keep_alive }}
    secrets: inherit

  Publish:
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.ros_distro) }}
    if: ${{ always() && (needs.Package-Install-Test.result == 'success' || needs.Package-Install-Test.result == 'skipped') && (needs.Test.result == 'success' || needs.Test.result == 'skipped') && (needs.Package-Stack-Tests.result == 'success' || needs.Package-Stack-Tests.result == 'skipped') && inputs.deploy == 'true' }}
    runs-on: ubuntu-22.04
    needs:  [Package-Install-Test,Test,Package-Stack-Tests]
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-${{ matrix.distro }}:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        submodules: recursive

    - name: Download a single artifact
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: artifacts

    - name: Print generated packages
      run: |
        ls -la .

    - name: Install Mobros
      run: python3 -m pip install mobros==${{ inputs.MOBROS_VERSION }} --ignore-installed

    - name: Raise version and validate Ros repository
      run: mobros raise --workspace="$(pwd)"

    - name: Find package details
      id: vars-after-raise
      run: |
            main_package=$(cat /tmp/main-package.mobrosinfo)
            build_version_section=$(grep build_version "$main_package")
            version_section=$(grep "<version" "$main_package")
            main_version=$(echo "$version_section" | sed 's/ //g' | sed -e 's/<\w*>//g' | sed -e 's/<\/\w*>//g')
            buildid=$(echo "$build_version_section" | sed 's/ //g' | sed -e 's/<\w*>//g' | sed -e 's/<\/\w*>//g')
            VERSION="$main_version-$buildid"
            echo "ros_pkg_version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Publish to Nexus ${{ inputs.test_publish_repo }}
      shell: bash
      run: |
          NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
          NEXUS_REPO="${{ inputs.test_publish_repo }}"

          for file in artifacts/*.deb
          do
            RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
            -H "Content-Type: multipart/form-data" \
            --data-binary "@$file" \
            -w '%{http_code}' \
            "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

            #retry
            if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
              echo "Failed upload with $RETURN_CODE. Retrying"

              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                -H "Content-Type: multipart/form-data" \
                --data-binary "@$file" \
                -w '%{http_code}' \
                "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
            fi

            if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
              echo "Failed upload with $RETURN_CODE. Exiting"
              exit 1
            fi
          done

    - name: Commit raise version
      id: raise
      shell: bash
      run: |
        git config --global --add safe.directory "$(pwd)"
        git config --global user.name "${{ secrets.auto_commit_user }}"
        git config --global user.email "${{ secrets.auto_commit_mail }}"
        git config --global user.password "${{ secrets.auto_commit_pwd }}"
        if [ "${{ inputs.handle_submodules_on_deploy }}" = "true" ]; then
          git pull
        else
          git pull --no-recurse-submodules
        fi
        git add -- '**package.xml'
        git commit -m "[skip actions] Automatic Bump of build version"

    - name: Prepare raise variables
      id: pre_raise
      env:
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "branch=${HEAD_REF}" >> "$GITHUB_OUTPUT"
        else
          echo "branch=${REF_NAME}" >> "$GITHUB_OUTPUT"
        fi

    - name: Push version bump to protected branch
      uses: MOV-AI/.github/.github/actions/push-to-protected-branch@v3
      with:
        token: ${{ secrets.auto_commit_pwd }}
        git_user_email: ${{ secrets.auto_commit_mail }}
        git_user_name: ${{ secrets.auto_commit_user }}
        branch: ${{ steps.pre_raise.outputs.branch }}
        repository: ${{ github.repository }}

    - name: Create Github Release
      shell: bash
      run: |
        commit_hash=$(git log --format="%H" -n 1)
        product_version="${{ steps.vars-after-raise.outputs.ros_pkg_version }}"
        previous_version_option=""
        if gh release view "$product_version" &>/dev/null; then
          previous_version_option="--notes-start-tag $product_version"
        fi
        gh release create -p --generate-notes $previous_version_option --target "$commit_hash" -t "Release of $product_version" "$product_version"
        # add all files in the artifacts folder
        find artifacts -type f -exec gh release upload "$product_version" {} \;
      env:
        GITHUB_TOKEN: ${{ secrets.gh_token }}

    - name: Propagate release
      if: ${{ inputs.propagate_to_projects }}
      continue-on-error: true
      shell: bash
      run: |
        gh workflow run .github/workflows/PropagateRosToProjectsOnDispatch.yml \
          --repo MOV-AI/qa-automations \
          -f "repo_name=${GITHUB_REPOSITORY#*/}" \
          -f "repo_version=${{ steps.vars-after-raise.outputs.ros_pkg_version }}"
      env:
        GITHUB_TOKEN: ${{ secrets.auto_commit_pwd }}

  Release:
    strategy:
      matrix:
        publish_repo: ${{ fromJSON(inputs.prod_publish_repos) }}
        distro: ${{ fromJSON(inputs.ros_distro) }}
    if: ${{ inputs.release == 'true' }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/ros-buildtools-${{ matrix.distro }}:${{ inputs.ROS_BUILDTOOLS_TAG }}
      options: --user root
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set tag output
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

    - name: Fetch artifact from github release
      run: |
        git config --global --add safe.directory "$(pwd)"
        mkdir artifacts
        cd artifacts
        gh release download "${{ steps.vars.outputs.tag}}" -p "*.deb" -p "*.whl"
      env:
        GITHUB_TOKEN: ${{ secrets.gh_token }}

    - name: Publish to Nexus
      shell: bash
      run: |
            NEXUS_REPO="${{ matrix.publish_repo }}"
            if [ "$NEXUS_REPO" != "ppa-public" ]; then
              NEXUS_ENDPOINT="artifacts.cloud.mov.ai"
            else
              NEXUS_ENDPOINT="artifacts.aws.cloud.mov.ai"
            fi

            for file in artifacts/*.deb
            do
              RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
              -H "Content-Type: multipart/form-data" \
              --data-binary "@$file" \
              -w '%{http_code}' \
              "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")

              #retry
              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Retrying"

                RETURN_CODE=$(curl -u "${{ secrets.nexus_publisher_user }}:${{ secrets.nexus_publisher_password }}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@$file" \
                  -w '%{http_code}' \
                  "https://$NEXUS_ENDPOINT/repository/$NEXUS_REPO/")
              fi

              if [[ ! "$RETURN_CODE" =~ ^(200|201|202)$ ]]; then
                echo "Failed upload with $RETURN_CODE. Exiting"
                exit 1
              fi
            done

    - name: Publish wheels to PyPI Integration
      shell: bash
      run: |
          WHEEL_COUNT=$(find artifacts -name "*.whl" | wc -l)
          if [ "$WHEEL_COUNT" -gt 0 ]; then
            echo "Found $WHEEL_COUNT wheel(s) to publish to PyPI Integration"
            python3 -m pip install twine
            python3 -m twine upload --repository-url https://artifacts.aws.cloud.mov.ai/repository/pypi-integration/ \
            --username "${{ secrets.nexus_publisher_user }}" \
            --password "${{ secrets.nexus_publisher_password }}" \
            artifacts/*.whl
          else
            echo "No wheels found, skipping PyPI publish"
          fi

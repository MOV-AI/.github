name: Build and pack movai-service distribution packages
on:
  workflow_call:
    inputs:
      deploy:
        required: false
        type: string
        default: 'false'
      release:
        required: false
        type: string
        default: 'false'
      run_black:
        required: false
        type: string
        default: 'false'
        description: When 'true' black is run stopping the pipeline if any files are not properly formatted
      skip_testing:
        required: false
        type: string
        default: 'false'
      distributions:
        required: false
        type: string
        default: '["jammy", "noble", "rocky8"]'
      install_test:
        required: false
        type: string
        default: 'true'
      publish_endpoint:
        required: false
        type: string
        default: 'artifacts.cloud.mov.ai'
      prod_publish_repos:
        required: false
        type: string
        default: '["ppa-stable"]'
      prod_publish_pypi:
        required: false
        type: string
        default: 'pypi-edge'
      package_version_bump:
        required: false
        type: string
        default: ''
        description: build, patch, minor, major. If empty, will be auto-detected from PR labels/title.

    secrets:
      auto_commit_user:
        required: false # only when deploy true
      auto_commit_mail:
        required: false # only when deploy true
      auto_commit_password:
        required: false # only when deploy true
      registry_user:
        required: true
      registry_password:
        required: true
      nexus_publisher_user:
        required: true
      nexus_publisher_password:
        required: true
      gh_token:
        required: true
      sonar_token:
        required: true

jobs:
  RefreshSource:
    if: ${{ inputs.deploy == 'false' && inputs.release == 'false' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: docker://chinthakagodawita/autoupdate-action:v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ secrets.auto_commit_password }}'
          MERGE_MSG: "Branch was auto-updated."

  DetectVersionBump:
    if: ${{ inputs.release == 'false' }}
    runs-on: ubuntu-22.04
    outputs:
      bump_type: ${{ steps.detect_bump.outputs.bump_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect version bump type from PR labels/title
        id: detect_bump
        run: |
          git config --global --add safe.directory "$(pwd)"
          BUMP="build"
          if [ -n "${{ inputs.package_version_bump }}" ]; then
            BUMP="${{ inputs.package_version_bump }}"
          else
            # Try to detect from PR labels (if available)
            if [ -n "${{ github.event.pull_request.number }}" ]; then
              LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name')
              for label in $LABELS; do
                if [[ "$label" == "enhancement" ]]; then BUMP="minor"; break; fi
                if [[ "$label" == "bug" ]] || [[ "$label" == "dependencies" ]]; then BUMP="patch"; fi
              done
              # Fallback to PR title if no label found
              if [ "$BUMP" == "build" ]; then
                TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title --jq '.title')
                if [[ "$TITLE" =~ "BREAKING CHANGE" ]]; then
                  BUMP="major"
                else
                  if [[ "$TITLE" =~ "feat" ]]; then
                    BUMP="minor"
                  else
                    if [[ "$TITLE" =~ "fix" ]]; then
                      BUMP="patch"
                    fi
                  fi
                fi
              fi
            fi
          fi
          echo "bump_type=$BUMP" | tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

  StaticAnalysis:
    if: ${{ inputs.release == 'false' }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Disabling shallow clone is recommended for improving relevancy of reporting
        fetch-depth: 0

    - name: Install build-requirements
      run: |
        if [ -f build-apt-requirements.txt ]; then
          apt update
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          grep -vE "^\s*#" build-apt-requirements.txt | xargs apt install -y
        fi
        python3 -m pip install -r build-requirements.txt

    - name: Run Black
      if: ${{ inputs.run_black == 'true' }}
      run: |
        python3 -m black \
          --diff \
          --check \
          .

    - name: Python Linters
      run: |
        python3 -m flake8 \
          --isolated \
          --exclude dist,.*\.egg-info,.git,__pycache__,.tox,venv \
          --max-complexity 16 \
          --exit-zero \
          --output-file flake8-report.txt

        # pylint seems to not have a way to ignore configuration files
        # so we need to provide it a dummy one
        touch dummy-pylint-config
        python3 -m pylint \
          --rcfile dummy-pylint-config \
          --ignore-patterns dist,.*\.egg-info,.git,__pycache__,.tox,venv \
          --exit-zero \
          --recursive y \
          --output pylint-report.txt \
        .

    - name: Store python Linters files
      uses: actions/upload-artifact@v4
      with:
        name: linting_reports
        path: "./*-report.txt"
        retention-days: 5

  Build:
    needs: [StaticAnalysis, DetectVersionBump]
    if: ${{ inputs.release == 'false' }}
    runs-on: ubuntu-22.04
    outputs:
      package_version: ${{ steps.raise_version.outputs.py_pkg_version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Disabling shallow clone is recommended for improving relevancy of reporting
        fetch-depth: 0

    - name: Install build-requirements
      run: |
        git config --global --add safe.directory "$(pwd)"
        sudo apt-get update && sudo apt-get install -yq make
        make venv

    - name: Raise version locally
      id: raise_version
      env:
        PACKAGE_VERSION_BUMP: ${{ needs.DetectVersionBump.outputs.bump_type }}
      run: |
        . venv/bin/activate
        make bump_version
        # read the version from the file after bumping
        PACKAGE_VERSION="$(bump-my-version show current_version 2> /dev/null)"
        echo "py_pkg_version=$PACKAGE_VERSION" | tee -a "$GITHUB_OUTPUT"
        deactivate

    - name: Build
      run: |
        . venv/bin/activate
        python3 -m build -o dist/

    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: dist/*
        retention-days: 5

  Pack:
    if: ${{ inputs.release == 'false' }}
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.distributions) }}
    needs: [Build, DetectVersionBump]
    runs-on: ubuntu-22.04
    outputs:
      package_version: ${{ needs.Build.outputs.package_version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to registry.cloud.mov.ai Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.registry_user }}
        password: ${{ secrets.registry_password }}
        registry: registry.cloud.mov.ai

    - name: Raise & Pack in containers
      env:
        PACKAGE_VERSION: ${{ needs.Build.outputs.package_version }}
        PACKAGE_VERSION_BUMP: ${{ needs.DetectVersionBump.outputs.bump_type }}
      run: |
        make bump_version
        make pack_${{ matrix.distro }}

    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: pack_artifacts_${{ matrix.distro }}
        path: |
          artifacts/${{ matrix.distro }}/*.deb
          artifacts/${{ matrix.distro }}/*.rpm
        retention-days: 5

  Package-Test:
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.distributions) }}
    needs: [Build, Pack]
    if: ${{ inputs.release == 'false' && inputs.install_test == 'true' }}
    # for rocky8 we use ubuntu-24.04 for simple install test
    runs-on: ${{ matrix.distro == 'focal' && 'ubuntu-20.04' || matrix.distro == 'jammy' && 'ubuntu-22.04' || matrix.distro == 'noble' && 'ubuntu-24.04' || matrix.distro == 'rocky8' && 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      TOX_MARKER: "coretest"
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          verbose: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test requirements
        run: |
          python3 -m venv test_venv
          source test_venv/bin/activate
          python3 -m pip install -r build-requirements.txt
          deactivate

      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pack_artifacts_${{ matrix.distro }}
          path: artifacts
          merge-multiple: true

      - name: Install debian artifacts
        if: ${{ matrix.distro != 'rocky8' }}
        run: |
          sudo apt update
          sudo apt install -y ./artifacts/movai-service*

      - name: Run tests on debian artifacts
        if: ${{ inputs.skip_testing != 'true' && matrix.distro != 'rocky8' }}
        run: |
          source test_venv/bin/activate
          if [ -z "${{ env.TOX_MARKER }}" ]; then
            tox
          else
            tox -- -m ${{ env.TOX_MARKER }}
          fi
          deactivate

      - name: Run tests on rpm artifacts
        if: ${{ inputs.skip_testing != 'true' && matrix.distro == 'rocky8' }}
        run: |
          mkdir -p artifacts/${{ matrix.distro }}
          mv artifacts/movai-service*.rpm artifacts/${{ matrix.distro }}
          make test_${{ matrix.distro }}

      - name: Store tests reports for SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: coverage_report
          path: ./coverage.xml
        if: ${{ matrix.distro == fromJSON(inputs.distributions)[0] && inputs.skip_testing != 'true' }}

      - name: Store logs of journalctl
        shell: bash
        if: always()
        run: |
          mkdir -p logs
          journalctl -u movai-service > ./logs/movai-service-journal-${{ matrix.distro }}.log || true

      - name: Stash logs of journalctl
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package_test_journal_${{ matrix.distro }}
          path: ./logs/*
          retention-days: 5

  Package-Test-Rpm:
    if: ${{ inputs.release == 'false' && inputs.install_test == 'true' && inputs.skip_testing != 'true' }}
    needs: [Build, Pack]
    runs-on: oracle
    timeout-minutes: 90
    env:
      RPM_DISTRO: rocky8
      TOX_MARKER: "coretest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test requirements
        run: |
          python3.11 -m venv test_venv
          source test_venv/bin/activate
          python3.11 -m pip install -r build-requirements.txt -r requirements.txt
          deactivate

      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pack_artifacts_${{ env.RPM_DISTRO }}
          path: artifacts
          merge-multiple: true

      - name: Run tests on rpm artifacts
        shell: bash
        run: |
          mkdir -p artifacts/${{ env.RPM_DISTRO }}
          mv artifacts/movai-service*.rpm artifacts/${{ env.RPM_DISTRO }}
          sudo rpm -i artifacts/${{ env.RPM_DISTRO }}/movai-service*.rpm --replacefiles || true
          source test_venv/bin/activate
          if [ -z "${{ env.TOX_MARKER }}" ]; then
            pytest tests/ --cov=movai_service --cov=movai_cli --cov=extra-plugins --cov=scripts --cov-report=term --cov-report=xml -o log_cli=true -x
          else
            pytest tests/ --cov=movai_service --cov=movai_cli --cov=extra-plugins --cov=scripts --cov-report=term --cov-report=xml -o log_cli=true -x -m ${{ env.TOX_MARKER }}
          fi
          deactivate

      - name: Store logs of journalctl
        shell: bash
        if: always()
        run: |
          mkdir -p logs
          journalctl -u movai-service > ./logs/movai-service-journal-${{ env.RPM_DISTRO }}.log || true

      - name: Stash logs of journalctl
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package_rpm_test_journal_${{ env.RPM_DISTRO }}
          path: ./logs/*
          retention-days: 5

      - name: Clean up
        if: always()
        shell: bash
        run: |
          sudo rm -rf artifacts
          sudo rm -rf logs
          sudo rm -rf test_venv
          sudo dnf remove movai-service* -y || true

  SonarCloud:
    if: ${{ inputs.release == 'false' }}
    needs: [Build, Pack, Package-Test, Package-Test-Rpm]
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Disabling shallow clone is recommended for improving relevancy of reporting
        fetch-depth: 0

    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        name: coverage_report
        path: ./
      if: ${{ inputs.skip_testing != 'true' }}

    - name: Download linting reports
      uses: actions/download-artifact@v4
      with:
        name: linting_reports
        path: ./

    - name: Create SonarCloud project and disable autoscan
      uses: MOV-AI/action-sonarcloud-proj-config@v1
      with:
        sonar_org: 'mov-ai'
        sonar_token: ${{ secrets.sonar_token }}

    - name: SonarCloud Scan and Quality Gate check
      uses: SonarSource/sonarqube-scan-action@v4.2.1
      if: ${{ inputs.skip_testing != 'true' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.sonar_token }}
      with:
        projectBaseDir: ./
        args: >
          -Dsonar.organization=mov-ai
          -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
          -Dsonar.sources=.
          -Dsonar.scm.provider=git
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
          -Dsonar.coverage.exclusions=tests/**,docs/**
          -Dsonar.cpd.exclusions=tests/**,docs/**
          -Dsonar.python.version=3
          -Dsonar.python.line_length=120
          -Dsonar.python.cyclomatic.complexity=16
          -Dsonar.python.flake8.reportPaths=flake8-report.txt
          -Dsonar.python.pylint.reportPaths=pylint-report.txt
          -Dsonar.python.coverage.reportPaths=coverage.xml

    - name: SonarCloud Scan no Quality Gate check
      uses: SonarSource/sonarcloud-github-action@v2.0.2
      if: ${{ inputs.skip_testing == 'true' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.sonar_token }}
      with:
        projectBaseDir: ./
        args: >
          -Dsonar.organization=mov-ai
          -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
          -Dsonar.sources=.
          -Dsonar.scm.provider=git
          -Dsonar.qualitygate.wait=false
          -Dsonar.qualitygate.timeout=300
          -Dsonar.coverage.exclusions=tests/**,docs/**
          -Dsonar.cpd.exclusions=tests/**,docs/**
          -Dsonar.python.version=3
          -Dsonar.python.line_length=120
          -Dsonar.python.cyclomatic.complexity=16
          -Dsonar.python.flake8.reportPaths=flake8-report.txt
          -Dsonar.python.pylint.reportPaths=pylint-report.txt
          -Dsonar.python.coverage.reportPaths=coverage.xml

    - name: Link to SonarCloud dashboard
      shell: bash
      run: |
        echo "Please check report here: https://sonarcloud.io/project/overview?id=${{ github.repository_owner }}_${{ github.event.repository.name }}"

  Post-Build:
    if: ${{ inputs.release == 'false' }}
    needs: [Build, Pack, Package-Test, Package-Test-Rpm, SonarCloud, DetectVersionBump]
    runs-on: ubuntu-22.04
    outputs:
      package_version: ${{ needs.Build.outputs.package_version }}
      commit_id: ${{ steps.commit_id.outputs.commit_id }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build-requirements
      run: |
        sudo apt-get update && sudo apt-get install -yq make
        make venv

    - name: Commit raise version
      if: ${{ inputs.deploy == 'true' }}
      env:
        PACKAGE_VERSION: ${{ needs.Build.outputs.package_version }}
        PACKAGE_VERSION_BUMP: ${{ needs.DetectVersionBump.outputs.bump_type }}
        PACKAGE_VERSION_COMMIT_AND_TAG: "True"
      run: |
        git config --global --add safe.directory "$(pwd)"
        git config --global user.name ${{ secrets.auto_commit_user }}
        git config --global user.email ${{ secrets.auto_commit_mail }}
        . venv/bin/activate
        make bump_version
        deactivate

    - name: Set branch output
      id: var_branch
      env:
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BRANCH_NAME="$HEAD_REF"
        else
          BRANCH_NAME="$REF_NAME"
        fi
        echo "Branch name is: $BRANCH_NAME"
        echo "branch=$BRANCH_NAME" | tee -a "$GITHUB_OUTPUT"

    - name: Push raised version
      if: ${{ inputs.deploy == 'true' }}
      uses: CasperWA/push-protected@v2.16.0
      with:
        token: ${{ secrets.auto_commit_password }}
        branch: ${{ steps.var_branch.outputs.branch }}
        unprotect_reviews: true

    - name: Store commit id of version
      if: ${{ inputs.deploy == 'true' }}
      id: commit_id
      run: |
        git config --global --add safe.directory "$(pwd)"
        commit_hash=$(git log --format="%H" -n 1)
        echo "commit_id=$commit_hash" | tee -a "$GITHUB_OUTPUT"

  PublishPackagesToDev:
    needs: [Post-Build]
    if: ${{ inputs.release == 'false' }}
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.distributions) }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pack_artifacts_${{ matrix.distro }}
          path: artifacts
          merge-multiple: true

      - name: Publish to Nexus ppa-dev
        if: ${{ matrix.distro != 'rocky8' }}
        uses: MOV-AI/.github/.github/actions/publish-to-nexus@v3
        with:
          repo: ppa-devel-${{ matrix.distro }}
          endpoint: ${{ inputs.publish_endpoint }}
          file_pattern: "artifacts/*.deb"
          file_type: "deb"
          user: ${{ secrets.nexus_publisher_user }}
          password: ${{ secrets.nexus_publisher_password }}

      - name: Publish to Nexus yum-dev
        if: ${{ matrix.distro == 'rocky8' }}
        uses: MOV-AI/.github/.github/actions/publish-to-nexus@v3
        with:
          repo: yum-dev
          endpoint: ${{ inputs.publish_endpoint }}
          file_pattern: "artifacts/*.rpm"
          file_type: "rpm"
          user: ${{ secrets.nexus_publisher_user }}
          password: ${{ secrets.nexus_publisher_password }}

  PublishPyPi:
    needs: [Post-Build]

    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Install build-requirements
        run: |
          python3 -m pip install -r build-requirements.txt

      - name: Publish package to TestPyPI Experimental (dev branches or PRs)
        if: ${{ inputs.release == 'false' }}
        run: |
          python3 -m twine upload --repository-url https://${{ inputs.publish_endpoint }}/repository/pypi-experimental/ \
            --username ${{ secrets.nexus_publisher_user }} \
            --password ${{ secrets.nexus_publisher_password }} \
            dist/*
          echo "Published to TestPyPI Experimental"


      - name: Publish package to TestPyPI Integration
        if: ${{ inputs.deploy == 'true' }}
        run: |
          python3 -m twine upload --repository-url https://${{ inputs.publish_endpoint }}/repository/pypi-integration/ \
            --username ${{ secrets.nexus_publisher_user }} \
            --password ${{ secrets.nexus_publisher_password }} \
            dist/*
          echo "Published to TestPyPI Integration"

  PublishPackagesToStaging:
    needs: [Post-Build]
    if: ${{ inputs.deploy == 'true' }}
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.distributions) }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pack_artifacts_${{ matrix.distro }}
          path: artifacts
          merge-multiple: true

      - name: Publish to Nexus ppa-testing
        if: ${{ matrix.distro != 'rocky8' }}
        uses: MOV-AI/.github/.github/actions/publish-to-nexus@v3
        with:
          repo: ppa-testing-${{ matrix.distro }}
          endpoint: ${{ inputs.publish_endpoint }}
          file_pattern: "artifacts/*.deb"
          file_type: "deb"
          user: ${{ secrets.nexus_publisher_user }}
          password: ${{ secrets.nexus_publisher_password }}

      - name: Publish to Nexus yum-testing
        if: ${{ matrix.distro == 'rocky8' }}
        uses: MOV-AI/.github/.github/actions/publish-to-nexus@v3
        with:
          repo: yum-testing
          endpoint: ${{ inputs.publish_endpoint }}
          file_pattern: "artifacts/*.rpm"
          file_type: "rpm"
          user: ${{ secrets.nexus_publisher_user }}
          password: ${{ secrets.nexus_publisher_password }}

  Github-Release:
    needs: [Post-Build, PublishPyPi, PublishPackagesToStaging]
    runs-on: ubuntu-22.04
    if: ${{ inputs.deploy == 'true' }}
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages_*
          path: dist
          merge-multiple: true

      - name: Create Github Release
        shell: bash
        run: |
          git config --global user.name ${{ secrets.auto_commit_user }}
          git config --global user.email ${{ secrets.auto_commit_mail }}
          git config --global --add safe.directory "$(pwd)"
          title="Release of ${{ needs.Post-Build.outputs.package_version }}"
          gh release create -p -t "$title" \
          -n "Release notes of version ${{ needs.Post-Build.outputs.package_version }}" \
          --target "${{ needs.Post-Build.outputs.commit_id }}" \
          --generate-notes \
           ${{ needs.Post-Build.outputs.package_version }}

          # add all files in the artifacts folder
          for asset in dist/*; do
            # do nothing if folder is empty
            if [[ $asset != "dist/*" ]]; then
              gh release upload ${{ needs.Post-Build.outputs.package_version }} "$asset"
            fi
          done
          for asset in artifacts/*; do
            # do nothing if folder is empty
            if [[ $asset != "artifacts/*" ]]; then
              gh release upload ${{ needs.Post-Build.outputs.package_version }} "$asset"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

  Github-Release-Packages-Upload:
    needs: [Post-Build, Github-Release]
    runs-on: ubuntu-22.04
    if: ${{ inputs.deploy == 'true' }}
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.distributions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pack_artifacts_${{ matrix.distro }}
          path: artifacts
          merge-multiple: true

      - name: Update Github Release with debian artifacts
        if: ${{ matrix.distro != 'rocky8' }}
        shell: bash
        run: |
          git config --global user.name ${{ secrets.auto_commit_user }}
          git config --global user.email ${{ secrets.auto_commit_mail }}
          git config --global --add safe.directory "$(pwd)"
          for asset in artifacts/*.deb; do
            # do nothing if folder is empty
            if [[ $asset != "artifacts/*" ]]; then
              # Add sufix of distro to asset name
              asset_renamed=$(basename "$asset" .deb)_${{ matrix.distro }}.deb
              cp "$asset" "$asset_renamed"
              gh release upload ${{ needs.Post-Build.outputs.package_version }} "$asset_renamed"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Update Github Release with rpm artifacts
        if: ${{ matrix.distro == 'rocky8' }}
        shell: bash
        run: |
          git config --global user.name ${{ secrets.auto_commit_user }}
          git config --global user.email ${{ secrets.auto_commit_mail }}
          git config --global --add safe.directory "$(pwd)"
          for asset in artifacts/*.rpm; do
            # do nothing if folder is empty
            if [[ $asset != "artifacts/*" ]]; then
              # Add sufix of distro to asset name
              asset_renamed=$(basename "$asset" .rpm)_${{ matrix.distro }}.rpm
              cp "$asset" "$asset_renamed"
              gh release upload ${{ needs.Post-Build.outputs.package_version }} "$asset_renamed"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

  ReleasePypi:
    if: ${{ inputs.release == 'true' }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" | tee -a "$GITHUB_OUTPUT"

      - name: Fetch artifact from github release
        run: |
          git config --global --add safe.directory "$(pwd)"
          mkdir artifacts && cd artifacts
          gh release download ${{ steps.vars.outputs.tag}} -p "*.deb"
          gh release download ${{ steps.vars.outputs.tag}} -p "*.rpm"
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Archive binary
        uses: actions/upload-artifact@v4
        with:
          name: released_artifacts
          path: |
            artifacts/*.deb
            artifacts/*.rpm
          retention-days: 5

      - name: Publish package to prod PyPI
        uses: pypa/gh-action-pypi-publish@v1.11.0
        with:
          user: ${{ secrets.nexus_publisher_user }}
          password: ${{ secrets.nexus_publisher_password }}
          repository-url: https://${{ inputs.publish_endpoint }}/repository/${{ inputs.prod_publish_pypi }}/

  ReleasePackagesToProd:
    needs: [ReleasePypi]
    if: ${{ inputs.release == 'true' }}
    runs-on: ubuntu-22.04
    container:
      image: registry.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    strategy:
      matrix:
        publish_repo: ${{ fromJSON(inputs.prod_publish_repos) }}
        distro: ${{ fromJSON(inputs.distributions) }}
      max-parallel: 1

    steps:
    - name: Download pack artifacts
      uses: actions/download-artifact@v4
      with:
        name: released_artifacts
        path: artifacts/

    - name: Publish debian packages to Nexus
      if: ${{ matrix.distro != 'rocky8' }}
      uses: MOV-AI/.github/.github/actions/publish-to-nexus@v3
      with:
        repo: ${{ matrix.publish_repo }}-${{ matrix.distro }}
        endpoint: ${{ inputs.publish_endpoint }}
        file_pattern: "artifacts/*_${{ matrix.distro }}.deb"
        file_type: "deb"
        user: ${{ secrets.nexus_publisher_user }}
        password: ${{ secrets.nexus_publisher_password }}

    - name: Publish to Nexus yum-integration
      if: ${{ matrix.distro == 'rocky8' }}
      uses: MOV-AI/.github/.github/actions/publish-to-nexus@v3
      with:
        repo: yum-integration
        endpoint: ${{ inputs.publish_endpoint }}
        file_pattern: "artifacts/*_${{ matrix.distro }}.rpm"
        file_type: "rpm"
        user: ${{ secrets.nexus_publisher_user }}
        password: ${{ secrets.nexus_publisher_password }}

name: Build, Deploy and release Docker images
on:
  workflow_call:
    inputs:
      docker_file:
        required: true
        type: string
        description: path to the Dockerfile used for build step
      docker_image:
        required: true
        type: string
        description: name of image used for build step and optional push to registries
      build_args:
        required: false
        type: string
        description: list of arguments used for build step (comma separated)
      platforms:
        required: false
        type: string
        default: linux/amd64 #,linux/arm/v7
        description: list of platform to build and optionally push (comma separated)
      version:
        required: false
        type: string
        default: auto
        description: version to use for the docker image, 'auto' to auto bump version on deploy
      deploy:
        required: false
        type: boolean
        default: false
        description: boolean to enable push
      push_latest:
        required: false
        type: boolean
        default: false
        description: boolean to override latest tag on push
      docker_registry:
        required: false
        type: string
        default: registry.cloud.mov.ai
        description: primary registry used for push
      public:
        required: false
        type: boolean
        default: false
        description: boolean to enable secondary public registry push
      public_registry:
        required: false
        type: string
        default: pubregistry.aws.cloud.mov.ai
        description: secondary public registry used for push
      github_registry:
        required: false
        type: string
        default: ghcr.io/mov-ai
        description: github public registry used for push
      public_image:
        required: false
        type: string
        description: secondary public name of image used for build step and optional push to registries
      snyk_check:
        required: false
        type: boolean
        default: false
        description: boolean to enable snyk security analysis
      download_artifact:
        required: false
        type: boolean
        default: false
        description: boolean to enable download of 'packages' artifacts to be included in build
      download_artifact_name:
        required: false
        type: string
        default: "artifacts"
        description: artifact name to download
      download_artifact_path:
        required: false
        type: string
        default: ./dist
        description: path where package is downloaded
      target:
        required: false
        type: string
        default:
        description: string of docker build target
    secrets:
      registry_user:
        required: true
      registry_password:
        required: true
      pub_registry_user:
        required: false
      pub_registry_password:
        required: false
      github_registry_user:
        required: false
      github_registry_password:
        required: false
      snyk_token:
        required: false
      commit_user:
        required: false
      commit_mail:
        required: false
      commit_token:
        required: false

jobs:

  static-analyze:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Hadolint ${{ inputs.docker_file }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.docker_file }}
          format: tty
          failure-threshold: error

  raise-version:
    runs-on: ubuntu-22.04
    outputs:
      package_version: ${{ steps.get_version.outputs.version }}
      branch_name: ${{ steps.branch.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use manual version
        if: ${{ inputs.version != 'auto' }}
        id: manual_version
        run: |
          echo "version=${{ inputs.version }}" | tee -a "$GITHUB_OUTPUT"
          echo "Using manual version: ${{ inputs.version }}"

      - name: Install bump-my-version
        if: ${{ inputs.version == 'auto' }}
        run: python3 -m pip install bump-my-version

      - name: Bump version (deploy only)
        if: ${{ inputs.version == 'auto' && inputs.deploy }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          git config --global user.name "${{ secrets.commit_user }}"
          git config --global user.email "${{ secrets.commit_mail }}"
          bump-my-version bump patch --no-tag

      - name: Get branch name
        if: ${{ inputs.version == 'auto' }}
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${HEAD_REF}" | tee -a "$GITHUB_OUTPUT"
          else
            echo "name=${REF_NAME}" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Get version from bump-my-version
        if: ${{ inputs.version == 'auto' }}
        id: auto_version
        run: |
          VERSION=$(bump-my-version show current_version)
          echo "version=${VERSION}" | tee -a "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Set final version
        id: get_version
        run: |
          if [ "${{ inputs.version }}" != 'auto' ]; then
            echo "version=${{ steps.manual_version.outputs.version }}" | tee -a "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.auto_version.outputs.version }}" | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    needs: [static-analyze, raise-version]
    runs-on: ubuntu-22.04
    outputs:
      docker_image: ${{ steps.get_image_names.outputs.GITHUB_DOCKER_IMAGE }}
      ofc_image_dir: ${{ steps.get_image_names.outputs.OFC_IMAGE_DIR }}
      ofc_image_name: ${{ steps.get_image_names.outputs.OFC_IMAGE_NAME }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}
          registry: ${{ inputs.docker_registry }}

      - name: Login to Public Registry (for push permission)
        if: ${{ inputs.public }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.pub_registry_user }}
          password: ${{ secrets.pub_registry_password }}
          registry: ${{ inputs.public_registry }}

      - name: Login to Public Github Registry (for push permission)
        if: ${{ inputs.public }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.github_registry_user }}
          password: ${{ secrets.github_registry_password }}
          registry: ${{ inputs.github_registry }}

      - name: Compute docker image names
        id: get_image_names
        env:
          VERSION: ${{ needs.raise-version.outputs.package_version }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          OFC_IMAGE_DIR="${DOCKER_IMAGE%%/*}"
          OFC_IMAGE_NAME="${DOCKER_IMAGE#*/}"
          
          echo "OFC_IMAGE_DIR=${OFC_IMAGE_DIR}" | tee -a "$GITHUB_OUTPUT"
          echo "OFC_IMAGE_NAME=${OFC_IMAGE_NAME}" | tee -a "$GITHUB_OUTPUT"
          
          # Build only for CI directory
          DOCKER_IMAGES_TMP="${{ inputs.docker_registry }}/ci/${OFC_IMAGE_NAME}:${VERSION}"

          echo "DOCKER_IMAGES=${DOCKER_IMAGES_TMP}" | tee -a "$GITHUB_OUTPUT"
          echo -e "Docker images to build:\n${DOCKER_IMAGES_TMP}"

      - name: Compute docker build arguments
        id: get_build_args
        run: |
          BUILD_ARGS_STR_LIST="${{ inputs.build_args }}"
          if [ -n "${BUILD_ARGS_STR_LIST}" ]; then
            echo "build_args_str_list=${BUILD_ARGS_STR_LIST}" | tee -a "$GITHUB_OUTPUT"
            echo -e "Docker build arguments:\n${BUILD_ARGS_STR_LIST}"
          fi

      - name: Compute docker label and outputs arguments
        id: get_label_and_outputs_args
        env:
          VERSION: ${{ needs.raise-version.outputs.package_version }}
        run: |
          LABEL_SRC="org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          LABEL_VERSION="org.opencontainers.image.version=${VERSION}"
          LABEL_DESCRIPTION=""
          OUTPUTS_ARGS_STR_LIST=""

          IFS=', ' read -r -a platforms_array <<< "${{ inputs.platforms }}"
          if [ "${#platforms_array[@]}" -gt 1 ]; then
            OUTPUTS_ARGS_STR_LIST="type=image,name=target,annotation-index.org.opencontainers.image.description=Version ${VERSION} of repo ${{ github.repository }}"
          else
            LABEL_DESCRIPTION="org.opencontainers.image.description=Version ${VERSION} of repo ${{ github.repository }}"
          fi

          {
            echo "label_description=${LABEL_DESCRIPTION}"
            echo "label_source=${LABEL_SRC}"
            echo "label_version=${LABEL_VERSION}"
            echo "outputs_args_str_list=${OUTPUTS_ARGS_STR_LIST}"
          } >> "$GITHUB_OUTPUT"

      - name: Download packages to include in build
        if: inputs.download_artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.download_artifact_name }}
          path: ${{ inputs.download_artifact_path }}

      - name: Set up QEMU for multi platform
        if: ${{ contains(inputs.platforms, 'arm') }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with args and push:${{ inputs.deploy }}
        if: ${{ steps.get_build_args.outputs.build_args_str_list != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          file: ${{ inputs.docker_file }}
          push: ${{ inputs.deploy }}
          tags: ${{ steps.get_image_names.outputs.DOCKER_IMAGES }}
          labels: |
            ${{ steps.get_label_and_outputs_args.outputs.label_source }}
            ${{ steps.get_label_and_outputs_args.outputs.label_version }}
            ${{ steps.get_label_and_outputs_args.outputs.label_description }}
          outputs: ${{ steps.get_label_and_outputs_args.outputs.outputs_args_str_list }}
          target: ${{ inputs.target }}
          pull: true
          build-args: ${{ steps.get_build_args.outputs.build_args_str_list }}

      - name: Build and push:${{ inputs.deploy }}
        if: ${{ steps.get_build_args.outputs.build_args_str_list == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          file: ${{ inputs.docker_file }}
          push: ${{ inputs.deploy }}
          tags: ${{ steps.get_image_names.outputs.DOCKER_IMAGES }}
          labels: |
            ${{ steps.get_label_and_outputs_args.outputs.label_source }}
            ${{ steps.get_label_and_outputs_args.outputs.label_version }}
            ${{ steps.get_label_and_outputs_args.outputs.label_description }}
          outputs: ${{ steps.get_label_and_outputs_args.outputs.outputs_args_str_list }}
          target: ${{ inputs.target }}
          pull: true

  test:
    needs: [raise-version, build]
    if: ${{ inputs.public && inputs.snyk_check && inputs.deploy }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Snyk security scan
        id: snyk
        uses: snyk/actions/docker@master
        continue-on-error: true
        timeout-minutes: 10
        env:
          SNYK_TOKEN: ${{ secrets.snyk_token }}
        with:
          args: --severity-threshold=high --file=${{ inputs.docker_file }}
          image: ${{ needs.build.outputs.docker_image }}

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        continue-on-error: true
        with:
          sarif_file: snyk.sarif

      - name: Login to registry on Snyk failure
        if: ${{ steps.snyk.outcome == 'failure' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.github_registry_user }}
          password: ${{ secrets.github_registry_password }}
          registry: ${{ inputs.github_registry }}

      - name: Run Docker image on Snyk failure
        if: ${{ steps.snyk.outcome == 'failure' }}
        run: |
          echo "Snyk scan failed - running Docker image for validation..."
          docker run --rm ${{ needs.build.outputs.docker_image }} --version || echo "Container smoke test completed"

  publish:
    needs: [raise-version, build, test]
    if: ${{ inputs.version == 'auto' && inputs.deploy && always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Private Registry (for push permission)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}
          registry: ${{ inputs.docker_registry }}

      - name: Login to Public Registry (for push permission)
        if: ${{ inputs.public }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.pub_registry_user }}
          password: ${{ secrets.pub_registry_password }}
          registry: ${{ inputs.public_registry }}

      - name: Distribute images to official and public registries
        env:
          VERSION: ${{ needs.raise-version.outputs.package_version }}
          LATEST: ${{ inputs.push_latest }}
          PUBLIC: ${{ inputs.public }}
          OFC_IMAGE_DIR: ${{ needs.build.outputs.ofc_image_dir }}
          OFC_IMAGE_NAME: ${{ needs.build.outputs.ofc_image_name }}
        run: |
          # Pull from CI directory
          docker pull ${{ inputs.docker_registry }}/ci/${OFC_IMAGE_NAME}:${VERSION}
          
          # Push to official directory with version tag
          docker tag ${{ inputs.docker_registry }}/ci/${OFC_IMAGE_NAME}:${VERSION} \
                     ${{ inputs.docker_registry }}/${OFC_IMAGE_DIR}/${OFC_IMAGE_NAME}:${VERSION}
          docker push ${{ inputs.docker_registry }}/${OFC_IMAGE_DIR}/${OFC_IMAGE_NAME}:${VERSION}
          
          # Handle latest tag
          if [ "${LATEST}" = "true" ]; then
            docker tag ${{ inputs.docker_registry }}/ci/${OFC_IMAGE_NAME}:${VERSION} \
                       ${{ inputs.docker_registry }}/${OFC_IMAGE_DIR}/${OFC_IMAGE_NAME}:latest
            docker push ${{ inputs.docker_registry }}/${OFC_IMAGE_DIR}/${OFC_IMAGE_NAME}:latest
          fi
          
          # Handle public registries
          if [ "${PUBLIC}" = "true" ]; then
            # Push to public registry
            docker tag ${{ inputs.docker_registry }}/ci/${OFC_IMAGE_NAME}:${VERSION} \
                       ${{ inputs.public_registry }}/${{ inputs.public_image }}:${VERSION}
            docker push ${{ inputs.public_registry }}/${{ inputs.public_image }}:${VERSION}
            
            # Push to GitHub registry
            docker tag ${{ inputs.docker_registry }}/ci/${OFC_IMAGE_NAME}:${VERSION} \
                       ${{ inputs.github_registry }}/${{ inputs.public_image }}:${VERSION}
            docker push ${{ inputs.github_registry }}/${{ inputs.public_image }}:${VERSION}
            
            # Handle latest for public registries
            if [ "${LATEST}" = "true" ]; then
              docker tag ${{ inputs.docker_registry }}/ci/${OFC_IMAGE_NAME}:${VERSION} \
                         ${{ inputs.public_registry }}/${{ inputs.public_image }}:latest
              docker push ${{ inputs.public_registry }}/${{ inputs.public_image }}:latest
              
              docker tag ${{ inputs.docker_registry }}/ci/${OFC_IMAGE_NAME}:${VERSION} \
                         ${{ inputs.github_registry }}/${{ inputs.public_image }}:latest
              docker push ${{ inputs.github_registry }}/${{ inputs.public_image }}:latest
            fi
          fi

      - name: Push version bump
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.commit_token }}
          branch: ${{ needs.raise-version.outputs.branch_name }}
          unprotect_reviews: true

name: Build, Deploy and release Docker images

# Reusable workflow for building, testing, and pushing Docker images
# Supports multiple registries, platforms, and optional security scanning
# Version management with bump-my-version or manual tagging
on:
  workflow_call:
    inputs:
      # ==================== REQUIRED INPUTS ====================
      docker_file:
        required: true
        type: string
        description: Path to the Dockerfile used for build step
      docker_image:
        required: true
        type: string
        description: Docker image name used for build and push to registries

      # ==================== BUILD CONFIGURATION ====================
      build_args:
        required: false
        type: string
        description: Docker build arguments (comma-separated)
      platforms:
        required: false
        type: string
        default: linux/amd64
        description: Target platforms to build (e.g., linux/amd64,linux/arm64)
      target:
        required: false
        type: string
        description: Docker build target stage

      # ==================== VERSIONING ====================
      version:
        required: false
        type: string
        default: ''
        description: |
          Manual version tag. If empty, auto-bumped by bump-my-version on deploy.
          Format: x.y.z (e.g., 1.2.3)

      # ==================== DEPLOYMENT ====================
      deploy:
        required: false
        type: boolean
        default: false
        description: Enable push to registries (default is build-only)
      push_latest:
        required: false
        type: boolean
        default: false
        description: Also tag image as 'latest' when pushing

      # ==================== PRIMARY REGISTRY (PRIVATE) ====================
      docker_registry:
        required: false
        type: string
        default: registry.cloud.mov.ai
        description: Private registry URL for push

      # ==================== PUBLIC REGISTRIES ====================
      public:
        required: false
        type: boolean
        default: false
        description: Enable push to public registries (AWS and GitHub)
      public_registry:
        required: false
        type: string
        default: pubregistry.aws.cloud.mov.ai
        description: AWS public registry URL
      public_image:
        required: false
        type: string
        description: Public image name (required if 'public' is true)
      github_registry:
        required: false
        type: string
        default: ghcr.io/mov-ai
        description: GitHub Container Registry URL

      # ==================== ARTIFACTS INJECTION ====================
      download_artifact:
        required: false
        type: boolean
        default: false
        description: Download build artifacts before building Docker image
      download_artifact_name:
        required: false
        type: string
        default: artifacts
        description: Name of artifact to download
      download_artifact_path:
        required: false
        type: string
        default: ./dist
        description: Path where artifacts are extracted

      # ==================== SECURITY SCANNING ====================
      snyk_check:
        required: false
        type: boolean
        default: false
        description: Enable Snyk security scanning (requires snyk_token)

      # ==================== RELEASE ====================
      create_release:
        required: false
        type: boolean
        default: false
        description: Create GitHub Release with build metadata and digests

    secrets:
      # ==================== REGISTRY CREDENTIALS ====================
      registry_user:
        required: true
        description: Username for private registry
      registry_password:
        required: true
        description: Password/token for private registry
      pub_registry_user:
        required: false
        description: Username for AWS public registry
      pub_registry_password:
        required: false
        description: Password/token for AWS public registry
      github_registry_user:
        required: false
        description: Username for GitHub Container Registry
      github_registry_password:
        required: false
        description: GitHub token with packages write permission

      # ==================== GIT & VERSIONING ====================
      commit_user:
        required: false
        description: Git user name for version bump commits
      commit_mail:
        required: false
        description: Git user email for version bump commits
      commit_token:
        required: false
        description: GitHub token with write permissions for pushing version bumps

      # ==================== SECURITY SCANNING ====================
      snyk_token:
        required: false
        description: Snyk API token for vulnerability scanning

jobs:
  # ============================================================================
  # Determine image version: either use manual input or read current from git
  # ============================================================================
  get-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.final_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Use manual version if provided
      - name: Use manual version (if provided)
        if: ${{ inputs.version != '' }}
        id: manual_version
        run: |
          echo "version=${{ inputs.version }}" | tee -a "$GITHUB_OUTPUT"
          echo "✓ Using manual version: ${{ inputs.version }}"

      # Auto-detect version workflow
      - name: Setup Python for bump-my-version
        if: ${{ inputs.version == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bump-my-version
        if: ${{ inputs.version == '' }}
        run: python3 -m pip install -q bump-my-version

      - name: Read current version
        if: ${{ inputs.version == '' }}
        id: auto_version
        run: |
          VERSION=$(bump-my-version show current_version)
          echo "version=${VERSION}" | tee -a "$GITHUB_OUTPUT"
          echo "✓ Current version: ${VERSION}"

      - name: Output final version
        id: final_version
        run: |
          if [ "${{ inputs.version }}" != "" ]; then
            FINAL_VERSION="${{ steps.manual_version.outputs.version }}"
          else
            FINAL_VERSION="${{ steps.auto_version.outputs.version }}"
          fi
          echo "version=${FINAL_VERSION}" | tee -a "$GITHUB_OUTPUT"
          echo "📦 Version for build: ${FINAL_VERSION}"

  # ============================================================================
  # Build Docker image(s) and optionally push to registries
  # ============================================================================
  build-and-deploy:
    name: Build & Deploy
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      DOCKER_REGISTRY: ${{ inputs.docker_registry }}
      DOCKER_IMAGE: ${{ inputs.docker_image }}

    steps:
      # ========== VALIDATION ==========
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.docker_file }}
          format: tty
          failure-threshold: error

      # ========== REGISTRY LOGIN ==========
      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}

      - name: Login to AWS public registry
        if: ${{ inputs.public }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.public_registry }}
          username: ${{ secrets.pub_registry_user }}
          password: ${{ secrets.pub_registry_password }}

      - name: Login to GitHub Container Registry
        if: ${{ inputs.public }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.github_registry }}
          username: ${{ secrets.github_registry_user }}
          password: ${{ secrets.github_registry_password }}

      # ========== PREPARE BUILD METADATA ==========
      - name: Generate Docker image tags
        id: image_tags
        run: |
          # Primary registry tags
          TAGS="${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${VERSION}"

          if [ "${{ inputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS},${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:latest"
          fi

          # Public registry tags (if enabled)
          if [ "${{ inputs.public }}" = "true" ]; then
            TAGS="${TAGS},${{ inputs.public_registry }}/${{ inputs.public_image }}:${VERSION}"
            TAGS="${TAGS},${{ inputs.github_registry }}/${{ inputs.public_image }}:${VERSION}"

            if [ "${{ inputs.push_latest }}" = "true" ]; then
              TAGS="${TAGS},${{ inputs.public_registry }}/${{ inputs.public_image }}:latest"
              TAGS="${TAGS},${{ inputs.github_registry }}/${{ inputs.public_image }}:latest"
            fi
          fi

          echo "tags=${TAGS}" | tee -a "$GITHUB_OUTPUT"
          echo "📍 Image tags:" && echo "${TAGS}" | tr ',' '\n'

      - name: Generate build arguments
        id: build_args
        run: |
          if [ -n "${{ inputs.build_args }}" ]; then
            echo "args=${{ inputs.build_args }}" | tee -a "$GITHUB_OUTPUT"
            echo "🔧 Build args:" && echo "${{ inputs.build_args }}" | tr ',' '\n'
          fi

      - name: Generate Docker labels & outputs
        id: docker_metadata
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Standard OCI labels
          LABELS="org.opencontainers.image.source=https://github.com/${GITHUB_REPO}"
          LABELS="${LABELS},org.opencontainers.image.version=${VERSION}"

          # Multi-platform metadata (for manifest annotations)
          OUTPUTS=""
          IFS=',' read -ra PLATFORMS <<< "${{ inputs.platforms }}"
          if [ "${#PLATFORMS[@]}" -gt 1 ]; then
            OUTPUTS="type=image,name=target,annotation-index.org.opencontainers.image.description=Version ${VERSION} of repo ${GITHUB_REPO}"
          else
            LABELS="${LABELS},org.opencontainers.image.description=Version ${VERSION} of repo ${GITHUB_REPO}"
          fi

          echo "labels=${LABELS}" | tee -a "$GITHUB_OUTPUT"
          echo "outputs=${OUTPUTS}" | tee -a "$GITHUB_OUTPUT"

      # ========== PREPARE BUILD ENVIRONMENT ==========
      - name: Download build artifacts
        if: ${{ inputs.download_artifact }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.download_artifact_name }}
          path: ${{ inputs.download_artifact_path }}

      - name: Set up QEMU (multi-platform support)
        if: ${{ contains(inputs.platforms, 'arm') }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========== BUILD & PUSH ==========
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.docker_file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.deploy }}
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: ${{ steps.docker_metadata.outputs.labels }}
          outputs: ${{ steps.docker_metadata.outputs.outputs }}
          build-args: ${{ steps.build_args.outputs.args }}
          target: ${{ inputs.target }}
          pull: true

      # ========== SECURITY SCANNING (optional) ==========
      - name: Run Snyk security scan
        if: ${{ inputs.public && inputs.snyk_check && inputs.deploy }}
        uses: snyk/actions/docker@master
        continue-on-error: true
        timeout-minutes: 10
        env:
          SNYK_TOKEN: ${{ secrets.snyk_token }}
        with:
          args: --severity-threshold=high --file=${{ inputs.docker_file }}
          image: ${{ inputs.github_registry }}/${{ inputs.public_image }}:${VERSION}

      - name: Upload Snyk results to GitHub Code Scanning
        if: ${{ inputs.public && inputs.snyk_check && inputs.deploy && always() }}
        uses: github/codeql-action/upload-sarif@v2
        continue-on-error: true
        with:
          sarif_file: snyk.sarif

      # ========== VERSION MANAGEMENT (after successful build & scan) ==========
      - name: Setup Python for version bump
        if: ${{ inputs.version == '' && inputs.deploy }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bump-my-version
        if: ${{ inputs.version == '' && inputs.deploy }}
        run: python3 -m pip install -q bump-my-version

      - name: Bump patch version
        if: ${{ inputs.version == '' && inputs.deploy }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          git config --global user.name "${{ secrets.commit_user }}"
          git config --global user.email "${{ secrets.commit_mail }}"
          bump-my-version bump patch --no-tag
          echo "✓ Version bumped"

      - name: Push version bump to repository
        if: ${{ inputs.version == '' && inputs.deploy }}
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.commit_token }}
          branch: ${{ github.head_ref || github.ref_name }}
          unprotect_reviews: true

      # ========== GITHUB RELEASE (after successful build & version bump) ==========
      - name: Create GitHub Release
        if: ${{ inputs.create_release && inputs.deploy }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: |
            ## Docker Image Release

            **Version:** `${{ env.VERSION }}`

            ### Images Published
            - **Private Registry:** `${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}`
            ${{ inputs.public && format('- **AWS Public Registry:** `{0}/{1}:{2}`', inputs.public_registry, inputs.public_image, env.VERSION) || '' }}
            ${{ inputs.public && format('- **GitHub Registry:** `{0}/{1}:{2}`', inputs.github_registry, inputs.public_image, env.VERSION) || '' }}

            ### Build Information
            - **Platforms:** `${{ inputs.platforms }}`
            - **Dockerfile:** `${{ inputs.docker_file }}`
            ${{ inputs.target && format('- **Build Target:** `{0}`', inputs.target) || '' }}
            - **Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})
            - **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ### Security
            ${{ inputs.snyk_check && '- ✓ Snyk security scan completed' || '- Security scanning disabled' }}

            ---
            *Release created by [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          draft: false
          prerelease: false
          token: ${{ secrets.commit_token }}

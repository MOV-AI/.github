name: Build and Validate Platform
on:
  workflow_call:
    inputs:
      product_name:
        required: true
        type: string
      backend_name:
        required: false
        type: string
        default: ''
      debug_fleet_keep_alive:
        required: false
        type: boolean
      fleet_ips:
        required: true
        type: string
      fleet_number_members:
        required: true
        type: number
      cluster:
        required: false
        default: "mary"
        type: string
      debug_simulation_tests_keep_alive:
        required: false
        type: boolean
        default: false
      proxmox_cluster_name:
        required: false
        type: string
        default: hel0
      slack_channel:
        required: false
        type: string
        default: "C02U028NMB7"
        #default: "C02U028NMB7" # rnd-platform
        # development slack channel
        #default: "C05K2KF1UP8"
      simulation_qa_key:
        required: false
        type: string
        default: "simulator_tests"
      simulation_qa_version:
        required: false
        type: string
        default: ""
        description: Version of the simulator tests to run. If not provided, the version will be taken from the product manifest.
      with_fleet_tests:
        required: false
        type: boolean
        default: false
        description: Flag if we want the fleet job to run platform UI Fleet tests
      with_robotic_stack_tests:
        required: false
        type: boolean
        default: true
        description: Flag to enable/disable the Robotic Stack Integration tests
      generate_sbom:
        required: false
        type: boolean
        default: true
        description: Generate CycloneDX SBOM and attach it as Harbor accessory for pushed images
      provision_tf_env_repo:
        required: false
        type: string
        default: "devops-tf-env-conf"
      provision_tf_env_version:
        required: false
        type: string
        default: "0.2.2-5"
      provision_infra_repo:
        required: false
        type: string
        default: "devops-tf-proxmox-bpg"
      provision_infra_version:
        required: false
        type: string
        default: "2.2.0-3"

    secrets:
      auto_commit_user:
        required: true
      auto_commit_mail:
        required: true
      auto_commit_pwd:
        required: true
      registry_user:
        required: true
      registry_password:
        required: true
      nexus_publisher_user:
        required: true
      nexus_publisher_password:
        required: true
      gh_token:
        required: true
      aws_key_id:
        required: true
      aws_secret_key_id:
        required: true
      slack_token_id:
        required: true
      ssh_pem_fleet_aws_vm:
        required: true
      proxmox_ve_username:
        required: true
      proxmox_ve_password:
        required: true
      proxmox_ve_sim_username:
        required: true
      proxmox_ve_sim_password:
        required: true
      ssh_priv_key:
        required: true
      jira_username:
        required: true
      jira_password:
        required: true
      xray_clientid:
        required: true
      xray_secret:
        required: true
      minio_key_id:
        required: true
      minio_secret_key_id:
        required: true
      buildkite_token:
        required: false
      fleet_password:
        required: true
env:
  CI_INTEGRATION_SCRIPTS_VERSION: "4.3.0.2"
  MOBTEST_VERSION: "0.0.7.2"
  PACKAGE_DEPLOYER_VERSION: "2.0.0.2"
  GITHUB_API_USR: "OttoMation-Movai"
  AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_key_id }}
  AWS_DEFAULT_REGION: "us-east-1"
  REGISTRY: registry.cloud.mov.ai
  MID_REGISTRY: registry.hel.mov.ai
  PUSH_REGISTRY: registry.cloud.mov.ai
  ENV: qa
  USERSPACE_FOLDER_PATH: /opt/movai/userspace
  SIMULATION_ID: ci_simulation
  XRAY_CLIENTID: ${{ secrets.xray_clientid}}
  XRAY_SECRET: ${{ secrets.xray_secret}}
  JIRA_USERNAME: ${{ secrets.jira_username}}
  JIRA_PASSWORD: ${{ secrets.jira_password}}
  PROVISIONING_ENV_VERSION: 0.2.2-5
  PROVISIONING_ENV_REPO: devops-tf-env-conf
  PROVISION_INFRA_REPO: "devops-tf-proxmox-bpg"
  PROVISION_INFRA_VERSION: "2.2.0-3"
  ARTIFACTS_RETENTION_DAYS: 15
  DEPENDENCY_TRACK_URL: "https://sbom.es.mov.ai"
  HARBOR_URL: "https://registry.cloud.mov.ai/"
jobs:
  Validate-bootstrap-configs:
    runs-on: integration-pipeline
    container:
      image: registry.aws.cloud.mov.ai/qa/py-buildserver:4.0.1
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    outputs:
      slack_thread_id: ${{ steps.send-message.outputs.ts }}
      fleet_tests_list: ${{ steps.extract_fleet_tests_list.outputs.fleet_tests_list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Manifest
        shell: bash
        run: |
          yamllint product-manifest.yaml

      - name: Install CI Scripts in container
        shell: bash
        run: |
          python3 -m pip install -q integration-pipeline==$CI_INTEGRATION_SCRIPTS_VERSION --ignore-installed

      - name: raise version
        run: |
          git config --global --add safe.directory $(pwd)
          git fetch
          git checkout origin/${GITHUB_REF#refs/heads/} -- product.version
          integration-pipeline raise
          cat product.version

      - name: Bootstraping simulator metadata
        run: |
          cat product.version
          rm -rf simulator_artifacts ci_artifacts
          integration-pipeline generate_meta_simulator_artifacts \
                --manifest_platform_base_key product_components \
                --product_name ${{ inputs.product_name }} \
                --branch ${GITHUB_REF#refs/heads/}

          mkdir simulator_artifacts
          cp ci_artifacts/* ./simulator_artifacts

      - name: Bootstraping platform metadata
        run: |
          rm -rf ci_artifacts
          integration-pipeline generate_meta_artifacts \
                --manifest_platform_base_key product_components \
                --override_backend ${{ inputs.backend_name }}
          mkdir component_artifacts
          cp ci_artifacts/* ./component_artifacts

      - name: Extract fleet tests list
        id: extract_fleet_tests_list
        run: |
          FLEET_TESTS=$(python3 -c "
          import yaml, json
          with open('product-manifest.yaml') as f:
              data = yaml.safe_load(f)
          qa_config = data['product_components']['qa']
          fleet_test_names = [
              test_name for test_name, test_config in qa_config.items()
              if isinstance(test_config, dict) and 'fleet' in test_config
          ]
          print(json.dumps(fleet_test_names))
          ")
          echo "fleet_tests_list=${FLEET_TESTS}" >> $GITHUB_OUTPUT


      - name: Stash component_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: component_artifacts
          path: component_artifacts/*
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}

      - name: Stash robot_configs
        uses: actions/upload-artifact@v7
        with:
          name: robot_configs
          path: "*.json*"
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}

      - name: Stash sim_configs
        uses: actions/upload-artifact@v7
        with:
          name: sim_configs
          path: simulator_artifacts/*
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}

      - name: Pre-stash organization configs
        run: |
          rm -rf simulator_artifacts ci_artifacts platform_configs
          mkdir platform_configs
          cp product.version ./platform_configs/product.version
          cp product-manifest.yaml ./platform_configs/product-manifest.yaml

      - name: Prepare slack variables
        if: always()
        id: pre_slack
        run: |
          MESSAGE=":loading: CI: ${GITHUB_REPOSITORY} (${GITHUB_REF#refs/heads/}), build: $(cat product.version) (Attempt: #${{ github.run_attempt }}) is starting to be validated :mag_right: Details: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT

      - name: Send Slack Message
        uses: slackapi/slack-github-action@v3
        id: send-message
        with:
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack.outputs.msg }}"
            }
          token: ${{ secrets.slack_token_id }}

      - name: Stash raised_meta
        uses: actions/upload-artifact@v7
        with:
          name: raised_meta
          path: platform_configs/*
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}

  Build-backend:
    runs-on: integration-pipeline
    needs: [Validate-bootstrap-configs]
    outputs:
      slack_thread_id: ${{ needs.Validate-bootstrap-configs.outputs.slack_thread_id }}
      backend_image: ${{ steps.store_image_name.outputs.backend_image }}
    steps:
      - uses: rtCamp/action-cleanup@master

      - name: Checkout
        uses: actions/checkout@v6

      - name: Agent info
        run: |
          echo "public ip: $(curl ipinfo.io/ip)"
          echo "private ip: $(hostname -I | awk '{print $1}')"

      - name: Setup CI Scripts in .ci-venv
        shell: bash
        run: |
          python3 -m venv .ci-venv --clear
          . .ci-venv/bin/activate
          [ -f ci-requirements.txt ] && pip install -q -r ci-requirements.txt
          python3 -m pip install -q integration-pipeline==$CI_INTEGRATION_SCRIPTS_VERSION --ignore-installed

      - name: unstash raised_meta
        uses: actions/download-artifact@v8
        with:
          name: raised_meta
          path: platform_configs

      - name: unstash component_artifacts
        uses: actions/download-artifact@v8
        with:
          name: component_artifacts

      - name: extract product configs, manifest to main folder
        shell: bash
        run: |
          cp ./platform_configs/product.version product.version
          cp ./platform_configs/product-manifest.yaml product-manifest.yaml

      - name: Lint docker image
        shell: bash
        run: |
          docker run --rm -i -e HADOLINT_FAILURE_THRESHOLD=error hadolint/hadolint < docker/backend/Dockerfile

      - name: Login to ${{ env.REGISTRY }} Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}
          registry: ${{ env.REGISTRY }}

      - name: Prepare docker build variables
        id: pre_build
        shell: bash
        env:
          DISTRO: noetic
        run: |
          echo "base_name=$(cat backend_base_name_${DISTRO}.ci)" >> $GITHUB_OUTPUT
          echo "base_version=$(cat backend_base_version_${DISTRO}.ci)" >> $GITHUB_OUTPUT
          echo "raised_version=$(cat product.version)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        shell: bash
        run: |
          docker build --add-host ${{ env.REGISTRY }}:172.22.0.106 \
            --build-arg DOCKER_REGISTRY=${{ env.REGISTRY }} \
            --build-arg BASE_IMAGE=${{ steps.pre_build.outputs.base_name }} \
            --build-arg TAG=${{ steps.pre_build.outputs.base_version }} \
            --build-arg CI_SCRIPT_VERSION=${{ env.CI_INTEGRATION_SCRIPTS_VERSION }} \
            --file docker/backend/Dockerfile \
            --platform linux/amd64 \
            --tag ${{ env.REGISTRY }}/ci/${{ inputs.backend_name }}:${{ steps.pre_build.outputs.raised_version }} \
            --pull \
            --push .

      - name: store image name
        id: store_image_name
        shell: bash
        run: |
          echo "backend_image=${{ inputs.backend_name }}:${{ steps.pre_build.outputs.raised_version }}" >> $GITHUB_OUTPUT

      - name: Get current job id
        if: always()
        shell: bash
        id: job_info
        run: |
          job_id=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id}}/attempts/${{ github.run_attempt }}/jobs | jq -r '.jobs | .[0].id')
          job_html_url=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id}}/attempts/${{ github.run_attempt }}/jobs | jq -r '.jobs | map(select(.name | contains("${{ github.job }}"))) | .[0].html_url')
          echo "job_url=$job_html_url" | tee >> $GITHUB_OUTPUT
          echo "$job_id=$job_id" | tee >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Prepare slack variables
        if: always()
        id: pre_slack_result
        run: |
          MESSAGE=":white_check_mark: ${{ github.job }} (Attempt: #${{ github.run_attempt }}) job passed"
          MESSAGE_ERR=":x: ${{ github.job }} (Attempt: #${{ github.run_attempt }}) job failed"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT
          echo "msg_error=${MESSAGE_ERR}\n  Details: ${{ steps.job_info.outputs.job_url }}" >> $GITHUB_OUTPUT

      - name: Slack message success
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack_result.outputs.msg }}",
              "thread_ts": "${{ needs.Validate-bootstrap-configs.outputs.slack_thread_id }}"
            }
          token: ${{ secrets.slack_token_id }}

      - name: Slack message failure
        uses: slackapi/slack-github-action@v3
        if: failure()
        with:
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack_result.outputs.msg_error }}",
              "thread_ts": "${{ needs.Validate-bootstrap-configs.outputs.slack_thread_id }}"
            }
          token: ${{ secrets.slack_token_id }}

      - name: Docker cleanups
        if: always()
        shell: bash
        run: |
          docker system prune -f
          docker image prune --all -f

  # Validation-UI-Tests:
  #   needs: [Build-backend]
  #   uses: MOV-AI/.github/.github/workflows/integration-platform-local-standalone-tests.yml@feat/publsih_sbom_to_dtrack
  #   secrets: inherit
  #   with:
  #     collect_deployable_artifacts: true
  #     test_infra_key: "ui_tests"
  #     slack_thread_id: ${{ needs.Build-backend.outputs.slack_thread_id }}
  #     backend_image_name_and_tag: ${{ needs.Build-backend.outputs.backend_image }}
  #     test_timeout: 120
  #     pytest_args: '--movai-ip $host_ip --movai-user $movai_user --movai-pw $movai_pwd --cucumberjson=./results.json'
  #     xray_label: "UI_Automation"
  #     slack_channel: ${{ inputs.slack_channel }}

  # Validation-Install-Tests:
  #   needs: [Build-backend]
  #   uses: MOV-AI/.github/.github/workflows/integration-platform-local-standalone-tests.yml@feat/publsih_sbom_to_dtrack
  #   secrets: inherit
  #   with:
  #     test_infra_key: "install_tests"
  #     slack_thread_id: ${{ needs.Build-backend.outputs.slack_thread_id }}
  #     backend_image_name_and_tag: ${{ needs.Build-backend.outputs.backend_image }}
  #     test_timeout: 30
  #     pytest_args: '-k "$test_set" --installPath="$USERSPACE_FOLDER_PATH" --jsonConfigFilePath="../basic-standalone-noetic.json.ci" --jira_report'
  #     slack_channel: ${{ inputs.slack_channel }}

  # Validation-API-Tests:
  #   needs: [Build-backend]
  #   uses: MOV-AI/.github/.github/workflows/integration-platform-local-standalone-tests.yml@feat/publsih_sbom_to_dtrack
  #   secrets: inherit
  #   with:
  #     test_infra_key: "api_tests"
  #     slack_thread_id: ${{ needs.Build-backend.outputs.slack_thread_id }}
  #     backend_image_name_and_tag: ${{ needs.Build-backend.outputs.backend_image }}
  #     test_timeout: 30
  #     pytest_args: '--movai-ip $host_ip --movai-user $movai_user --movai-pw $movai_pwd'
  #     slack_channel: ${{ inputs.slack_channel }}

  # Validation-Flow-Tests:
  #   needs: [Build-backend]
  #   uses: MOV-AI/.github/.github/workflows/integration-platform-local-standalone-tests.yml@feat/publsih_sbom_to_dtrack
  #   secrets: inherit
  #   with:
  #     test_infra_key: "flow_tests"
  #     slack_thread_id: ${{ needs.Build-backend.outputs.slack_thread_id }}
  #     backend_image_name_and_tag: ${{ needs.Build-backend.outputs.backend_image }}
  #     test_timeout: 30
  #     pytest_args: '-m "$test_set" --movai-ip $host_ip --movai-user $movai_user --movai-pw $movai_pwd'
  #     slack_channel: ${{ inputs.slack_channel }}

  Validations-Finish:
    needs: [Build-backend]
    runs-on: ubuntu-22.04
    outputs:
      slack_thread_id: ${{ needs.Build-backend.outputs.slack_thread_id }}
      backend_image: ${{ needs.Build-backend.outputs.backend_image }}
    steps:
      - name: Pass through
        run: echo "Pass"

  # Fleet-Validations:
  #   needs: [Validate-bootstrap-configs, Build-backend]
  #   uses: MOV-AI/.github/.github/workflows/integration-platform-remote-fleet-tests.yml@feat/publsih_sbom_to_dtrack
  #   secrets: inherit
  #   with:
  #     collect_deployable_artifacts: true
  #     fleet_test_infra_list: ${{ needs.Validate-bootstrap-configs.outputs.fleet_tests_list }}
  #     slack_thread_id: ${{ needs.Build-backend.outputs.slack_thread_id }}
  #     backend_image_name_and_tag: ${{ needs.Build-backend.outputs.backend_image }}
  #     test_timeout: 120
  #     slack_channel: ${{ inputs.slack_channel }}
  #     provision_tf_env_repo: ${{ inputs.provision_tf_env_repo }}
  #     provision_tf_env_version: ${{ inputs.provision_tf_env_version }}
  #     provision_infra_repo: ${{ inputs.provision_infra_repo }}
  #     provision_infra_version: ${{ inputs.provision_infra_version }}
  #     fleet_number_members: ${{ inputs.fleet_number_members }}
  #     debug_fleet_keep_alive: ${{ inputs.debug_fleet_keep_alive }}
  #     fleet_ips: ${{ inputs.fleet_ips }}
  #     proxmox_cluster_name: ${{ inputs.proxmox_cluster_name }}
  #     with_fleet_tests: ${{ inputs.with_fleet_tests }}

  Build-Simulator:
    needs: [Validate-bootstrap-configs]
    runs-on: integration-pipeline
    env:
      DISTRO: noetic
    outputs:
      slack_thread_id: ${{ needs.Validate-bootstrap-configs.outputs.slack_thread_id }}
      simulator_image: ${{ steps.pre_build.outputs.image_name }}

    steps:
      - name: Cleanup Workspace
        uses: rtCamp/action-cleanup@master

      - name: Checkout
        uses: actions/checkout@v6

      - name: Agent info
        id: agent_info
        run: |
          echo "ip=$(hostname -I | awk '{print $1}')" | tee $GITHUB_OUTPUT

      - name: Setup CI Scripts in .ci-venv
        shell: bash
        run: |
          python3 -m venv .ci-venv --clear
          . .ci-venv/bin/activate
          [ -f ci-requirements.txt ] && pip install -q -r ci-requirements.txt
          python3 -m pip install -q integration-pipeline==$CI_INTEGRATION_SCRIPTS_VERSION --ignore-installed

      - name: unstash sim_configs
        uses: actions/download-artifact@v8
        with:
          name: sim_configs
          path: simulator_artifacts

      - name: Prepare Skip variables
        id: pre_simulator_build
        run: |
          if [ ! -f "simulator_artifacts/version" ]; then
            echo "skip_simulator_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_simulator_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Lint docker image
        if: ${{ steps.pre_simulator_build.outputs.skip_simulator_build == 'false' }}
        shell: bash
        run: |
          docker run --rm -i -e HADOLINT_FAILURE_THRESHOLD=error hadolint/hadolint < docker/$DISTRO/Dockerfile-simulator

      - name: Download models
        if: ${{ steps.pre_simulator_build.outputs.skip_simulator_build == 'false' }}
        shell: bash
        run: |
          . .ci-venv/bin/activate
          integration-pipeline fetch_simulator_models \
                --manifest_platform_base_key product_components \
                --gh_api_user $GITHUB_API_USR \
                --gh_api_pwd ${{ secrets.auto_commit_pwd }} \
                --target_dir "./models"
          deactivate
          if [ ! -d ./models ]; then mkdir -p ./models; fi

      - name: Login to Private Registry
        if: ${{ steps.pre_simulator_build.outputs.skip_simulator_build == 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}
          registry: ${{ env.REGISTRY }}

      - name: Prepare docker build variables
        if: ${{ steps.pre_simulator_build.outputs.skip_simulator_build == 'false' }}
        id: pre_build
        run: |
          echo "image_name=$(cat simulator_artifacts/simulator_name.ci)" >> $GITHUB_OUTPUT
          echo "base_name=$(cat simulator_artifacts/simulator_base.ci)" >> $GITHUB_OUTPUT

      - name: Build with args and push
        if: ${{ steps.pre_simulator_build.outputs.skip_simulator_build == 'false' }}
        uses: docker/build-push-action@v6
        id: build_simulator
        with:
          context: .
          platforms: linux/amd64
          file: docker/${{ env.DISTRO }}/Dockerfile-simulator
          push: true
          tags: "${{ env.REGISTRY }}/qa/${{ steps.pre_build.outputs.image_name }}"
          pull: true
          build-args: |
            BASE_IMAGE=${{ steps.pre_build.outputs.base_name }}
            CI_SCRIPT_VERSION=${{ env.CI_INTEGRATION_SCRIPTS_VERSION }}

      - name: Generate and attach simulator CycloneDX SBOM
        if: ${{ steps.pre_simulator_build.outputs.skip_simulator_build == 'false' && inputs.generate_sbom }}
        uses: MOV-AI/.github/.github/actions/attach-cyclonedx-sbom@v3
        with:
          image: ${{ env.REGISTRY }}/qa/${{ steps.pre_build.outputs.image_name }}
          digest: ${{ steps.build_simulator.outputs.digest }}
          sbom_file: sbom-simulator.cyclonedx.json
          artifact_name: sbom-simulator

      - name: Collect Installed components
        if: ${{ steps.pre_simulator_build.outputs.skip_simulator_build == 'false' }}
        shell: bash
        run: |
          . .ci-venv/bin/activate
          cd simulator_artifacts
          integration-pipeline publish_simulator_state_artifacts \
                --product_name ${{ inputs.product_name }} \
                --branch ${GITHUB_REF#refs/heads/}
          deactivate

      - name: Get current job id
        if: always()
        shell: bash
        id: job_info
        run: |
          job_id=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id}}/attempts/${{ github.run_attempt }}/jobs | jq -r '.jobs | .[0].id')
          job_html_url=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id}}/attempts/${{ github.run_attempt }}/jobs | jq -r '.jobs | map(select(.name | contains("${{ github.job }}"))) | .[0].html_url')
          echo "$job_id"
          echo "$job_html_url"
          echo "job_url=$job_html_url" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Prepare slack variables
        if: always()
        id: pre_slack_result
        run: |
          MESSAGE=":white_check_mark: ${{ github.job }} (Attempt: #${{ github.run_attempt }}) job passed"
          MESSAGE_ERR=":x: ${{ github.job }} (Attempt: #${{ github.run_attempt }}) job failed"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT
          echo "msg_error=${MESSAGE_ERR}\n  Details: ${{ steps.job_info.outputs.job_url }}" >> $GITHUB_OUTPUT

      - name: Slack message success
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack_result.outputs.msg }}",
              "thread_ts": "${{ needs.Validate-bootstrap-configs.outputs.slack_thread_id  }}"
            }
          token: ${{ secrets.slack_token_id }}

      - name: Slack message failure
        uses: slackapi/slack-github-action@v3
        if: failure()
        with:
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack_result.outputs.msg_error }}",
              "thread_ts": "${{ needs.Validate-bootstrap-configs.outputs.slack_thread_id  }}"
            }
          token: ${{ secrets.slack_token_id }}

      - name: pre-stash
        shell: bash
        run: |
          echo "$REGISTRY/qa/$(cat simulator_artifacts/simulator_name.ci)" > simulator.image.artifact

      - name: Stash deploy_simulator_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deploy_simulator_artifacts
          path: simulator.image.artifact
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}

      - name: Docker cleanups
        if: always()
        shell: bash
        run: |
          docker system prune -f
          docker image prune --all -f

  # Simulator-Validations:
  #   needs: [Build-Simulator, Build-backend]
  #   uses: MOV-AI/.github/.github/workflows/integration-platform-local-standalone-tests.yml@feat/publsih_sbom_to_dtrack
  #   secrets: inherit
  #   with:
  #     test_infra_key: "simul_flow_tests"
  #     slack_thread_id: ${{ needs.Build-Simulator.outputs.slack_thread_id }}
  #     backend_image_name_and_tag: ${{ needs.Build-backend.outputs.backend_image }}
  #     simulator_image_name_and_tag: ${{ needs.Build-Simulator.outputs.simulator_image }}
  #     test_timeout: 30
  #     pytest_args: '-m "$test_set" --movai-ip $host_ip --movai-user $movai_user --movai-pw $movai_pwd'
  #     slack_channel: ${{ inputs.slack_channel }}
  #     robot_config: 'basic-standalone-ignition-noetic.json'

  # Robotic-Stack-Integration:
  #   if: ${{ inputs.with_robotic_stack_tests }}
  #   needs: [Simulator-Validations, Build-backend, Build-Simulator]
  #   uses: MOV-AI/.github/.github/workflows/integration-robotic-stack-tests.yml@feat/publsih_sbom_to_dtrack
  #   secrets: inherit
  #   with:
  #     product_name: ${{ inputs.product_name }}
  #     slack_thread_id: ${{ needs.Build-Simulator.outputs.slack_thread_id }}
  #     slack_channel: ${{ inputs.slack_channel }}
  #     cluster: ${{ inputs.cluster }}
  #     debug_simulation_tests_keep_alive: ${{ inputs.debug_simulation_tests_keep_alive }}
  #     backend_name: ${{ needs.Build-backend.outputs.backend_image }}
  #     simulation_qa_key: ${{ inputs.simulation_qa_key }}
  #     simulation_qa_version: ${{ inputs.simulation_qa_version }}

  Publish:
    needs: [Validations-Finish]
    runs-on: integration-pipeline
    outputs:
      slack_thread_id: ${{ needs.Validations-Finish.outputs.slack_thread_id }}
    steps:
      - name: Cleanup Workspace
        uses: rtCamp/action-cleanup@master

      - name: Checkout
        uses: actions/checkout@v6

      - name: Agent info
        id: agent_info
        run: |
          echo "ip=$(hostname -I | awk '{print $1}')" | tee $GITHUB_OUTPUT

      - name: unstash robot_configs
        uses: actions/download-artifact@v8
        with:
          name: robot_configs
          path: .

      - name: unstash raised_meta
        uses: actions/download-artifact@v8
        with:
          name: raised_meta
          path: platform_configs

      # - name: unstash deploy_artifacts_noetic
      #   uses: actions/download-artifact@v8
      #   with:
      #     name: deploy_artifacts_noetic
      #     path: artifacts

      - name: unstash deploy_simulator_artifacts
        uses: actions/download-artifact@v8
        with:
          name: deploy_simulator_artifacts
          path: .

      - name: Login to ${{ env.REGISTRY }} Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}
          registry: ${{ env.REGISTRY }}

      - name: Login to ${{ env.PUSH_REGISTRY }} Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}
          registry: ${{ env.PUSH_REGISTRY }}

      - name: Setup CI Scripts in .ci-venv
        shell: bash
        run: |
          python3 -m venv .ci-venv --clear --system-site-packages
          . .ci-venv/bin/activate
          [ -f ci-requirements.txt ] && pip install -q -r ci-requirements.txt
          python3 -m pip install -q integration-pipeline==$CI_INTEGRATION_SCRIPTS_VERSION --ignore-installed
          python3 -m pip install -q movai-package-deployer==$PACKAGE_DEPLOYER_VERSION --ignore-installed

      - name: Publish and create release
        id: prepare_publish
        shell: bash
        run: |
          set -m
          set -e
          . .ci-venv/bin/activate
          git config --global --add safe.directory $(pwd)
          git config --global user.name '${{ secrets.auto_commit_user }}'
          git config --global user.email '${{ secrets.auto_commit_mail }}'
          git config --global user.password ${{ secrets.auto_commit_pwd }}

          cp ./platform_configs/product.version product.version
          cp ./platform_configs/product-manifest.yaml product-manifest.yaml

          mkdir -p deployment_artifacts
          package-deployer join --dploy_workspace "$(pwd)/artifacts"
          integration-pipeline get_image_list_from_manifest --manifest_platform_base_key product_components --docker_registry $REGISTRY
          cp ./*.json deployment_artifacts

          if [ -d ./artifacts/ ]; then
            cp artifacts/merged.dploy deployment_artifacts/deployable.dploy
            echo -e "$(cat ./artifacts/product.image.artifact)\n$(cat ./simulator.image.artifact)" > deployment_artifacts/product.image.artifact
            echo "${{env.REGISTRY}}/qa/${{ needs.Validations-Finish.outputs.backend_image }}" >> deployment_artifacts/product.image.artifact
          fi
          deactivate

          source="${{env.REGISTRY}}/ci/${{ needs.Validations-Finish.outputs.backend_image }}"
          target="${{env.PUSH_REGISTRY}}/qa/${{ needs.Validations-Finish.outputs.backend_image }}"
          docker pull $source
          echo "tagging $source as $target"
          docker tag $source $target
          PUSH_OUTPUT="$(docker push $target 2>&1)"
          echo "$PUSH_OUTPUT"
          PUSH_DIGEST="$(printf '%s\n' "${PUSH_OUTPUT}" | grep -oP 'sha256:[a-f0-9]{64}' | head -1)"
          if [ -z "${PUSH_DIGEST}" ] || ! [[ "${PUSH_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Failed to capture digest for pushed image ${target}"
            exit 1
          fi
          echo "digest=${PUSH_DIGEST}" | tee -a "$GITHUB_OUTPUT"

          cp product.version deployment_artifacts
          cp product-manifest.yaml deployment_artifacts
          product_version=$(cat product.version)

          # danger zone. Everything will be deleted.
          mv product-manifest.yaml product-manifest.yaml.bck

          git restore product.version
          git restore product-manifest.yaml
          git pull

          # get previous version so we can generate the release report
          echo "previous_version=$(cat product.version)" >> $GITHUB_OUTPUT

          # write the raised version to be committed
          echo "$product_version" > product.version

          git add product.version
          git commit -m "[skip actions] Automatic Raise"
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Generate and attach backend CycloneDX SBOM
        if: ${{ inputs.generate_sbom }}
        uses: MOV-AI/.github/.github/actions/attach-cyclonedx-sbom@v3
        with:
          image: "${{env.PUSH_REGISTRY}}/qa/${{ needs.Validations-Finish.outputs.backend_image }}"
          digest: ${{ steps.prepare_publish.outputs.digest }}
          sbom_file: sbom-backend.cyclonedx.json
          artifact_name: sbom-backend

      - name: Prepare raise variables
        id: pre_raise
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Raise App version
        uses: MOV-AI/.github/.github/actions/push-to-protected-branch@v3
        with:
          token: ${{ secrets.auto_commit_pwd }}
          git_user_email: ${{ secrets.auto_commit_mail }}
          git_user_name: ${{ secrets.auto_commit_user }}
          branch: ${{ steps.pre_raise.outputs.branch }}
          repository: ${{ github.repository }}

      - name: Download CycloneDX SBOM artifacts
        if: ${{ inputs.generate_sbom }}
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true

      - name: Github Publish
        shell: bash
        run: |
          commit_hash=$(git log --format="%H" -n 1)
          product_version=$(cat product.version)
          previous_version_option=""
          if gh release view ${{ steps.prepare_publish.outputs.previous_version }}  &>/dev/null; then
            previous_version_option="--notes-start-tag ${{ steps.prepare_publish.outputs.previous_version }}"
          fi
          gh release create -p --generate-notes $previous_version_option --target "$commit_hash" -t "${{ inputs.product_name }} $product_version" $product_version
          # add all files in the deployment_artifacts folder
          find deployment_artifacts -type f -exec gh release upload $product_version {} \;
          # add all CycloneDX SBOM files
          find . -name "sbom-*.cyclonedx.json" -type f -exec gh release upload $product_version {} \;
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Update release notes
        shell: bash
        run: |
          # release version
          product_version=$(cat product.version)

          # get existent release body
          ORIGINAL_RN=$(gh release view "${product_version}" --json body | jq -r .body)
          echo -e "ORIGINAL_RN:\n ${ORIGINAL_RN}"

          # get release PRs
          PRS=$(echo "${ORIGINAL_RN}" | sed -rn "s/.* by @.* in https:\/\/github\.com\/${{ github.repository_owner }}\/${{ github.event.repository.name }}\/pull\/([0-9]+).*/\1/p" | tr '\n' ' ')
          # change to array
          PRS=($PRS)
          echo "Found the following PRs: ${PRS[*]}"

          # new release notes file
          rm -rf notes.txt

          # What's Changed - with info from PRs
          echo "## What's Changed" >> notes.txt

          if [ ${#PRS[@]} -eq 0 ]; then
              # no PRs exist
              echo "No relevant changes." >> notes.txt
          else
              # PRs exist
              for pr in "${PRS[@]}"; do
                  gh pr view "${pr}" --json body | jq -r .body >> notes.txt
              done
          fi
          echo "" >> notes.txt

          # PRs
          echo "## PRs" >> notes.txt
          if [ ${#PRS[@]} -eq 0 ]; then
              # no PRs exist
              echo "No PRs." >> notes.txt
          else
              # PRs exist
              echo "${ORIGINAL_RN}" | grep "\* .* by @.* in https://github.com/${{ github.repository_owner }}/" >> notes.txt
          fi
          echo "" >> notes.txt

          ## Diff
          echo "## Diff" >> notes.txt
          echo "${ORIGINAL_RN}" | grep "\*\*Full Changelog\*\*" >> notes.txt

          # set new release notes
          gh release edit "${product_version}" --notes-file notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Publish SBOMs to Dependency Track
        if: ${{ inputs.generate_sbom }}
        run: |
          set -o pipefail
          . .ci-venv/bin/activate
          rm -rf deployment_artifacts/publish-sbom/
          mkdir  -p deployment_artifacts/publish-sbom/
          chmod -R 755 deployment_artifacts/publish-sbom/
          integration-pipeline publish_sbom_to_dependency_track \
            --manifest_file deployment_artifacts/product-manifest.yaml \
            --manifest_platform_base_key product_components \
            --dependency_track_url ${{ env.DEPENDENCY_TRACK_URL }} \
            --dependency_track_api_key ${{ secrets.DEPENDENCY_TRACK_API_KEY }} \
            --harbor_url ${{ env.HARBOR_URL }} \
            --harbor_user ${{ secrets.PORTUS_APP_USER }} \
            --harbor_password ${{ secrets.PORTUS_APP_TOKEN }} \
            --is_latest \
            --regenerate_bad_sboms \
            --artifacts_output_dir deployment_artifacts/publish-sbom/ | tee deployment_artifacts/publish-sbom/publish-sbom.log
          deactivate

      - name: Prepare slack variables
        if: always()
        id: pre_slack
        run: |
          MESSAGE=":white_check_mark: CI: ${GITHUB_REPOSITORY} (${GITHUB_REF#refs/heads/}), build: $(cat product.version) (Attempt: #${{ github.run_attempt }}) is stable :sunny: Details: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT

      - name: Slack message
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.update
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack.outputs.msg }}",
              "ts": "${{ needs.Validations-Finish.outputs.slack_thread_id }}"
            }
          token: ${{ secrets.slack_token_id }}

  Run-Status:
    runs-on: ubuntu-22.04
    needs: [Publish, Validate-bootstrap-configs]
    if: ${{ always() && ( needs.Publish.result == 'failure' || needs.Publish.result == 'cancelled'  || needs.Publish.result == 'skipped') }}
    steps:
      - name: unstash raised_meta
        uses: actions/download-artifact@v8
        with:
          name: raised_meta
          path: platform_configs

      - name: Copy product configs
        shell: bash
        run: |
          cp ./platform_configs/product.version product.version
          cp ./platform_configs/product-manifest.yaml product-manifest.yaml

      - name: Prepare slack variables
        id: pre_slack
        run: |
          MESSAGE_ERR=":x: CI: ${GITHUB_REPOSITORY} (${GITHUB_REF#refs/heads/}), build: $(cat product.version) (Attempt: #${{ github.run_attempt }}) is unstable (or cancelled) :rain_cloud: Details: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "msg_error=${MESSAGE_ERR}" >> $GITHUB_OUTPUT

      - name: Slack message
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.update
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack.outputs.msg_error }}",
              "ts": "${{ needs.Validate-bootstrap-configs.outputs.slack_thread_id }}"
            }
          token: ${{ secrets.slack_token_id }}

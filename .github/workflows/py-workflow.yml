name: Build and pack py packages
on:
  workflow_call:
    inputs:
      deploy:
        required: false
        type: boolean
        default: false
      release:
        required: false
        type: boolean
        default: false
      pre_commit:
        required: false
        type: boolean
        default: false
      run_black:
        required: false
        type: boolean
        default: false
        description: When 'true' black is run stopping the pipeline if any files are not properly formatted
      with_docs:
        required: false
        type: boolean
        default: false
        description: When true documentation is published, the branch gh-pages must be created manually 'git checkout --orphan gh-pages && touch .nojekyll && git add .nojekyll && git commit -m "Initial commit" && git push --set-upstream origin gh-pages'
      prod_publish_repos:
        required: false
        type: string
        default: '["pypi-edge"]'
      PYTHON_VERSION:
        required: true
        type: string
        default: "3.8.10"
      test_on_host:
        required: false
        type: boolean
        default: false
        description: When true the tests are run on the host machine, otherwise they are run inside a container. Useful when running tests using docker compose
    secrets:
      auto_commit_user:
        required: false # only when deploy true
      auto_commit_mail:
        required: false # only when deploy true
      auto_commit_password:
        required: false
      registry_user:
        required: true
      registry_password:
        required: true
      nexus_publisher_user:
        required: true
      nexus_publisher_password:
        required: true
      gh_token:
        required: true
      sonar_token:
        required: true
    outputs:
      package_version:
        description: The version of the package that was built
        value: ${{ jobs.Build.outputs.current_version }}
      commit_id:
        description: The commit id used for the deployment
        value: ${{ jobs.Post-Build.outputs.commit_id }}
env:
  REGISTRY: "registry.hel.mov.ai"

jobs:
  RefreshSource:
    if: ${{ ! inputs.deploy }}
    runs-on: ubuntu-22.04
    steps:
      - uses: docker://chinthakagodawita/autoupdate-action:v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ secrets.auto_commit_password }}'
          MERGE_MSG: "Branch was auto-updated."

  Pre-build:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-22.04
    container:
      image: python:${{ inputs.PYTHON_VERSION }}
    outputs:
      branch: ${{ steps.var_branch.outputs.branch }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set branch output
      if: ${{ inputs.deploy }}
      id: var_branch
      run: |
        echo "Branch name is: ${GITHUB_REF#refs/heads/}"
        echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

  Pre-commit:
    if: ${{ !inputs.release && inputs.pre_commit }}
    needs: [ Pre-build ]
    runs-on: ubuntu-22.04
    container:
      image: python:${{ inputs.PYTHON_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure Git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies and package
        run: |
          python3 -m pip install pip pre-commit --upgrade
          python3 -m pip install -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple --extra-index-url https://pypi.org/simple -r build-requirements.txt
          python3 -m pip install -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple --extra-index-url https://pypi.org/simple .

      - name: Run pre-commit
        run: |
          git config --global --add safe.directory $(pwd)
          python -m pre_commit run --show-diff-on-failure --color=always --all-files

  Linting:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-22.04
    needs: [ Pre-build ]
    container:
      image: python:${{ inputs.PYTHON_VERSION }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Configure Git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Upgrade pip
      run: python3 -m pip install pip --upgrade

    - name: Configure pip with custom index
      run: |
        mkdir -p ~/.config/pip
        echo "[global]" > ~/.config/pip/pip.conf
        echo "index-url = https://artifacts.cloud.mov.ai/repository/pypi-experimental/simple" >> ~/.config/pip/pip.conf
        echo "extra-index-url =" >> ~/.config/pip/pip.conf
        echo "  https://pypi.org/simple" >> ~/.config/pip/pip.conf
        echo "trusted-host =" >> ~/.config/pip/pip.conf
        echo "  artifacts.cloud.mov.ai" >> ~/.config/pip/pip.conf
        echo "  pypi.org" >> ~/.config/pip/pip.conf

    - name: Install build-requirements
      run: |
        python3 -m pip install -r build-requirements.txt
        python3 -m pip install build twine

    - name: Install python package
      run: python3 -m pip install .

    - name: Run Black
      if: ${{ inputs.run_black }}
      run: |
        python3 -m black \
          --line-length 100 \
          --diff \
          --check \
          .

    - name: Python Linters
      run: |
        python3 -m flake8 \
          --isolated \
          --exclude dist,.*\.egg-info,.git,__pycache__,.tox,venv \
          --max-complexity 10 \
          --max-line-length 100 \
          --exit-zero \
          --output-file flake8-report.txt

        touch dummy-pylint-config

        python3 -m pylint \
          --rcfile dummy-pylint-config \
          --ignore-patterns dist,.*\.egg-info,.git,__pycache__,.tox,venv \
          --max-line-length 100 \
          --exit-zero \
          --output pylint-report.txt \
          .

    - name: Upload tests report
      uses: actions/upload-artifact@v4
      with:
        name: tests-report
        path: |
          flake8-report.txt
          pylint-report.txt
        retention-days: 5

  Test-on-container:
    if: ${{ !inputs.release && !inputs.test_on_host }}
    runs-on: ubuntu-22.04
    needs: [ Linting ]
    container:
      image: python:${{ inputs.PYTHON_VERSION }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Configure Git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Upgrade pip
      run: python3 -m pip install pip --upgrade

    - name: Configure pip with custom index
      run: |
        mkdir -p ~/.config/pip
        echo "[global]" > ~/.config/pip/pip.conf
        echo "index-url = https://artifacts.cloud.mov.ai/repository/pypi-experimental/simple" >> ~/.config/pip/pip.conf
        echo "extra-index-url =" >> ~/.config/pip/pip.conf
        echo "  https://pypi.org/simple" >> ~/.config/pip/pip.conf
        echo "trusted-host =" >> ~/.config/pip/pip.conf
        echo "  artifacts.cloud.mov.ai" >> ~/.config/pip/pip.conf
        echo "  pypi.org" >> ~/.config/pip/pip.conf

    - name: Install build-requirements
      run: |
        python3 -m pip install -r build-requirements.txt

    - name: Install python package
      run: python3 -m pip install .

    - name: Run tests
      run: |
        if [ -f tox.ini ]; then
            # run tests and generates coverage.xml
            tox
        else
            # run tests
            python3 -m pytest tests/
        fi

    - name: Upload tests report
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.xml
        retention-days: 5

  Test-on-host:
    if: ${{ !inputs.release && inputs.test_on_host }}
    runs-on: ubuntu-22.04
    needs: [ Linting ]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Configure Git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Calculate python version
      if: ${{ startsWith(inputs.PYTHON_VERSION, '3.8') }}
      id: python_version
      run: |
        echo "PYTHON_MAJOR_MINOR=$(echo ${{ inputs.PYTHON_VERSION }} | cut -d. -f1,2)" >> $GITHUB_ENV

    - name: Setup python3.8
      if: ${{ startsWith(inputs.PYTHON_VERSION, '3.8') }}
      uses: deadsnakes/action@v3.2.0
      with:
        python-version: ${{ env.PYTHON_MAJOR_MINOR }}

    - name: Setup python3.10
      if: ${{ !startsWith(inputs.PYTHON_VERSION, '3.8') }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}

    - name: Configure pip with custom index
      run: |
        mkdir -p ~/.config/pip
        echo "[global]" > ~/.config/pip/pip.conf
        echo "index-url = https://artifacts.cloud.mov.ai/repository/pypi-experimental/simple" >> ~/.config/pip/pip.conf
        echo "extra-index-url =" >> ~/.config/pip/pip.conf
        echo "  https://pypi.org/simple" >> ~/.config/pip/pip.conf
        echo "trusted-host =" >> ~/.config/pip/pip.conf
        echo "  artifacts.cloud.mov.ai" >> ~/.config/pip/pip.conf
        echo "  pypi.org" >> ~/.config/pip/pip.conf

    - name: Login to ${{ env.REGISTRY }} Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.registry_user }}
        password: ${{ secrets.registry_password }}
        registry: ${{ env.REGISTRY }}

    - name: Install build-requirements
      run: python3 -m pip install -r build-requirements.txt

    - name: Install python package
      run: python3 -m pip install .

    - name: Run tests
      run: |
        if [ -f tox.ini ]; then
            # run tests and generates coverage.xml
            tox
        else
            # run tests
            python3 -m pytest tests/
        fi

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.xml
        retention-days: 5

  Build:
    if: ${{ always() && (needs.Test-on-container.result == 'success' || needs.Test-on-host.result == 'success') }}
    runs-on: ubuntu-22.04
    needs: [ Test-on-container , Test-on-host ]
    outputs:
      current_version: ${{ steps.bump.outputs.current_version }}
    container:
      image: python:${{ inputs.PYTHON_VERSION }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Configure Git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Upgrade pip
      run: python -m pip install pip --upgrade

    - name: Configure pip with custom index
      run: |
        mkdir -p ~/.config/pip
        echo "[global]" > ~/.config/pip/pip.conf
        echo "index-url = https://artifacts.cloud.mov.ai/repository/pypi-experimental/simple" >> ~/.config/pip/pip.conf
        echo "extra-index-url =" >> ~/.config/pip/pip.conf
        echo "  https://pypi.org/simple" >> ~/.config/pip/pip.conf
        echo "trusted-host =" >> ~/.config/pip/pip.conf
        echo "  artifacts.cloud.mov.ai" >> ~/.config/pip/pip.conf
        echo "  pypi.org" >> ~/.config/pip/pip.conf

    - name: Install build-requirements
      run: |
        python -m pip install -r build-requirements.txt
        python -m pip install build twine

    - name: Raise version locally before build
      id: bump
      run: |
        python3 -m venv venv --clear
        . venv/bin/activate
        pip install bump-my-version==0.29.0
        bump-my-version bump build --no-tag --no-commit
        echo "current_version=$(bump-my-version show current_version)" | tee -a $GITHUB_OUTPUT

    - name: Install python package
      run: python -m pip install .

    - name: Build
      run: |
        python -m build
        cat pyproject.toml || true

    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: dist/*
        retention-days: 5

    - name: Publish package to TestPyPI Experimental
      run: |
        python -m twine upload --repository-url https://artifacts.aws.cloud.mov.ai/repository/pypi-experimental/ \
          --username ${{ secrets.nexus_publisher_user }} \
          --password ${{ secrets.nexus_publisher_password }} \
          dist/*

    - name: Build docs
      if: ${{ inputs.with_docs }}
      run: |
        VERSION=${GITHUB_REF##*/} tox -e docs

    - name: Checkout gh-pages
      if: ${{ inputs.deploy && inputs.with_docs }}
      uses: actions/checkout@v6
      with:
        ref: gh-pages
        path: gh-pages

    - name: Push docs
      if: ${{ inputs.deploy && inputs.with_docs }}
      run: |
        cd gh-pages
        touch .nojekyll
        rm -rf ${GITHUB_REF##*/}
        cp -r ../docs/build/* .
        ls -mQd */ | sed 's/\///g' | sed 's/^/[/' | sed 's/$/]/' > versions.json
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        git config --global user.name "${{ github.actor }}"
        git add .
        git commit -am "Updating docs for commit ${GITHUB_SHA} in ${GITHUB_REF}"
        git push --force --set-upstream origin gh-pages

    - name: Publish package to TestPyPI Integration
      if: ${{ inputs.deploy }}
      run: |
        python -m twine upload --repository-url https://artifacts.aws.cloud.mov.ai/repository/pypi-integration/ \
          --username ${{ secrets.nexus_publisher_user }} \
          --password ${{ secrets.nexus_publisher_password }} \
          dist/*

  Post-Build:
    needs: [ Pre-build, Build ]
    if: |
      ${{ !inputs.release &&
          (always() ||
          needs.Pre-build.result == 'success' &&
          needs.Build.result == 'success')
      }}
    runs-on: ubuntu-22.04
    outputs:
      commit_id: ${{ steps.commit_id.outputs.commit_id }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Disabling shallow clone is recommended for improving relevancy of reporting
        fetch-depth: 0
        submodules: recursive

    - name: Download tests-report
      uses: actions/download-artifact@v4
      with:
        name: tests-report
        path: ./

    - name: Download coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage
        path: coverage

    - name: Create SonarCloud project and disable autoscan
      uses: MOV-AI/action-sonarcloud-proj-config@v1
      with:
        sonar_org: 'mov-ai'
        sonar_token: ${{ secrets.sonar_token }}

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v7
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SONAR_TOKEN: ${{ secrets.sonar_token }}
      with:
        projectBaseDir: ./
        args: >
          -Dsonar.organization=mov-ai
          -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
          -Dsonar.sources=.
          -Dsonar.scm.provider=git
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
          -Dsonar.coverage.exclusions=tests/**,docs/**
          -Dsonar.cpd.exclusions=tests/**,docs/**
          -Dsonar.python.version=3
          -Dsonar.python.flake8.reportPaths=flake8-report.txt
          -Dsonar.python.pylint.reportPaths=pylint-report.txt
          -Dsonar.python.coverage.reportPaths=coverage/coverage.xml

    - name: Link to SonarCloud dashboard
      shell: bash
      run: |
        echo "Please check report here: https://sonarcloud.io/project/overview?id=${{ github.repository_owner }}_${{ github.event.repository.name }}"

    - name: Raise version before commit
      id: bump
      run: |
        python3 -m venv venv --clear
        . venv/bin/activate
        pip install bump-my-version==0.29.0
        bump-my-version bump build --no-tag --no-commit
        echo "current_version=$(bump-my-version show current_version)" | tee -a $GITHUB_OUTPUT

    - name: Commit version bump
      id: commit_bump
      run: |
        git config --global user.name ${{ secrets.auto_commit_user }}
        git config --global user.email ${{ secrets.auto_commit_mail }}
        git config --global --add safe.directory $(pwd)
        git commit -am "[skip actions] Automatic Bump of build version to ${{ steps.bump.outputs.current_version }}"

    - name: Push version bump to protected branch
      uses: MOV-AI/.github/.github/actions/push-to-protected-branch@v3
      if: ${{ inputs.deploy }}
      with:
        token: ${{ secrets.auto_commit_password }}
        git_user_email: ${{ secrets.auto_commit_mail }}
        git_user_name: ${{ secrets.auto_commit_user }}
        branch: ${{ needs.Pre-build.outputs.branch }}
        repository: ${{ github.repository }}

    - name: Commit of version
      if: ${{ inputs.deploy }}
      id: commit_id
      run: |
        commit_hash=$(git log --format="%H" -n 1)
        echo "commit_id=${commit_hash}" >> $GITHUB_OUTPUT

    - name: Create Github Release
      if: ${{ inputs.deploy }}
      shell: bash
      run: |
        title="Release of ${{ steps.bump.outputs.current_version }}"

        gh release create -p -t "$title" -n "Release notes for ${{ github.event.repository.name }}" \
        --target ${{ steps.commit_id.outputs.commit_id }} \
        --generate-notes \
        "${{ steps.bump.outputs.current_version }}"

        assets=()
        for asset in dist/*; do
          if [[ $asset != "dist/*" ]]; then
            gh release upload ${{ steps.bump.outputs.current_version }} $asset
          fi
        done

      env:
        GITHUB_TOKEN: ${{ secrets.gh_token }}

  Release:
    strategy:
      matrix:
        publish_repo: ${{ fromJSON(inputs.prod_publish_repos) }}
    if: ${{ inputs.release }}
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set tag output
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

    - name: Fetch artifact from github release
      run: |
        git config --global --add safe.directory $(pwd)
        mkdir dist
        cd dist
        gh release download ${{ steps.vars.outputs.tag}} -p *.whl
        gh release download ${{ steps.vars.outputs.tag}} -p *.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.gh_token }}

    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: dist/*
        retention-days: 5

    - name: Publish package to ${{ matrix.publish_repo }}
      uses: pypa/gh-action-pypi-publish@v1.11.0
      with:
        user: ${{ secrets.nexus_publisher_user }}
        password: ${{ secrets.nexus_publisher_password }}
        repository-url: https://artifacts.aws.cloud.mov.ai/repository/${{ matrix.publish_repo }}/

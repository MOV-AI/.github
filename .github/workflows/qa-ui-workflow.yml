name: UI Tests
on:
  workflow_call:
    inputs:
      install_tests_ref:
        required: true
        type: string
        description: Install tests reference to use
      test_set:
        required: true
        type: string
        description: Test set to execute
      proxmox_cluster_name:
        required: false
        type: string
        default: hel0
      fleet_ips:
        required: false
        type: string
        default: '["dhcp","dhcp","dhcp"]'
      fleet_number_members:
        required: false
        type: number
        default: 2
      slack_channel:
        required: false
        type: string
        default: ''
      with_fleet_tests:
        required: false
        type: boolean
        default: true
      keep_fleet_alive:
        required: false
        type: boolean
        default: false
    secrets:
      gh_token:
        required: true
      auto_commit_user:
        required: true
      aws_key_id:
        required: true
      aws_secret_key_id:
        required: true
      slack_token_id:
        required: true
      jira_username:
        required: true
      jira_password:
        required: true
      xray_clientid:
        required: true
      xray_secret:
        required: true
      fleet_password:
        required: true
      proxmox_ve_username:
        required: true
      proxmox_ve_password:
        required: true
      ssh_pem_fleet_aws_vm:
        required: true
      auto_commit_pwd:
        required: true
      registry_user:
        required: true
      registry_password:
        required: true

env:
  CI_INTEGRATION_SCRIPTS_VERSION: "4.0.0.32"
  GITHUB_API_USR: "OttoMation-Movai"
  AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_key_id }}
  AWS_DEFAULT_REGION: "us-east-1"
  REGISTRY: registry.cloud.mov.ai
  PROVISION_INFRA_REPO: "devops-tf-proxmox-bpg"
  PROVISION_INFRA_VERSION: "2.2.0-2"
  PROVISIONING_ENV_VERSION: "0.2.2-5"
  PROVISIONING_ENV_REPO: devops-tf-env-conf
  ARTIFACTS_RETENTION_DAYS: 15

jobs:
  Validate-features:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Feature file validation
        shell: bash
        env:
          XRAY_CLIENTID: ${{ secrets.xray_clientid }}
          XRAY_SECRET: ${{ secrets.xray_secret }}
          JIRA_USERNAME: ${{ secrets.jira_username }}
          JIRA_PASSWORD: ${{ secrets.jira_password }}
        run: |
          # create virtual environment
          python3 -m venv venv --clear
          . venv/bin/activate

          # install tests requirements in venv
          pip install \
            -i https://artifacts.cloud.mov.ai/repository/pypi-integration/simple \
            --extra-index-url https://pypi.org/simple \
            -r requirements.txt

          xray download ${{ inputs.test_set }}
          xray compare ./tests/feature/

  Validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if pre-commit config exists
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: ".pre-commit-config.yaml"

      - name: Install dependencies
        if: steps.check_files.outputs.files_exists == 'true'
        run: pip install pre-commit

      - name: Run pre-commit
        if: steps.check_files.outputs.files_exists == 'true'
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  Resolve-fleet-context:
    needs: [Validate]
    runs-on: ubuntu-22.04
    outputs:
      fleet_tests_list: ${{ steps.extract_fleet_tests_list.outputs.fleet_tests_list }}
      slack_thread_id: ${{ steps.send-message.outputs.ts }}
      PROVISIONING_ENV_REPO: ${{ steps.export_env.outputs.PROVISIONING_ENV_REPO }}
      PROVISIONING_ENV_VERSION: ${{ steps.export_env.outputs.PROVISIONING_ENV_VERSION }}
      PROVISION_INFRA_REPO: ${{ steps.export_env.outputs.PROVISION_INFRA_REPO }}
      PROVISION_INFRA_VERSION: ${{ steps.export_env.outputs.PROVISION_INFRA_VERSION }}
      backend_name: ${{ steps.extract_backend_info.outputs.backend_name }}
      backend_version: ${{ steps.extract_backend_info.outputs.backend_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Export Env variables
        id: export_env
        shell: bash
        run: |
          echo "PROVISIONING_ENV_REPO=${PROVISIONING_ENV_REPO}" >> $GITHUB_OUTPUT
          echo "PROVISIONING_ENV_VERSION=${PROVISIONING_ENV_VERSION}" >> $GITHUB_OUTPUT
          echo "PROVISION_INFRA_REPO=${PROVISION_INFRA_REPO}" >> $GITHUB_OUTPUT
          echo "PROVISION_INFRA_VERSION=${PROVISION_INFRA_VERSION}" >> $GITHUB_OUTPUT

      - name: Extract fleet tests list
        id: extract_fleet_tests_list
        shell: bash
        run: |
          FLEET_TESTS=$(python3 -c "
          import json
          import yaml

          with open('installation/product-manifest.yaml') as f:
              data = yaml.safe_load(f)

          ui_tests_config = data['product_components']['qa'].get('ui_tests', {})
          fleet_test_names = ['ui_tests'] if isinstance(ui_tests_config, dict) and 'fleet' in ui_tests_config else []
          print(json.dumps(fleet_test_names))
          ")
          echo "fleet_tests_list=${FLEET_TESTS}" >> $GITHUB_OUTPUT

      - name: Extract backend info
        id: extract_backend_info
        shell: bash
        run: |
          BACKEND_INFO=$(python3 -c "
          import json
          import yaml

          with open('installation/product-manifest.yaml') as f:
              data = yaml.safe_load(f)

          backend_config = data['product_components']['platform_config']['backend']
          backend_name = backend_config.get('name', '')
          backend_version = backend_config.get('version', '')

          result = {
              'name': backend_name,
              'version': backend_version
          }
          print(json.dumps(result))
          ")

          BACKEND_NAME=$(echo "$BACKEND_INFO" | python3 -c "import sys, json; print(json.load(sys.stdin)['name'])")
          BACKEND_VERSION=$(echo "$BACKEND_INFO" | python3 -c "import sys, json; print(json.load(sys.stdin)['version'])")

          echo "backend_name=${BACKEND_NAME}" >> $GITHUB_OUTPUT
          echo "backend_version=${BACKEND_VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare slack variables
        id: pre_slack
        shell: bash
        run: |
          MESSAGE=":loading: QA UI Fleet validations started for ${GITHUB_REPOSITORY} (${GITHUB_REF#refs/heads/}) - Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT

      - name: Send Slack Message
        uses: slackapi/slack-github-action@v4
        id: send-message
        with:
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack.outputs.msg }}"
            }
          token: ${{ secrets.slack_token_id }}

  Run-Standalone-tests:
    runs-on: qa-runner
    needs: [Validate]
    steps:
      - name: Cleanup Workspace
        uses: rtCamp/action-cleanup@master

      - name: Checkout
        uses: actions/checkout@v7

      - name: Agent info
        id: agent_info
        run: |
          ip_tmp=$(hostname -I | awk '{print $1}')
          echo "ip=$ip_tmp" | tee >> $GITHUB_OUTPUT

      - name: Update/upgrade host packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 ; do echo Waiting for other software managers to finish... ; sleep 5;done
          sudo apt-get update
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 ; do echo Waiting for other software managers to finish... ; sleep 5;done
          sudo apt-get -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" upgrade -y

      - name: Setup environment
        shell: bash
        run: |
          # create virtual environment
          rm -rf venv
          python3 -m venv venv
          . venv/bin/activate

          # install tests requirements in venv
          pip install -r requirements.txt

      - name: UI tests
        id: ui
        shell: bash
        run: |
          export PYTHONPATH="${PYTHONPATH}:/usr/lib/python3/dist-packages"
          # activate venv
          . venv/bin/activate
          # tests execution
          pytest \
            --base_url https://${{ steps.agent_info.outputs.ip }}/ \
            --install-platform \
            | tee pytest-output.log

      - name: Save docker container logs
        if: always()
        shell: bash
        run: |
          # for sanity
          docker ps -a

          # save all container logs and inspect
          CONTAINERS=$(docker ps -a --format '{{.Names}}')
          for container in ${CONTAINERS}; do
              docker logs "${container}" &> "${container}.log" || true
              docker inspect "${container}" &> "${container}-inspect.log"
          done || true

          # movai-service
          journalctl -u movai-service --since '1hour ago' &> "movai-service.log"

          # spawner (mobros firmware)
          journalctl -u movai-service -t mobros --since '1hour ago' &> spawner-firmware.log || true

      - name: Stash QA artifacts
        if: always()
        shell: bash
        run: |
          # cleanup
          rm -rf qa_artifacts

          # tests artifacts
          # *.log and *.zip might not exist if the test fails early
          mkdir -p qa_artifacts
          cp -r *.log ./qa_artifacts || true
          cp -r *.tar ./qa_artifacts || true
          cp -r *.json ./qa_artifacts || true
          cp -r *.html ./qa_artifacts || true
          cp -r tests_artifacts ./qa_artifacts || true

          # install
          mkdir -p qa_artifacts/install
          cp -r ./installation ./qa_artifacts/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa_artifacts_ui_tests
          path: qa_artifacts/*
          retention-days: 3

      - name: Remove robots
        if: always()
        shell: bash
        run: |
          timeout 30 movai-cli remove --all || true

      - name: Docker cleanups
        if: always()
        shell: bash
        run: |
          if [ "$(docker ps -aq)" ]; then
            docker rm -f $(docker ps -aq)
          fi
          docker system prune -f
          docker image prune --all -f

  Run-Fleet-Tests:
    needs: [Validate, Resolve-fleet-context]
    uses: MOV-AI/.github/.github/workflows/integration-platform-remote-fleet-tests.yml@v3
    secrets: inherit
    with:
      fleet_test_infra_list: ${{ needs.Resolve-fleet-context.outputs.fleet_tests_list }}
      slack_thread_id: ${{ needs.Resolve-fleet-context.outputs.slack_thread_id }}
      backend_image_name_and_tag: ${{ needs.Resolve-fleet-context.outputs.backend_name }}:${{ needs.Resolve-fleet-context.outputs.backend_version }}
      test_timeout: 120
      slack_channel: ${{ inputs.slack_channel }}
      provision_tf_env_repo: ${{ needs.Resolve-fleet-context.outputs.PROVISIONING_ENV_REPO }}
      provision_tf_env_version: ${{ needs.Resolve-fleet-context.outputs.PROVISIONING_ENV_VERSION }}
      provision_infra_repo: ${{ needs.Resolve-fleet-context.outputs.PROVISION_INFRA_REPO }}
      provision_infra_version: ${{ needs.Resolve-fleet-context.outputs.PROVISION_INFRA_VERSION }}
      fleet_number_members: ${{ inputs.fleet_number_members }}
      fleet_ips: ${{ inputs.fleet_ips }}
      proxmox_cluster_name: ${{ inputs.proxmox_cluster_name }}
      with_fleet_tests: ${{ inputs.with_fleet_tests }}
      debug_fleet_keep_alive: ${{ inputs.keep_fleet_alive }}
      robot_config_download: false

  Run-Status:
    runs-on: ubuntu-22.04
    needs: [Validate-features, Validate, Resolve-fleet-context, Run-Standalone-tests, Run-Fleet-Tests]
    if: ${{ always() }}
    steps:
      - name: Prepare slack variables
        id: pre_slack
        shell: bash
        run: |
          STATUS_VALIDATE_FEATURES="${{ needs.Validate-features.result }}"
          STATUS_VALIDATE="${{ needs.Validate.result }}"
          STATUS_STANDALONE="${{ needs.Run-Standalone-tests.result }}"
          STATUS_FLEET="${{ needs.Run-Fleet-Tests.result }}"

          if [[ "$STATUS_VALIDATE_FEATURES" == "success" && "$STATUS_VALIDATE" == "success" && "$STATUS_STANDALONE" == "success" && ( "$STATUS_FLEET" == "success" || "$STATUS_FLEET" == "skipped" ) ]]; then
            MESSAGE=":white_check_mark: QA UI validations succeeded for ${GITHUB_REPOSITORY} (${GITHUB_REF#refs/heads/}) - Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            MESSAGE=":x: QA UI validations failed (or cancelled) for ${GITHUB_REPOSITORY} (${GITHUB_REF#refs/heads/}) - Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          echo "msg=${MESSAGE}" >> "$GITHUB_OUTPUT"

      - name: Update Slack Message
        if: ${{ always() && inputs.slack_channel != '' && needs.Resolve-fleet-context.result == 'success' && needs.Resolve-fleet-context.outputs.slack_thread_id != '' }}
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.update
          payload: |
            {
              "channel": "${{ inputs.slack_channel }}",
              "text": "${{ steps.pre_slack.outputs.msg }}",
              "ts": "${{ needs.Resolve-fleet-context.outputs.slack_thread_id }}"
            }
          token: ${{ secrets.slack_token_id }}

name: Infrastructure Recreation
on:
  workflow_call:
    inputs:
      INFRA_IP_CONFIGURATION:
        required: true
        type: string
      INFRA_QA_CONFIGURATION:
        required: true
        type: string
      INFRA_ROBOTICS_SIM_CONFIGURATION:
        required: true
        type: string
      INFRA_REDHAT_ORACLE_CONFIGURATION:
        required: true
        type: string
      INFRA_PACKER_CONFIGURATION:
        required: true
        type: string
      INFRA_NODES:
        required: true
        type: string

    secrets:
      auto_commit_user:
        required: true
      auto_commit_pwd:
        required: true
      aws_key_id:
        required: true
      aws_secret_key_id:
        required: true
      proxmox_ve_username:
        required: true
      proxmox_ve_password:
        required: true
      ssh_priv_key:
        required: true
      slack_token_id:
        required: true

env:
  CI_INTEGRATION_SCRIPTS_VERSION: "4.0.0.31"
  PROVISION_INFRA_REPO: "devops-tf-bpg-runners"
  PROVISION_INFRA_VERSION: "0.1.0-1"
  PROVISION_ENV_CONF_REPO: "devops-tf-env-conf"
  PROVISION_ENV_CONF_VERSION: "0.2.2-1"
  PROVISION_POOL: "GithubRunners"
  SLACK_CHANNEL: "G0102LEV1CL"
  NAMES_PREFIX: "ng-" # temporary to avoid conflicts with existing runners, can be removed once we validated new infrastructure
  # INFRA_NODES: '["hel0", "hel1"]'
  # INFRA_IP_CONFIGURATION: '{"hel0": 2,"hel1": 8}'
  # INFRA_QA_CONFIGURATION: '{"hel0": 1,"hel1": 2}'
  # INFRA_ROBOTICS_SIM_CONFIGURATION: '{"hel0": 1,"hel1": 1}'
  # INFRA_REDHAT_ORACLE_CONFIGURATION: '{"hel0": 1,"hel1": 1}'
  # INFRA_PACKER_CONFIGURATION: '{"hel0": 1,"hel1": 1}'

jobs:
  Slack-thread:
    runs-on: ubuntu-latest
    outputs:
      slack_thread_id: ${{ fromJson(steps.send-message.outputs.response).ts }}
    steps:
      - name: Prepare slack variables
        if: ${{ always() }}
        id: pre_slack
        run: |
          MESSAGE="Infrastructure recreation in progress on ${{ inputs.INFRA_NODES }} :construction:"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT

      - name: Send Slack Message
        uses: slackapi/slack-github-action@v2
        id: send-message
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_token_id }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "${{ steps.pre_slack.outputs.msg }}"
            }

  Destroy-IP-Runners:
    needs: Slack-thread
    runs-on: infra-runner
    env:
      PROXMOX_HOST: "https://${{ matrix.node }}.mov.ai:8006"
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON( inputs.INFRA_NODES ) }}
    outputs:
      slack_thread_id: ${{ needs.Slack-thread.outputs.slack_thread_id }}

    steps:
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: .terraform
          key: ${{ runner.os }}-tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-providers-

      - name: Setup CI virtual environment
        uses: ./.github/actions/setup-ci-venv
        with:
          ci_integration_scripts_version: ${{ env.CI_INTEGRATION_SCRIPTS_VERSION }}

      - name: Fetch environment configuration
        id: provision_infra_env_conf
        uses: ./.github/actions/fetch-integration-pipeline-repo
        with:
          repo_name: ${{ env.PROVISION_ENV_CONF_REPO }}
          repo_version: ${{ env.PROVISION_ENV_CONF_VERSION }}
          target_dir: ${{ env.PROVISION_ENV_CONF_REPO }}
          gh_api_user: ${{ secrets.auto_commit_user }}
          gh_api_pwd: ${{ secrets.auto_commit_pwd }}
          venv_path: ".ci-venv"

      - name: Fetch Terraform provisioner
        id: provision_infra_setup
        uses: ./.github/actions/fetch-integration-pipeline-repo
        with:
          repo_name: ${{ env.PROVISION_INFRA_REPO }}
          repo_version: ${{ env.PROVISION_INFRA_VERSION }}
          target_dir: ${{ env.PROVISION_INFRA_REPO }}
          gh_api_user: ${{ secrets.auto_commit_user }}
          gh_api_pwd: ${{ secrets.auto_commit_pwd }}
          venv_path: ".ci-venv"

      - name: Setup Terraform variables for destroy
        uses: ./.github/actions/setup-terraform-tfvars-infra
        with:
          runner_configuration: ${{ toJson(inputs.INFRA_IP_CONFIGURATION) }}
          runner_profile: "gh_runner"
          node: ${{ matrix.node }}
          env_conf_repo: ${{ steps.provision_infra_env_conf.outputs.target_dir }}
          names_prefix: ${{ env.NAMES_PREFIX }}
          runner_type_label: "ip-runner"
          provision_pool: ${{ env.PROVISION_POOL }}
          proxmox_ve_username: ${{ secrets.proxmox_ve_username }}
          proxmox_ve_password: ${{ secrets.proxmox_ve_password }}
          gh_access_token: ${{ secrets.auto_commit_pwd }}

      - name: Terraform destroy
        uses: ./.github/actions/terraform-apply-with-cleanup-infra
        with:
          working_directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
          backend_key: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-ip-runners.tfstate
          tfvars_file: ${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_runner.tfvars
          input_tfvars: input.tfvars
          action_type: "destroy"
          aws_access_key_id: ${{ secrets.aws_key_id }}
          aws_secret_access_key: ${{ secrets.aws_secret_key_id }}

      - name: Verify VMs destroyed
        uses: ./.github/actions/verify-vm-status-infra
        with:
          action_type: "destroyed"
          proxmox_host: ${{ env.PROXMOX_HOST }}
          proxmox_username: ${{ secrets.proxmox_ve_username }}
          proxmox_password: ${{ secrets.proxmox_ve_password }}
          vm_name_prefix: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-ip-runner
          node_name: ${{ matrix.node }}
          expected_count: ${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }}

      - name: Setup SSH key for next provisioning step
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ssh_priv_key }}" > ~/.ssh/ci_priv_key.pem
          sudo chmod 600 ~/.ssh/ci_priv_key.pem
          echo "✓ SSH key configured"

      - name: Send Slack notification
        if: always()
        uses: ./.github/actions/slack-notify-infra
        with:
          message: ":white_check_mark: ${{ github.job }} ${{ matrix.node }} IP runners destroyed (Attempt: #${{ github.run_attempt }})"
          message_error: ":x: ${{ github.job }} ${{ matrix.node }} Failed to destroy IP runners (Attempt: #${{ github.run_attempt }})"
          slack_token: ${{ secrets.slack_token_id }}
          slack_channel: ${{ env.SLACK_CHANNEL }}
          slack_thread_id: ${{ needs.Slack-thread.outputs.slack_thread_id }}
          gh_api_token: ${{ secrets.auto_commit_pwd }}
          job_name: ${{ github.job }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

  Provision-IP-Runners:
    needs: [Destroy-IP-Runners]
    runs-on: infra-runner
    env:
      PROXMOX_HOST: "https://${{ matrix.node }}.mov.ai:8006"
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON( inputs.INFRA_NODES ) }}
    outputs:
      slack_thread_id: ${{ needs.Destroy-IP-Runners.outputs.slack_thread_id }}

    steps:
    - name: Cache Terraform providers
      uses: actions/cache@v4
      with:
        path: .terraform
        key: ${{ runner.os }}-tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-tf-providers-

    - name: Setup CI virtual environment
      uses: ./.github/actions/setup-ci-venv
      with:
        ci_integration_scripts_version: ${{ env.CI_INTEGRATION_SCRIPTS_VERSION }}

    - name: Fetch environment configuration
      id: provision_infra_env_conf
      uses: ./.github/actions/fetch-integration-pipeline-repo
      with:
        repo_name: ${{ env.PROVISION_ENV_CONF_REPO }}
        repo_version: ${{ env.PROVISION_ENV_CONF_VERSION }}
        target_dir: ${{ env.PROVISION_ENV_CONF_REPO }}
        gh_api_user: ${{ secrets.auto_commit_user }}
        gh_api_pwd: ${{ secrets.auto_commit_pwd }}
        venv_path: ".ci-venv"

    - name: Fetch Terraform provisioner
      id: provision_infra_setup
      uses: ./.github/actions/fetch-integration-pipeline-repo
      with:
        repo_name: ${{ env.PROVISION_INFRA_REPO }}
        repo_version: ${{ env.PROVISION_INFRA_VERSION }}
        target_dir: ${{ env.PROVISION_INFRA_REPO }}
        gh_api_user: ${{ secrets.auto_commit_user }}
        gh_api_pwd: ${{ secrets.auto_commit_pwd }}
        venv_path: ".ci-venv"

    - name: Setup Terraform variables for provision
      uses: ./.github/actions/setup-terraform-tfvars-infra
      with:
        runner_configuration: ${{ toJson(inputs.INFRA_IP_CONFIGURATION) }}
        runner_profile: "gh_runner"
        node: ${{ matrix.node }}
        env_conf_repo: ${{ steps.provision_infra_env_conf.outputs.target_dir }}
        names_prefix: ${{ env.NAMES_PREFIX }}
        runner_type_label: "ip-runner"
        provision_pool: ${{ env.PROVISION_POOL }}
        proxmox_ve_username: ${{ secrets.proxmox_ve_username }}
        proxmox_ve_password: ${{ secrets.proxmox_ve_password }}
        gh_access_token: ${{ secrets.auto_commit_pwd }}
        extra_cloud_init_packages: "python3-dev"

    - name: Terraform validate and plan for provision
      uses: ./.github/actions/terraform-validate-and-plan
      with:
        working_directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
        backend_key: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-ip-runners.tfstate
        tfvars_file: ${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_runner.tfvars
        input_tfvars: input.tfvars
        aws_access_key_id: ${{ secrets.aws_key_id }}
        aws_secret_access_key: ${{ secrets.aws_secret_key_id }}

    - name: Terraform apply for provision
      uses: ./.github/actions/terraform-apply-with-cleanup-infra
      with:
        working_directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
        backend_key: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-ip-runners.tfstate
        tfvars_file: ${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_runner.tfvars
        input_tfvars: input.tfvars
        action_type: "apply"
        aws_access_key_id: ${{ secrets.aws_key_id }}
        aws_secret_access_key: ${{ secrets.aws_secret_key_id }}

    - name: Verify VMs provisioned
      uses: ./.github/actions/verify-vm-status-infra
      with:
        action_type: "provisioned"
        proxmox_host: ${{ env.PROXMOX_HOST }}
        proxmox_username: ${{ secrets.proxmox_ve_username }}
        proxmox_password: ${{ secrets.proxmox_ve_password }}
        vm_name_prefix: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-ip-runner
        node_name: ${{ matrix.node }}
        expected_count: ${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }}

    - name: Setup SSH key for runner registration
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ssh_priv_key }}" > ~/.ssh/ci_priv_key.pem
        sudo chmod 600 ~/.ssh/ci_priv_key.pem
        echo "✓ SSH key configured"

    - name: Send Slack notification
      if: always()
      uses: ./.github/actions/slack-notify-infra
      with:
        message: ":white_check_mark: ${{ github.job }} ${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }} IP runners provisioned successfully in ${{ matrix.node }}! (Attempt: #${{ github.run_attempt }})"
        message_error: ":x: ${{ github.job }} Failed to provision IP runners in ${{ matrix.node }}! (Attempt: #${{ github.run_attempt }})"
        slack_token: ${{ secrets.slack_token_id }}
        slack_channel: ${{ env.SLACK_CHANNEL }}
        slack_thread_id: ${{ needs.Destroy-IP-Runners.outputs.slack_thread_id }}
        gh_api_token: ${{ secrets.auto_commit_pwd }}
        job_name: ${{ github.job }}
        repository: ${{ github.repository }}
        run_id: ${{ github.run_id }}
        run_attempt: ${{ github.run_attempt }}

  Destroy-QA-Runners:
    needs: Slack-thread
    runs-on: infra-runner
    env:
      PROXMOX_HOST: "https://${{ matrix.node }}.mov.ai:8006"
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON( inputs.INFRA_NODES ) }}
    outputs:
      slack_thread_id: ${{ needs.Slack-thread.outputs.slack_thread_id }}

    steps:
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: .terraform
          key: ${{ runner.os }}-tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-providers-

      - name: Setup CI virtual environment
        uses: ./.github/actions/setup-ci-venv
        with:
          ci_integration_scripts_version: ${{ env.CI_INTEGRATION_SCRIPTS_VERSION }}

      - name: Fetch environment configuration
        id: provision_infra_env_conf
        uses: ./.github/actions/fetch-integration-pipeline-repo
        with:
          repo_name: ${{ env.PROVISION_ENV_CONF_REPO }}
          repo_version: ${{ env.PROVISION_ENV_CONF_VERSION }}
          target_dir: ${{ env.PROVISION_ENV_CONF_REPO }}
          gh_api_user: ${{ secrets.auto_commit_user }}
          gh_api_pwd: ${{ secrets.auto_commit_pwd }}
          venv_path: ".ci-venv"

      - name: Fetch Terraform provisioner
        id: provision_infra_setup
        uses: ./.github/actions/fetch-integration-pipeline-repo
        with:
          repo_name: ${{ env.PROVISION_INFRA_REPO }}
          repo_version: ${{ env.PROVISION_INFRA_VERSION }}
          target_dir: ${{ env.PROVISION_INFRA_REPO }}
          gh_api_user: ${{ secrets.auto_commit_user }}
          gh_api_pwd: ${{ secrets.auto_commit_pwd }}
          venv_path: ".ci-venv"

      - name: Setup Terraform variables for destroy
        uses: ./.github/actions/setup-terraform-tfvars-infra
        with:
          runner_configuration: ${{ toJson(inputs.INFRA_QA_CONFIGURATION) }}
          runner_profile: "gh_runner"
          node: ${{ matrix.node }}
          env_conf_repo: ${{ steps.provision_infra_env_conf.outputs.target_dir }}
          names_prefix: ${{ env.NAMES_PREFIX }}
          runner_type_label: "qa-runner"
          provision_pool: ${{ env.PROVISION_POOL }}
          proxmox_ve_username: ${{ secrets.proxmox_ve_username }}
          proxmox_ve_password: ${{ secrets.proxmox_ve_password }}
          gh_access_token: ${{ secrets.auto_commit_pwd }}

      - name: Terraform destroy
        uses: ./.github/actions/terraform-apply-with-cleanup-infra
        with:
          working_directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
          backend_key: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-qa-runners.tfstate
          tfvars_file: ${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_runner.tfvars
          input_tfvars: input.tfvars
          action_type: "destroy"
          aws_access_key_id: ${{ secrets.aws_key_id }}
          aws_secret_access_key: ${{ secrets.aws_secret_key_id }}

      - name: Verify VMs destroyed
        uses: ./.github/actions/verify-vm-status-infra
        with:
          action_type: "destroyed"
          proxmox_host: ${{ env.PROXMOX_HOST }}
          proxmox_username: ${{ secrets.proxmox_ve_username }}
          proxmox_password: ${{ secrets.proxmox_ve_password }}
          vm_name_prefix: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-qa-runner
          node_name: ${{ matrix.node }}
          expected_count: ${{ fromJson(inputs.INFRA_QA_CONFIGURATION)[matrix.node] }}

      - name: Setup SSH key for next provisioning step
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ssh_priv_key }}" > ~/.ssh/ci_priv_key.pem
          sudo chmod 600 ~/.ssh/ci_priv_key.pem
          echo "✓ SSH key configured"

      - name: Send Slack notification
        if: always()
        uses: ./.github/actions/slack-notify-infra
        with:
          message: ":white_check_mark: ${{ github.job }} ${{ matrix.node }} QA runners destroyed (Attempt: #${{ github.run_attempt }})"
          message_error: ":x: ${{ github.job }} ${{ matrix.node }} Failed to destroy QA runners (Attempt: #${{ github.run_attempt }})"
          slack_token: ${{ secrets.slack_token_id }}
          slack_channel: ${{ env.SLACK_CHANNEL }}
          slack_thread_id: ${{ needs.Slack-thread.outputs.slack_thread_id }}
          gh_api_token: ${{ secrets.auto_commit_pwd }}
          job_name: ${{ github.job }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

  Provision-QA-Runners:
    needs: [Destroy-QA-Runners]
    runs-on: infra-runner
    env:
      PROXMOX_HOST: "https://${{ matrix.node }}.mov.ai:8006"
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON( inputs.INFRA_NODES ) }}
    outputs:
      slack_thread_id: ${{ needs.Destroy-QA-Runners.outputs.slack_thread_id }}
    steps:
    - name: Cache Terraform providers
      uses: actions/cache@v4
      with:
        path: .terraform
        key: ${{ runner.os }}-tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-tf-providers-

    - name: Setup CI virtual environment
      uses: ./.github/actions/setup-ci-venv
      with:
        ci_integration_scripts_version: ${{ env.CI_INTEGRATION_SCRIPTS_VERSION }}

    - name: Fetch environment configuration
      id: provision_infra_env_conf
      uses: ./.github/actions/fetch-integration-pipeline-repo
      with:
        repo_name: ${{ env.PROVISION_ENV_CONF_REPO }}
        repo_version: ${{ env.PROVISION_ENV_CONF_VERSION }}
        target_dir: ${{ env.PROVISION_ENV_CONF_REPO }}
        gh_api_user: ${{ secrets.auto_commit_user }}
        gh_api_pwd: ${{ secrets.auto_commit_pwd }}
        venv_path: ".ci-venv"

    - name: Fetch Terraform provisioner
      id: provision_infra_setup
      uses: ./.github/actions/fetch-integration-pipeline-repo
      with:
        repo_name: ${{ env.PROVISION_INFRA_REPO }}
        repo_version: ${{ env.PROVISION_INFRA_VERSION }}
        target_dir: ${{ env.PROVISION_INFRA_REPO }}
        gh_api_user: ${{ secrets.auto_commit_user }}
        gh_api_pwd: ${{ secrets.auto_commit_pwd }}
        venv_path: ".ci-venv"

    - name: Setup Terraform variables for provision
      uses: ./.github/actions/setup-terraform-tfvars-infra
      with:
        runner_configuration: ${{ toJson(inputs.INFRA_QA_CONFIGURATION) }}
        runner_profile: "gh_runner"
        node: ${{ matrix.node }}
        env_conf_repo: ${{ steps.provision_infra_env_conf.outputs.target_dir }}
        names_prefix: ${{ env.NAMES_PREFIX }}
        runner_type_label: "qa-runner"
        provision_pool: ${{ env.PROVISION_POOL }}
        proxmox_ve_username: ${{ secrets.proxmox_ve_username }}
        proxmox_ve_password: ${{ secrets.proxmox_ve_password }}
        gh_access_token: ${{ secrets.auto_commit_pwd }}
        extra_cloud_init_packages: "python3-dev"

    - name: Terraform validate and plan for provision
      uses: ./.github/actions/terraform-validate-and-plan
      with:
        working_directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
        backend_key: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-qa-runners.tfstate
        tfvars_file: ${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_runner.tfvars
        input_tfvars: input.tfvars
        aws_access_key_id: ${{ secrets.aws_key_id }}
        aws_secret_access_key: ${{ secrets.aws_secret_key_id }}

    - name: Terraform apply for provision
      uses: ./.github/actions/terraform-apply-with-cleanup-infra
      with:
        working_directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
        backend_key: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-qa-runners.tfstate
        tfvars_file: ${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_runner.tfvars
        input_tfvars: input.tfvars
        action_type: "apply"
        aws_access_key_id: ${{ secrets.aws_key_id }}
        aws_secret_access_key: ${{ secrets.aws_secret_key_id }}

    - name: Verify VMs provisioned
      uses: ./.github/actions/verify-vm-status-infra
      with:
        action_type: "provisioned"
        proxmox_host: ${{ env.PROXMOX_HOST }}
        proxmox_username: ${{ secrets.proxmox_ve_username }}
        proxmox_password: ${{ secrets.proxmox_ve_password }}
        vm_name_prefix: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-qa-runner
        node_name: ${{ matrix.node }}
        expected_count: ${{ fromJson(inputs.INFRA_QA_CONFIGURATION)[matrix.node] }}

    - name: Setup SSH key for runner registration
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ssh_priv_key }}" > ~/.ssh/ci_priv_key.pem
        sudo chmod 600 ~/.ssh/ci_priv_key.pem
        echo "✓ SSH key configured"

    - name: Send Slack notification
      if: always()
      uses: ./.github/actions/slack-notify-infra
      with:
        message: ":white_check_mark: ${{ github.job }} ${{ fromJson(inputs.INFRA_QA_CONFIGURATION)[matrix.node] }} QA runners provisioned successfully in ${{matrix.node}}! (Attempt: #${{ github.run_attempt }})"
        message_error: ":x: ${{ github.job }} Failed to provision QA runners in ${{ matrix.node }}! (Attempt: #${{ github.run_attempt }})"
        slack_token: ${{ secrets.slack_token_id }}
        slack_channel: ${{ env.SLACK_CHANNEL }}
        slack_thread_id: ${{ needs.Destroy-QA-Runners.outputs.slack_thread_id }}
        gh_api_token: ${{ secrets.auto_commit_pwd }}
        job_name: ${{ github.job }}
        repository: ${{ github.repository }}
        run_id: ${{ github.run_id }}
        run_attempt: ${{ github.run_attempt }}

  Destroy-Robotics-Sim-Runners:
    needs: Slack-thread
    runs-on: infra-runner
    env:
      PROXMOX_HOST: "https://${{ matrix.node }}.mov.ai:8006"
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON( inputs.INFRA_NODES ) }}
    outputs:
      slack_thread_id: ${{ needs.Slack-thread.outputs.slack_thread_id }}

    steps:
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: .terraform
          key: ${{ runner.os }}-tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-providers-

      - name: Setup CI virtual environment
        uses: ./.github/actions/setup-ci-venv
        with:
          ci_integration_scripts_version: ${{ env.CI_INTEGRATION_SCRIPTS_VERSION }}

      - name: Fetch environment configuration
        id: provision_infra_env_conf
        uses: ./.github/actions/fetch-integration-pipeline-repo
        with:
          repo_name: ${{ env.PROVISION_ENV_CONF_REPO }}
          repo_version: ${{ env.PROVISION_ENV_CONF_VERSION }}
          target_dir: ${{ env.PROVISION_ENV_CONF_REPO }}
          gh_api_user: ${{ secrets.auto_commit_user }}
          gh_api_pwd: ${{ secrets.auto_commit_pwd }}
          venv_path: ".ci-venv"

      - name: Fetch Terraform provisioner
        id: provision_infra_setup
        uses: ./.github/actions/fetch-integration-pipeline-repo
        with:
          repo_name: ${{ env.PROVISION_INFRA_REPO }}
          repo_version: ${{ env.PROVISION_INFRA_VERSION }}
          target_dir: ${{ env.PROVISION_INFRA_REPO }}
          gh_api_user: ${{ secrets.auto_commit_user }}
          gh_api_pwd: ${{ secrets.auto_commit_pwd }}

        sudo apt update && sudo apt install terraform=1.5.2-1 --allow-downgrades -y

    - name: Provision remote vms (Proxmox)
      working-directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
      shell: bash
      run: |
        multiply_node=$(printf '"${{ matrix.node }}",%.0s' {1..${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }}})
        node_list_str=${multiply_node::-1}
        multiply_ips=$(printf '"dhcp",%.0s' {1..${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }}})
        ip_list_str=${multiply_ips::-1}
        var_file_arg='-var-file=../${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_runner.tfvars'


        echo "proxmox_host_list=[$node_list_str]">>input.tfvars

        echo 'gh_runner_nr="${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }}"'>>input.tfvars
        echo 'gh_runner_name_prefix="${{ matrix.node }}-ip-runner"'>>input.tfvars
        echo "ip_list=[$ip_list_str]">>input.tfvars
        echo 'tags=["ip-runner"]'>>input.tfvars
        echo 'pool="IP-Temp-VMs"'>>input.tfvars
        echo 'proxmox_ve_username="${{ secrets.proxmox_ve_username }}"'>>input.tfvars
        echo 'proxmox_ve_password="${{ secrets.proxmox_ve_password }}"'>>input.tfvars
        echo 'gh_access_token="${{ secrets.auto_commit_pwd }}"'>>input.tfvars
        echo 'gh_runner_labels=["integration-pipeline-${{ matrix.node }}"]'>>input.tfvars
        echo "\n">>input

        echo "File args: $var_file_arg"
        echo "Input File args: $(cat input.tfvars)"
        terraform init -backend-config="key=${{ matrix.node }}-ip-runners.tfstate"
        terraform apply -auto-approve $var_file_arg -var-file=input.tfvars
        terraform refresh $var_file_arg -var-file=input.tfvars

        echo "${{ secrets.ssh_priv_key }}" > ~/.ssh/ci_priv_key.pem
        sudo chmod 600 ~/.ssh/ci_priv_key.pem

      env:
        aws_key_id_ID: ${{ secrets.aws_key_id }}
        aws_secret_key_id: ${{ secrets.aws_secret_key_id }}
        AWS_DEFAULT_REGION: "us-east-1"



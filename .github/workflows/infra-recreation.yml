    - name: Setup env conf
      id: provision_infra_env_conf
      shell: bash
      run: |
        . .ci-venv/bin/activate
        provision_infra_dir=${{ env.PROVISION_ENV_CONF_REPO }}
        provision_infra_version=${{ env.PROVISION_ENV_CONF_VERSION }}

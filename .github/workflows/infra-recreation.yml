          message_error: ":x: ${{ github.job }} ${{ matrix.node }} Failed to destroy Packer runners (Attempt: #${{ github.run_attempt }})"
          slack_token: ${{ secrets.slack_token_id }}
          slack_channel: ${{ env.SLACK_CHANNEL }}
          slack_thread_id: ${{ needs.Slack-thread.outputs.slack_thread_id }}
          gh_api_token: ${{ secrets.auto_commit_pwd }}
          job_name: ${{ github.job }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

  Provision-Packer-Runners:
    needs: [Destroy-Packer-Runners]
    runs-on: infra-runner
    env:
      PROXMOX_HOST: "https://${{ matrix.node }}.mov.ai:8006"
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON( inputs.INFRA_NODES ) }}
    outputs:
      slack_thread_id: ${{ needs.Destroy-Packer-Runners.outputs.slack_thread_id }}
    steps:

    - name: Cache Terraform providers
      uses: actions/cache@v4
      with:
        path: .terraform
        key: ${{ runner.os }}-tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-tf-providers-

    - name: Setup CI virtual environment
      uses: ./.github/actions/setup-ci-venv
      with:
        ci_integration_scripts_version: ${{ env.CI_INTEGRATION_SCRIPTS_VERSION }}

    - name: Fetch environment configuration
      id: provision_infra_env_conf
      uses: ./.github/actions/fetch-integration-pipeline-repo
      with:
        repo_name: ${{ env.PROVISION_ENV_CONF_REPO }}
        repo_version: ${{ env.PROVISION_ENV_CONF_VERSION }}
        target_dir: ${{ env.PROVISION_ENV_CONF_REPO }}
        gh_api_user: ${{ secrets.auto_commit_user }}
        gh_api_pwd: ${{ secrets.auto_commit_pwd }}
        venv_path: ".ci-venv"

    - name: Fetch Terraform provisioner
      id: provision_infra_setup
      uses: ./.github/actions/fetch-integration-pipeline-repo
      with:
        repo_name: ${{ env.PROVISION_INFRA_REPO }}
        repo_version: ${{ env.PROVISION_INFRA_VERSION }}
        target_dir: ${{ env.PROVISION_INFRA_REPO }}
        gh_api_user: ${{ secrets.auto_commit_user }}
        gh_api_pwd: ${{ secrets.auto_commit_pwd }}
        venv_path: ".ci-venv"

    - name: Setup Terraform variables for provision
      uses: ./.github/actions/setup-terraform-tfvars-infra
      with:
        runner_configuration: ${{ toJson(inputs.INFRA_PACKER_CONFIGURATION) }}
        runner_profile: "gh_packer_runner"
        node: ${{ matrix.node }}
        env_conf_repo: ${{ steps.provision_infra_env_conf.outputs.target_dir }}
        names_prefix: ${{ env.NAMES_PREFIX }}
        runner_type_label: "packer-runner"
        provision_pool: ${{ env.PROVISION_POOL }}
        proxmox_ve_username: ${{ secrets.proxmox_ve_username }}
        proxmox_ve_password: ${{ secrets.proxmox_ve_password }}
        gh_access_token: ${{ secrets.auto_commit_pwd }}
        extra_cloud_init_packages: "python3-dev"

    - name: Terraform validate and plan for provision
      uses: ./.github/actions/terraform-validate-and-plan
      with:
        working_directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
        backend_key: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-packer-runners.tfstate
        tfvars_file: ${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_packer_runner.tfvars
        input_tfvars: input.tfvars
        aws_access_key_id: ${{ secrets.aws_key_id }}
        aws_secret_access_key: ${{ secrets.aws_secret_key_id }}

    - name: Terraform apply for provision
      uses: ./.github/actions/terraform-apply-with-cleanup-infra
      with:
        working_directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
        backend_key: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-packer-runners.tfstate
        tfvars_file: ${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_packer_runner.tfvars
        input_tfvars: input.tfvars
        action_type: "apply"
        aws_access_key_id: ${{ secrets.aws_key_id }}
        aws_secret_access_key: ${{ secrets.aws_secret_key_id }}

    - name: Verify VMs provisioned
      uses: ./.github/actions/verify-vm-status-infra
      with:
        action_type: "provisioned"
        proxmox_host: ${{ env.PROXMOX_HOST }}
        proxmox_username: ${{ secrets.proxmox_ve_username }}
        proxmox_password: ${{ secrets.proxmox_ve_password }}
        vm_name_prefix: ${{ env.NAMES_PREFIX }}${{ matrix.node }}-packer-runner
        node_name: ${{ matrix.node }}
        expected_count: ${{ fromJson(inputs.INFRA_PACKER_CONFIGURATION)[matrix.node] }}

    - name: Setup SSH key for runner registration
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ssh_priv_key }}" > ~/.ssh/ci_priv_key.pem
        sudo chmod 600 ~/.ssh/ci_priv_key.pem
        echo "✓ SSH key configured"

    - name: Send Slack notification
      if: always()
      uses: ./.github/actions/slack-notify-infra
      with:
        message: ":white_check_mark: ${{ github.job }} ${{ fromJson(inputs.INFRA_PACKER_CONFIGURATION)[matrix.node] }} Packer runners provisioned successfully in ${{matrix.node}}! (Attempt: #${{ github.run_attempt }})"
        message_error: ":x: ${{ github.job }} Failed to provision Packer runners in ${{ matrix.node }}! (Attempt: #${{ github.run_attempt }})"
        slack_token: ${{ secrets.slack_token_id }}
        slack_channel: ${{ env.SLACK_CHANNEL }}
        slack_thread_id: ${{ needs.Destroy-Packer-Runners.outputs.slack_thread_id }}
        gh_api_token: ${{ secrets.auto_commit_pwd }}
        job_name: ${{ github.job }}
        repository: ${{ github.repository }}
        run_id: ${{ github.run_id }}
        run_attempt: ${{ github.run_attempt }}

  Run-Status:
    needs: [Provision-IP-Runners, Provision-QA-Runners, Provision-Robotics-Sim-Runners, Provision-Redhat-Oracle-Runners, Provision-Packer-Runners]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Prepare slack variables
        if: ${{ always() }}
        id: pre_slack
        run: |
          MESSAGE="Infrastructure recreated successfully  on ${{ inputs.INFRA_NODES }} ! :sunny:"
          MESSAGE_ERR="Infrastructure recreation failed  on ${{ inputs.INFRA_NODES }} ! :rain_cloud:"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT
          echo "msg_err=${MESSAGE_ERR}" >> $GITHUB_OUTPUT

      - name: Send Slack Message
        if: ${{ needs.Provision-IP-Runners.result == 'success' && needs.Provision-QA-Runners.result == 'success' && needs.Provision-Robotics-Sim-Runners.result == 'success' && needs.Provision-Redhat-Oracle-Runners.result == 'success' && needs.Provision-Packer-Runners.result == 'success' }}
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.update
          token: ${{ secrets.slack_token_id }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "ts": "${{ needs.Provision-IP-Runners.outputs.slack_thread_id }}",
              "text": "${{ steps.pre_slack.outputs.msg }}"
            }

      - name: Send Slack Message
        if: ${{ always() && (! needs.Provision-IP-Runners.result == 'success' || ! needs.Provision-QA-Runners.result == 'success' || ! needs.Provision-Robotics-Sim-Runners.result == 'success' || ! needs.Provision-Redhat-Oracle-Runners.result == 'success' || ! needs.Provision-Packer-Runners.result == 'success') }}
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.update
          token: ${{ secrets.slack_token_id }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "ts": "${{ needs.Provision-IP-Runners.outputs.slack_thread_id }}",
              "text": "${{ steps.pre_slack.outputs.msg_err }}"
            }

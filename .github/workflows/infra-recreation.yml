          var_file_arg="-var-file=${selected_var_file}"
          echo "Selected tfvars: ${selected_var_file}"


          echo "proxmox_host_list=[$node_list_str]">>input.tfvars

          echo 'gh_runner_nr="${{ fromJson(inputs.INFRA_QA_CONFIGURATION)[matrix.node] }}"'>>input.tfvars
          echo 'gh_runner_name_prefix="${{ env.NAMES_PREFIX }}${{ matrix.node }}-qa-runner"'>>input.tfvars
          echo "ip_list=[$ip_list_str]">>input.tfvars
          echo 'tags=["ip-runner"]'>>input.tfvars
          echo 'pool="${{ env.PROVISION_POOL }}"'>>input.tfvars
          echo 'proxmox_ve_username="${{ secrets.proxmox_ve_username }}"'>>input.tfvars
          echo 'proxmox_ve_password="${{ secrets.proxmox_ve_password }}"'>>input.tfvars
          echo 'gh_access_token="${{ secrets.auto_commit_pwd }}"'>>input.tfvars
          echo 'gh_runner_labels=["qa-pipeline-${{ matrix.node }}"]'>>input.tfvars


          echo "File args: $var_file_arg"
          echo "Input File args: $(cat input.tfvars)"
          terraform init -backend-config="key=${{ env.NAMES_PREFIX }}${{ matrix.node }}-qa-runners.tfstate"
          terraform destroy -auto-approve $var_file_arg -var-file=input.tfvars

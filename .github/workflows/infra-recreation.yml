name: Infrastructure Recreation
on:
  workflow_call:
    inputs:
      INFRA_IP_CONFIGURATION:
        required: true
        type: string
      INFRA_QA_CONFIGURATION:
        required: true
        type: string
      INFRA_NODES:
        required: true
        type: string

    secrets:
      auto_commit_user:
        required: true
      auto_commit_pwd:
        required: true
      aws_key_id:
        required: true
      aws_secret_key_id:
        required: true
      proxmox_ve_username:
        required: true
      proxmox_ve_password:
        required: true
      ssh_priv_key:
        required: true
env:
  CI_INTEGRATION_SCRIPTS_VERSION: "4.0.0.31"
  PROVISION_INFRA_REPO: "devops-tf-bpg-runners"
  PROVISION_INFRA_VERSION: "dev"
  PROVISION_ENV_CONF_REPO: "devops-tf-env-conf"
  PROVISION_ENV_CONF_VERSION: "feat/DP-1737-2"
  #INFRA_NODES: '["hel0", "hel1"]'
  #INFRA_IP_CONFIGURATION: '{"hel0": 0,"hel1": 4}'
  #INFRA_QA_CONFIGURATION: '{"hel0": 0,"hel1": 1}'

jobs:
  Destroy-IP-Runners:
    runs-on: infra-runner
    strategy:
      matrix:
        node: ${{ fromJSON( inputs.INFRA_NODES ) }}
      
    steps:

      - name: Setup CI Scripts in .ci-venv
        shell: bash
        run: |
          cat << EOF | sudo tee /etc/pip.conf
          [global]
          index-url = https://artifacts.aws.cloud.mov.ai/repository/pypi-integration/simple
          extra-index-url = https://pypi.org/simple
          trusted-host = artifacts.cloud.mov.ai
                        pypi.org
          EOF
          cat /etc/pip.conf
          python3 -m venv .ci-venv --clear --system-site-packages # needed for apt dependencies
          . .ci-venv/bin/activate
          python3 -m pip install pyOpenSSL --upgrade pip
          [ -f ci-requirements.txt ] && pip install -r ci-requirements.txt
          python3 -m pip install integration-pipeline==$CI_INTEGRATION_SCRIPTS_VERSION --ignore-installed
  
      - name: Setup env conf
        id: provision_infra_env_conf
        shell: bash
        run: |
          . .ci-venv/bin/activate
          provision_infra_dir=${{ env.PROVISION_ENV_CONF_REPO }}
          provision_infra_version=${{ env.PROVISION_ENV_CONF_VERSION }}
          provision_infra_repo_name=${{ env.PROVISION_ENV_CONF_REPO }}
  
          rm -rf $provision_infra_dir
          integration-pipeline fetch_by_tag --repo $provision_infra_repo_name \
            --version $provision_infra_version \
            --gh_api_user ${{ secrets.auto_commit_user }} \
            --gh_api_pwd  ${{ secrets.auto_commit_pwd }} \
            --target_dir $provision_infra_dir
          
          ls -la $provision_infra_dir
          echo "target_dir=${provision_infra_dir}" >> $GITHUB_OUTPUT
  
      - name: Setup terraform proxmox provisioner
        id: provision_infra_setup
        shell: bash
        run: |
          . .ci-venv/bin/activate
          provision_infra_dir=${{ env.PROVISION_INFRA_REPO }}
          provision_infra_version=${{ env.PROVISION_INFRA_VERSION }}
          provision_infra_repo_name=${{ env.PROVISION_INFRA_REPO }}
  
          rm -rf $provision_infra_dir
          integration-pipeline fetch_by_tag --repo $provision_infra_repo_name \
            --version $provision_infra_version \
            --gh_api_user ${{ secrets.auto_commit_user }} \
            --gh_api_pwd  ${{ secrets.auto_commit_pwd }} \
            --target_dir $provision_infra_dir
  
          ls -la $provision_infra_dir
          echo "target_dir=${provision_infra_dir}" >> $GITHUB_OUTPUT
  
      - name: Install terraform
        shell: bash
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform=1.5.2-1 --allow-downgrades -y
  
      - name: Provision remote vms (Proxmox)
        working-directory: ${{ steps.provision_infra_setup.outputs.target_dir }}
        shell: bash
        run: |
          multiply_node=$(printf '"${{ matrix.node }}",%.0s' {1..${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }}})
          node_list_str=${multiply_node::-1}
          multiply_ips=$(printf '"dhcp",%.0s' {1..${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }}})
          ip_list_str=${multiply_ips::-1}
          var_file_arg='-var-file=../${{ steps.provision_infra_env_conf.outputs.target_dir }}/hel/${{ matrix.node }}_gh_runner.tfvars'
  
  
          echo "proxmox_host_list=[$node_list_str]">>input.tfvars
  
          echo 'gh_runner_nr="${{ fromJson(inputs.INFRA_IP_CONFIGURATION)[matrix.node] }}"'>>input.tfvars
          echo 'gh_runner_name_prefix="${{ matrix.node }}-ip-runner"'>>input.tfvars
          echo "ip_list=[$ip_list_str]">>input.tfvars
          echo 'tags=["ip-runner"]'>>input.tfvars
          echo 'pool="IP-Temp-VMs"'>>input.tfvars
          echo 'proxmox_ve_username="${{ secrets.proxmox_ve_username }}"'>>input.tfvars
          echo 'proxmox_ve_password="${{ secrets.proxmox_ve_password }}"'>>input.tfvars
          echo 'gh_access_token="${{ secrets.auto_commit_pwd }}"'>>input.tfvars
          echo 'gh_runner_labels=["integration-pipeline-${{ matrix.node }}"]'>>input.tfvars
          echo "\n">>input
  
          echo "File args: $var_file_arg"
          echo "Input File args: $(cat input.tfvars)"
          terraform init -backend-config="key=${{ matrix.node }}-ip-runners.tfstate"
          terraform destroy -auto-approve $var_file_arg -var-file=input.tfvars
          terraform refresh $var_file_arg -var-file=input.tfvars
  
          echo "${{ secrets.ssh_priv_key }}" > ~/.ssh/ci_priv_key.pem
          sudo chmod 600 ~/.ssh/ci_priv_key.pem

        env:
          aws_key_id_ID: ${{ secrets.aws_key_id }}
          aws_secret_key_id: ${{ secrets.aws_secret_key_id }}
          AWS_DEFAULT_REGION: "us-east-1"
    
  Provision-IP-Runners:
    needs: Destroy-IP-Runners

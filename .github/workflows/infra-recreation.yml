            "channel": "${{ env.SLACK_CHANNEL }}",
            "text": "${{ steps.pre_slack.outputs.msg }}",
            "thread_ts": "${{ needs.Destroy-Packer-Runners.outputs.slack_thread_id }}"
          }

    - name: Send Slack Message
      uses: slackapi/slack-github-action@v2
      if: ${{ failure() }}
      with:
        method: chat.postMessage
        token: ${{ secrets.slack_token_id }}
        payload: |
          {
            "channel": "${{ env.SLACK_CHANNEL }}",
            "text": "${{ steps.pre_slack.outputs.msg_error }}",
            "thread_ts": "${{ needs.Destroy-Packer-Runners.outputs.slack_thread_id }}"
          }

  Run-Status:
    needs: [Provision-IP-Runners, Provision-QA-Runners, Provision-Robotics-Sim-Runners, Provision-Redhat-Oracle-Runners, Provision-Packer-Runners]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Prepare slack variables
        if: ${{ always() }}
        id: pre_slack
        run: |
          MESSAGE="Infrastructure recreated successfully  on ${{ inputs.INFRA_NODES }} ! :sunny:"
          MESSAGE_ERR="Infrastructure recreation failed  on ${{ inputs.INFRA_NODES }} ! :rain_cloud:"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT
          echo "msg_err=${MESSAGE_ERR}" >> $GITHUB_OUTPUT

      - name: Send Slack Message
        if: ${{ needs.Provision-IP-Runners.result == 'success' && needs.Provision-QA-Runners.result == 'success' && needs.Provision-Robotics-Sim-Runners.result == 'success' && needs.Provision-Redhat-Oracle-Runners.result == 'success' && needs.Provision-Packer-Runners.result == 'success' }}
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.update
          token: ${{ secrets.slack_token_id }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "ts": "${{ needs.Provision-IP-Runners.outputs.slack_thread_id }}",
              "text": "${{ steps.pre_slack.outputs.msg }}"
            }

      - name: Send Slack Message
        if: ${{ always() && (! needs.Provision-IP-Runners.result == 'success' || ! needs.Provision-QA-Runners.result == 'success' || ! needs.Provision-Robotics-Sim-Runners.result == 'success' || ! needs.Provision-Redhat-Oracle-Runners.result == 'success' || ! needs.Provision-Packer-Runners.result == 'success') }}
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.update
          token: ${{ secrets.slack_token_id }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "ts": "${{ needs.Provision-IP-Runners.outputs.slack_thread_id }}",
              "text": "${{ steps.pre_slack.outputs.msg_err }}"
            }

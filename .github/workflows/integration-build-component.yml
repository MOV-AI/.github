name: Component pipeline
on:
  workflow_call:
    inputs:
      vs_product_name:
        required: true
        type: string
      vs_product_version_pattern:
        required: true
        type: string
      download_artifact:
        required: false
        type: boolean
      test_infra_key:
        required: false
        type: string
        default: 'local'
      pytest_args:
        required: true
        type: string
      test_timeout:
        required: false
        type: number
        default: 60
      ci_integration_scripts_version:
        required: false
        type: string
        default: "4.0.0.13"
      robot_json:
        required: false
        type: string
        default: "basic-standalone-noetic.json"

    secrets:
      auto_commit_user:
        required: true
      auto_commit_mail:
        required: true
      auto_commit_pwd:
        required: true
      registry_user:
        required: true
      registry_password:
        required: true
      gh_token:
        required: true

env:
  GITHUB_API_USR: "OttoMation-Movai"
  USERSPACE_FOLDER_PATH: userspace
  REMOTE_WORKSPACE_PATH: workspace
  ARTIFACTS_RETENTION_DAYS: 15
  CI_INTEGRATION_CONTAINER_VERSION: "registry.cloud.mov.ai/qa/ci-tools:${{ inputs.ci_integration_scripts_version}}"
  CI_INTEGRATION_CONTAINER_WORKSPACE: "/opt/mov.ai/workspace"
  CI_INTEGRATION_EXECUTION_FOLDER: "$(pwd)/temp"

jobs:
  Platform-tests:
    runs-on: integration-pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Agent info
        id: agent_info
        run: |
          echo "ip=$(hostname -I | awk '{print $1}')" | tee $GITHUB_OUTPUT

      - name: Install CI Scripts in container
        shell: bash
        run: |
          python3 -m venv ci_scripts --clear
          source ci_scripts/bin/activate
          python3 -m pip install integration-pipeline==${{ inputs.ci_integration_scripts_version }} --ignore-installed
          deactivate

      - name: Download component artifacts for patching
        if: inputs.download_artifact
        uses: actions/download-artifact@v4
        with:
          name: component_artifacts
          path: component_artifacts

      - name: fetch platform version
        shell: bash
        run: |
          source ci_scripts/bin/activate

          rm -rf product
          mkdir -p product platform_artifacts
          integration-pipeline fetch_product_by_version \
                --product_version_search ${{ inputs.vs_product_version_pattern}} \
                --repo ${{ inputs.vs_product_name }} \
                --gh_api_user ${{ secrets.auto_commit_user }} \
                --gh_api_pwd ${{ secrets.auto_commit_pwd }} \
                --target_dir product

          cp product/product-manifest.yaml product-manifest.yaml

      - name: calculate robot.json to use
        shell: bash
        run: |
          PRODUCT=${{ inputs.vs_product_name }}
          QUICKSTART_VERSION=$(cat product/quickstart_version.txt)
          CONFIG_FILE_NAME=${{ inputs.robot_json }}
          echo "product/$CONFIG_FILE_NAME" > product/robot.json

      - name: pre-install patch
        shell: bash
        run: |
          export CONFIG_FILE_NAME="$(cat product/robot.json)"
          export COMPONENT_VERSION=$(cat component_artifacts/component_version.txt)
          if test -f .github/workflows/pre_install_platform.bash; then
            echo "Running pre-install patch"
            . .github/workflows/pre_install_platform.bash
          fi

      - name: Upload robot configs (after pre-patch)
        uses: actions/upload-artifact@v4
        with:
          name: robot_configs_after_pre_patch
          path: product
          retention-days: 5

      - name: Install platform
        id: install
        shell: bash
        run: |
          timeout 30 movai-cli remove --all || true

          QUICKSTART_VERSION=$(cat product/quickstart_version.txt)
          export CONFIG_FILE_NAME=$(cat product/robot.json)

          export USERSPACE_FOLDER_PATH="$(pwd)/userspace"
          export ROBOTNAME="ci_robot"
          export PUBLIC_IP=$(hostname -I | awk '{print $1}')
          wget https://movai-scripts.s3.amazonaws.com/QuickStart_$QUICKSTART_VERSION.bash
          chmod +x ./QuickStart_$QUICKSTART_VERSION.bash
          ./QuickStart_$QUICKSTART_VERSION.bash --apps $(cat product/service_version.txt) $CONFIG_FILE_NAME

          MOVAI_USER="ci"
          MOVAI_PWD="4Iva6UHAQq9DGITj"
          for robot in $(movai-cli robots list); do
            movai-cli robots user "$robot" "$MOVAI_USER" "$MOVAI_PWD"
          done

          echo "movai_user=${MOVAI_USER}" >> $GITHUB_OUTPUT
          echo "movai_pwd=${MOVAI_PWD}" >> $GITHUB_OUTPUT

      - name: post-install patch
        shell: bash
        id: post_install
        run: |
          export CONFIG_FILE_NAME=$(cat product/robot.json)
          export MOVAI_USER="${{ steps.install.outputs.movai_user }}"
          export MOVAI_PWD="${{ steps.install.outputs.movai_pwd }}"
          if test -f .github/workflows/post_install_platform.bash; then
            echo "Running post-install patch"
            . .github/workflows/post_install_platform.bash
          fi

      - name: Upload robot configs (after post-patch)
        uses: actions/upload-artifact@v4
        with:
          name: robot_configs_after_post_patch
          path: product
          retention-days: 5

      - name: Local Generic Tests - Setup
        if: ${{ inputs.test_infra_key == 'local' }}
        shell: bash
        run: |
          export CONFIG_FILE_NAME=$(cat product/robot.json)
          export MOVAI_USER="${{ steps.install.outputs.movai_user }}"
          export MOVAI_PWD="${{ steps.install.outputs.movai_pwd }}"
          export GITHUB_API_USR=${{ secrets.auto_commit_user }}
          export GITHUB_API_PWD=${{ secrets.auto_commit_pwd }}
          export CI_TOOLS=${{ env.CI_INTEGRATION_CONTAINER_VERSION }}
          export CI_TOOLS_EXEC_FOLDER="${{ env.CI_INTEGRATION_EXECUTION_FOLDER }}"
          mkdir -p test_artifacts
          if test -f .github/workflows/test_setup.bash; then
            echo "Running tests setup"
            . .github/workflows/test_setup.bash
          fi


      - name: Fetched Tests - Setup ${{ inputs.test_infra_key }}
        if: ${{ inputs.test_infra_key != 'local' }}
        id: infra_tests_setup
        shell: bash
        env:
          qa_key: ${{ inputs.test_infra_key }}
        run: |
          mkdir -p test_artifacts
          rm -f /tmp/target_dir.txt /tmp/version.txt /tmp/repo_name.txt /tmp/jira_report.txt /tmp/test_set.txt
          source ci_scripts/bin/activate
          integration-pipeline get_yml_value --file product-manifest.yaml --key product_components.qa.$qa_key.version --output_file /tmp/version.txt
          integration-pipeline get_yml_value --file product-manifest.yaml --key product_components.qa.$qa_key.name --output_file /tmp/repo_name.txt
          integration-pipeline get_yml_value --file product-manifest.yaml --key product_components.qa.$qa_key.jira_report --output_file /tmp/jira_report.txt
          integration-pipeline get_yml_value --file product-manifest.yaml --key product_components.qa.$qa_key.standalone.test_set --output_file /tmp/test_set.txt
          integration-pipeline get_yml_value --file product-manifest.yaml --key version --output_file /tmp/platform_version.txt

          tests_dir=standalone_${{ inputs.test_infra_key }}
          tests_version=$(cat /tmp/version.txt)
          tests_repo_name=$(cat /tmp/repo_name.txt)
          jira_report=$(cat /tmp/jira_report.txt)
          test_set=$(cat /tmp/test_set.txt)
          platform_version=$(cat /tmp/platform_version.txt)

          rm -rf $tests_repo_name

          integration-pipeline fetch_by_tag --repo $tests_repo_name --version $tests_version --gh_api_user $GITHUB_API_USR --gh_api_pwd ${{ secrets.auto_commit_pwd }} --target_dir $tests_dir
          ls -la $tests_dir

          echo "target_dir=${tests_dir}" >> $GITHUB_OUTPUT
          echo "jira_report=${jira_report}" >> $GITHUB_OUTPUT
          echo "test_set=${test_set}" >> $GITHUB_OUTPUT
          echo "platform_version=${platform_version}" >> $GITHUB_OUTPUT
          deactivate

          # setup tests venv in a step that is always executed
          python3 -m venv "${tests_dir}"/test-venv --clear
          . "${tests_dir}"/test-venv/bin/activate
          pip install -r "${tests_dir}"/requirements.txt
          deactivate

      - name: Local Generic Tests - Run tests
        if: ${{ inputs.test_infra_key == 'local' }}
        shell: bash
        run: |
          export CONFIG_FILE_NAME=$(cat product/robot.json)
          export MOVAI_USER="${{ steps.install.outputs.movai_user }}"
          export MOVAI_PWD="${{ steps.install.outputs.movai_pwd }}"
          if test -f .github/workflows/run_tests.bash; then
            echo "Running tests"
            . .github/workflows/run_tests.bash
          fi

      - name: Fetched Tests - Run tests
        if: ${{ inputs.test_infra_key != 'local' }}
        timeout-minutes: ${{ inputs.test_timeout }}
        working-directory: ${{ steps.infra_tests_setup.outputs.target_dir }}
        shell: bash
        env:
          selenoid_url: "http://selenoid-ui.hel.mov.ai"
          host_ip: ${{ steps.agent_info.outputs.ip }}
          movai_user: ${{ steps.install.outputs.movai_user }}
          movai_pwd: ${{ steps.install.outputs.movai_pwd }}
          test_set: ${{ steps.infra_tests_setup.outputs.test_set }}
        run: |
          . test-venv/bin/activate
          pip install buildkite-test-collector
          echo "python3 -m pytest ${{ inputs.pytest_args}}"
          python3 -m pytest ${{ inputs.pytest_args}} | tee pytest-output.log
          deactivate

      - name: Local Generic Tests - Collect tests artifacts
        if: ${{ inputs.test_infra_key == 'local' && always() }}
        shell: bash
        run: |
          export CONFIG_FILE_NAME=$(cat product/robot.json)
          export MOVAI_USER="${{ steps.install.outputs.movai_user }}"
          export MOVAI_PWD="${{ steps.install.outputs.movai_pwd }}"
          if test -f .github/workflows/collect_tests_artifacts.bash; then
            echo "Collecting tests artifacts"
            . .github/workflows/collect_tests_artifacts.bash
          fi

      - name: Fetched Tests - Collect tests artifacts
        if: ${{ inputs.test_infra_key != 'local' && always() }}
        shell: bash
        env:
          TEST_INFRA_DIR: ${{ steps.infra_tests_setup.outputs.target_dir }}
        run: |
          # cleanup
          rm -rf qa_artifacts

          # tests artifacts
          # *.log and *.zip might not exist if the test fails early
          mkdir -p qa_artifacts
          cp -r "${TEST_INFRA_DIR}"/*.{log,tar,json,html} ./qa_artifacts 2>/dev/null || true
          cp -r "${TEST_INFRA_DIR}"/tests_artifacts ./qa_artifacts || true


      - name: Collect platform artifacts
        if: always()
        working-directory: platform_artifacts
        shell: bash
        run: |
          # for sanity
          docker ps -a

          for container in backend spawner message-server monitoring redis-master redis-local influxdb haproxy; do
             CONTAINER_ID=$(docker ps -a --format '{{.Names}}' --filter "name=^${container}-.*")
             docker logs "${CONTAINER_ID}" &> "${container}.log" || true
          done || true

          # movai-service
          journalctl -u movai-service --since '1hour ago' &> "movai-service.log"

          # spawner (mobros firmware)
          journalctl -u movai-service -t mobros --since '1hour ago' &> spawner-firmware.log || true

      - name: Publish Platform artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform_artifacts
          path: platform_artifacts

      - name: Generic Tests - Publish test artifacts
        if: ${{ inputs.test_infra_key == 'local' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test_artifacts
          path: test_artifacts

      - name: Fetched Tests - Publish test artifacts
        if: ${{ inputs.test_infra_key != 'local' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}_${{ github.run_attempt }}_${{inputs.test_infra_key}}_artifacts_${{ github.run_id }}
          path: qa_artifacts/*
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}

      - name: Docker cleanups
        if: always()
        shell: bash
        run: |
          docker system prune -f
          docker image prune --all -f

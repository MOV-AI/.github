name: Build Product
on:
  workflow_call:
    inputs:
      product_name:
        required: true
        type: string
      product_distro_list:
        required: false
        type: string
      ros_distro:
        required: false
        type: string
      with_simulation:
        required: false
        type: string
        default: 'true'
      with_simulation_tests:
        required: false
        type: boolean
        default: false
      is_external_project:
        required: false
        type: boolean
        default: false
      is_nightly_run:
        required: false
        type: boolean
        default: false
      nightly_run_branch:
        required: false
        type: string
        default: "UNDEFINED"
      cluster:
        required: false
        default: "mary"
        type: string
      duration:
        required: false
        type: string
        default: "UNDEFINED"
      propagate_project:
        required: false
        type: boolean
        default: false
      debug_simulation_tests_keep_alive:
        required: false
        type: boolean
        default: false
      overwrite_slack_channel:
        required: false
        type: string
        default: "C050L85R6VC"
      # development slack channel
      #default: "C05K2KF1UP8"
      docker_registry:
        required: false
        type: string
        default: "registry.hel.mov.ai"
        description: "Registry to pull images during build and tests. Should be running on proxmox cluster for optimal performance, but can be overridden for testing purposes"
      docker_simulator_registry:
        required: false
        type: string
        default: "registry.lis.mov.ai"
        description: "Registry to pull images during simulation tests. Should be running in the lab optimal performance, but can be overridden for testing purposes"
      use_project_data_viewer:
        required: false
        type: boolean
        default: false
      pr_id:
        required: false
        type: string
      pr_labels:
        required: false
        type: string
        default: '[]'
      deployment_project:
        required: false
        type: boolean
        default: false
      proxmox_cluster_name:
        required: false
        type: string
        default: hel0
      simulation_qa_key:
        required: false
        type: string
        default: "simulator_tests"
      generate_sbom:
        required: false
        type: boolean
        default: false
        description: Generate CycloneDX SBOM and attach it as Harbor accessory for pushed images

    secrets:
      auto_commit_user:
        required: true
      auto_commit_mail:
        required: true
      auto_commit_pwd:
        required: true
      registry_user:
        required: true
      registry_password:
        required: true
      nexus_publisher_user:
        required: true
      nexus_publisher_password:
        required: true
      gh_token:
        required: true
      aws_key_id:
        required: true
      aws_secret_key_id:
        required: true
      slack_token_id:
        required: true
      proxmox_ve_username:
        required: true
      proxmox_ve_password:
        required: true
      ssh_priv_key:
        required: true
      pdv_auth_token:
        required: false
      minio_key_id:
        required: true
      minio_secret_key_id:
        required: true
      provision_infra_pwd:
        required: true
      dependency_track_api_key:
        required: false

    outputs:
      init_version:
        description: "Version of the product before built"
        value: ${{ jobs.Validate-boostrap-configs.outputs.init_version || 'not executed' }}
      raised_version:
        description: "Version of the product built"
        value: ${{ jobs.Build-Workspace.outputs.raised_version || 'not executed' }}
      simulation_test_version:
        description: "Version of the simulation tests executed"
        value: ${{ jobs.Validation-Simulator-Tests.outputs.simulation_test_version || 'not executed' }}
      simulation_test_publish_url:
        description: 'The URL to the published artifacts of simulation tests'
        value: ${{ jobs.Validation-Simulator-Tests.outputs.simulation_test_publish_url || 'not executed' }}

env:
  CI_INTEGRATION_SCRIPTS_VERSION: "4.2.0.7"
  MOBTEST_VERSION: "0.0.6.1"
  PACKAGE_DEPLOYER_VERSION: "1.0.0.33"
  GITHUB_API_USR: "OttoMation-Movai"
  AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_key_id }}
  PUSH_REGISTRY: registry.cloud.mov.ai
  IP_MIRROR_REGISTRY: ${{ inputs.docker_registry }}
  SIM_MIRROR_REGISTRY: ${{ inputs.docker_simulator_registry }}
  USERSPACE_FOLDER_PATH: /opt/movai/userspace
  REMOTE_WORKSPACE_PATH: workspace
  PROVISION_INFRA_REPO: "devops-tf-proxmox-bpg"
  PROVISION_INFRA_VERSION: "2.2.0-3"
  DEVOPS_SLACK_CHANNEL: "G0102LEV1CL"
  # slack channel movai-projects
  SLACK_CHANNEL: ${{ inputs.overwrite_slack_channel }}
  # development slack channel
  #SLACK_CHANNEL: "C05K2KF1UP8"
  PROJECT_DATA_VIEWER_API: "https://personal-7vf0v2cu.outsystemscloud.com/ProjectDataViewer5/rest/V1//CreateProject"
  MINIO_S3_URL: "https://s3.mov.ai"
  MINIO_PUBLIC_URL: "https://minio.mov.ai"
  TIMEOUT: 720
  PROVISIONING_ENV_CONF: "0.2.2-5"
  DEPENDENCY_TRACK_URL: "https://sbom.es.mov.ai"
  HARBOR_URL: "https://registry.cloud.mov.ai/"

jobs:
  Compute-timeout:
    runs-on: ubuntu-latest
    outputs:
      timeout: ${{ steps.Compute-timeout.outputs.timeout }}
      jobtimeout: ${{ steps.Compute-timeout.outputs.jobtimeout }}
    steps:
      - name: "Compute Timeout"
        id: Compute-timeout
        run: |
          if [ ${{ inputs.duration }} != "UNDEFINED" ]; then
            duration_minutes=$((${{ inputs.duration }} * 60))
          else
            duration_minutes=0
          fi
          if [[ $duration_minutes -gt $((${{ env.TIMEOUT }})) ]]; then
            calc_timeout=$((duration_minutes * 110 / 100))
          else
            calc_timeout=${{ env.TIMEOUT }}
          fi
          if [[ $calc_timeout -ne 0 ]]; then
            calc_jobtimeout=$((calc_timeout +2))
          else
            calc_jobtimeout=0
          fi
          echo "simulation tests step timeout $calc_timeout"
          echo "Simulation tests job timeout $calc_jobtimeout"
          echo "timeout=$calc_timeout" >> $GITHUB_OUTPUT
          echo "jobtimeout=$calc_jobtimeout" >> $GITHUB_OUTPUT

  Normalize-Distro-Input:
    runs-on: integration-pipeline
    outputs:
      product_distro_list: ${{ steps.normalize.outputs.product_distro_list }}

    steps:
      - name: Validate and normalize distro input
        id: normalize
        shell: bash
        run: |
          PRODUCT_DISTRO_LIST='${{ inputs.product_distro_list }}'
          ROS_DISTRO='${{ inputs.ros_distro }}'
          PRODUCT_NAME='${{ inputs.product_name }}'

          has_product_distro_list=false
          has_ros_distro=false

          [[ -n "$PRODUCT_DISTRO_LIST" ]] && has_product_distro_list=true
          [[ -n "$ROS_DISTRO" ]] && has_ros_distro=true

          if [[ "$has_product_distro_list" == true && "$has_ros_distro" == true ]]; then
            echo "Both product_distro_list and ros_distro were provided. Ros_distro will be ignored."
          fi

          if [[ "$has_product_distro_list" == false && "$has_ros_distro" == false ]]; then
            echo "One of product_distro_list or ros_distro must be provided"
            exit 1
          fi

          if [[ "$has_ros_distro" == true ]]; then
              NORMALIZED=$(jq -c '[ .[] | {
                  service: "spawner",
                  distro: .
              } ]' <<< "$ROS_DISTRO")

            echo "product_distro_list=$NORMALIZED" >> "$GITHUB_OUTPUT"
            echo "$NORMALIZED"
          else
            echo "product_distro_list=$PRODUCT_DISTRO_LIST" >> "$GITHUB_OUTPUT"
          fi

  Validate-boostrap-configs:
    runs-on: integration-pipeline
    container:
      image: registry.aws.cloud.mov.ai/qa/py-buildserver:v3.0.4
      credentials:
        username: ${{secrets.registry_user}}
        password: ${{secrets.registry_password}}
    outputs:
      slack_thread_id: ${{ steps.send-message.outputs.ts }}
      commit_hash: ${{ steps.Checkout.outputs.commit_hash }}
      pr_prefix: ${{ steps.artifacts_prefix.outputs.pr_prefix }}
      init_version: ${{ steps.raise.outputs.init_version }}

    steps:
      - name: Checkout
        if: ${{ inputs.is_nightly_run == false }}
        uses: actions/checkout@v6

      - name: Nightly Checkout
        if: ${{ inputs.is_nightly_run }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.nightly_run_branch }}

      - name: Checkout commit hash
        id: Checkout
        run: |
          git config --global --add safe.directory $(pwd)
          git rev-parse HEAD > commit_hash
          echo "commit_hash=$(cat commit_hash)" >> $GITHUB_OUTPUT

      - name: Set PR prefix
        id: artifacts_prefix
        run: |
          if [ -n "${{ inputs.pr_id }}" ]; then
            echo "pr_prefix=pr${{ inputs.pr_id }}~" >> $GITHUB_OUTPUT
          else
            echo "pr_prefix=" >> $GITHUB_OUTPUT
          fi

      - name: Job Summary Header
        shell: bash
        run: |
          if [ "${{ inputs.is_nightly_run }}" == "true" ] ; then
            TITLE="Long Run Report of ${GITHUB_REPOSITORY} ${{inputs.nightly_run_branch}}"
          else
            TITLE="Run Report of ${GITHUB_REPOSITORY} ${GITHUB_REF#refs/heads/}"
          fi

          echo -e "# ${TITLE}" >> $GITHUB_STEP_SUMMARY

      - name: Validate Manifest
        shell: bash
        run: |
          yamllint product-manifest.yaml

      - name: Install CI Scripts in container
        shell: bash
        run: |
          python3 -m venv ci_scripts --clear
          source ci_scripts/bin/activate
          python3 -m pip install --upgrade pyOpenSSL cryptography
          python3 -m pip install integration-pipeline==$CI_INTEGRATION_SCRIPTS_VERSION --ignore-installed
          deactivate

      - name: Bootstraping simulator metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ];
          then
            BRANCH_NAME=${{ github.head_ref }}
          elif [ "${{ inputs.is_nightly_run }}" = "true" ];
          then
            BRANCH_NAME=${{ inputs.nightly_run_branch }}
          else
            BRANCH_NAME=${{ github.ref_name }}
          fi

          # save branch name to output
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git config --global --add safe.directory $(pwd)
          git fetch
          git checkout origin/$BRANCH_NAME -- product.version .bumpversion.cfg
          cat product.version
          rm -rf simulator_artifacts ci_artifacts

          source ci_scripts/bin/activate

          merge_manifest_args=" --dependency_name product-platform"
          merge_manifest_args="$merge_manifest_args --gh_api_user $GITHUB_API_USR"
          merge_manifest_args="$merge_manifest_args --gh_api_pwd ${{ secrets.auto_commit_pwd }}"
          merge_manifest_args="$merge_manifest_args --auto_fetch"

          if [ "${{ inputs.is_external_project }}" = "true" ];
          then
            merge_manifest_args="$merge_manifest_args --merge_sub_prod_dep_keys platform_config,platform_components,installion"
          fi

          if [ "${{ inputs.with_simulation }}" = "false" ];
          then
            merge_manifest_args="$merge_manifest_args --forward_sim"
          fi

          integration-pipeline merge_manifest_dependency $merge_manifest_args

          if [ "${{ inputs.with_simulation }}" = "true" ];
          then
          if [ -n "${{ inputs.pr_id }}" ]; then
            tag_arg="--tag pr${{ inputs.pr_id }}"
          fi
          integration-pipeline generate_meta_simulator_artifacts \
                --manifest_platform_base_key product_dependencies \
                --product_name ${{ inputs.product_name }} \
                --branch ${BRANCH_NAME} \
                --update_simulator \
                --docker_registry $PUSH_REGISTRY $tag_arg

          mkdir simulator_artifacts
          cp ci_artifacts/* ./simulator_artifacts
          fi

      - name: raise
        id: raise
        shell: bash
        run: |
          mkdir platform_configs
          source ci_scripts/bin/activate
          echo "init_version=$(cat product.version)" >> $GITHUB_OUTPUT
          # Check if a PR triggered the workflow
          if [ -n "${{ inputs.pr_id }}" ]; then
            # raised version has sufix of PR number
            sed -i ''1s/$/-pr${{ inputs.pr_id }}/'' product.version
          elif [[ ",${{ inputs.pr_labels }}," == *"minor"* ]]; then
            bump2version minor --no-tag --no-commit --allow-dirty
          elif [[ ",${{ inputs.pr_labels }}," == *"patch"* ]]; then
            bump2version patch --no-tag --no-commit --allow-dirty
          else
            bump2version build --no-tag --no-commit --allow-dirty
          fi

          cp product.version ./platform_configs/product.version
          cp .bumpversion.cfg ./platform_configs/.bumpversion.cfg

      - name: Generate Multi-Workspace Artifacts
        id: generate_meta
        shell: bash
        run: |
          source ci_scripts/bin/activate
          rm -rf ci_artifacts

          if [ -n '${{ inputs.product_distro_list }}' ]; then
            WORKSPACES='${{ inputs.product_distro_list }}'
          else
            WORKSPACES=$(jq -c --arg product '${{ inputs.product_name }}' '[ .[] | { service: "spawner", distro: ., product_name: $product } ]' <<< '${{ inputs.ros_distro }}')
          fi

          ROS1_NAME=$(jq -r --arg prod "${{ inputs.product_name }}" '(.[] | select(.distro == "noetic") | $prod + "-" + .distro) // "False"' <<< "$WORKSPACES" | head -n 1)
          ROS2_NAME=$(jq -r --arg prod "${{ inputs.product_name }}" '(.[] | select(.distro != "noetic") | $prod + "-" + .distro) // "False"' <<< "$WORKSPACES" | head -n 1)

          echo "Generating artifacts with ROS1 Workspace: $ROS1_NAME and ROS2 Workspace: $ROS2_NAME"

          ROS1_OVERRIDE=$(jq -r 'first(.[] | select(.distro == "noetic") | "--override_" + (.service | gsub("-"; "_"))) // ""' <<< "$WORKSPACES")

          echo "ROS1_OVERRIDE: $ROS1_OVERRIDE"

          args=(
            --update_simulator
            "$ROS1_OVERRIDE" "$ROS1_NAME"
            --manifest_platform_base_key "product_dependencies"
          )

          if [ -n "$ROS2_NAME" ] && [ "$ROS2_NAME" != "False" ] && [ "$ROS2_NAME" != "false" ]; then
            args+=(--override_ros2_workspace "$ROS2_NAME")
          fi

          integration-pipeline generate_meta_artifacts "${args[@]}"
          deactivate

      - name: Stash All Robot Configs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifacts_prefix.outputs.pr_prefix }}all_robot_configs
          path: |
            *.json*
            ci_artifacts/
          retention-days: 5

      - name: Stash sim_configs
        if: ${{ inputs.with_simulation == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifacts_prefix.outputs.pr_prefix }}sim_configs
          path: simulator_artifacts/*
          retention-days: 5

      - name: Prepare slack variables
        if: ${{ always() && github.event_name != 'pull_request' }}
        id: pre_slack
        shell: bash
        run: |
          MESSAGE=":loading: CI: ${GITHUB_REPOSITORY} (${GITHUB_REF#refs/heads/}), build: $(cat product.version)(Attempt: #${{ github.run_attempt }}) is starting to be validated on ${{ inputs.cluster }} :mag_right: Details: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${{ inputs.is_nightly_run }}" == "true" ] ; then
            MESSAGE=":loading::waxing_crescent_moon: LONG RUN: ${GITHUB_REPOSITORY} ${{inputs.nightly_run_branch}}, (Attempt: #${{ github.run_attempt }}) is starting to be validated on ${{ inputs.cluster }} :mag_right: Details: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT

      - name: Send Slack Message
        if: ${{ github.event_name != 'pull_request' }}
        uses: slackapi/slack-github-action@v3
        id: send-message
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_token_id }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "${{ steps.pre_slack.outputs.msg }}"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slack_token_id }}

      - name: Stash manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifacts_prefix.outputs.pr_prefix }}manifest
          path: product-manifest.yaml
          retention-days: 5
          include-hidden-files: true

      - name: Stash raised_meta
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifacts_prefix.outputs.pr_prefix }}raised_meta
          path: platform_configs/*
          retention-days: 5
          include-hidden-files: true

  Build-Workspace:
    needs: [Validate-boostrap-configs, Normalize-Distro-Input]
    strategy:
      matrix:
        workspace: ${{ fromJSON(needs.Normalize-Distro-Input.outputs.product_distro_list) }}
    runs-on: integration-pipeline
    outputs:
      raised_version: ${{ steps.pre_build.outputs.raised_version }}
      slack_thread_id: ${{ needs.Validate-boostrap-configs.outputs.slack_thread_id }}
      commit_hash: ${{ needs.Validate-boostrap-configs.outputs.commit_hash }}
    steps:
      - uses: rtCamp/action-cleanup@master
      - name: Checkout
        if: ${{ inputs.is_nightly_run == false }}
        uses: actions/checkout@v6

      - name: Nightly Checkout
        if: ${{ inputs.is_nightly_run }}
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.Validate-boostrap-configs.outputs.commit_hash }}

      - name: Agent info
        run: |
          echo "public ip: $(curl ipinfo.io/ip)"
          echo "private ip: $(hostname -I | awk '{print $1}')"

      - name: Setup CI Scripts in .ci-venv
        shell: bash
        run: |
          python3 -m venv .ci-venv --clear
          . .ci-venv/bin/activate
          [ -f ci-requirements.txt ] && pip install -r ci-requirements.txt
          python3 -m pip install --upgrade pyOpenSSL cryptography
          python3 -m pip install integration-pipeline==$CI_INTEGRATION_SCRIPTS_VERSION --ignore-installed

      - name: unstash raised_meta
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.Validate-boostrap-configs.outputs.pr_prefix }}raised_meta
          path: platform_configs

      - name: Unstash All Robot Configs
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.Validate-boostrap-configs.outputs.pr_prefix }}all_robot_configs
          path: .

      - name: Update robot jsons to use ci project
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          . .ci-venv/bin/activate
          # iterate over .json files and update images to use ci image
          for file in $(find . -maxdepth 1 -name "*.json"); do
            echo "$file"

            tmp="tmp.json"
            cp "$file" "$tmp"

            update_image () {
              local section=$1
              local file_in=$2
              local file_out=$3

              if [[ $(jq "has(\"$section\")" "$file_in") == "true" ]]; then
                img=$(jq -r ".\"$section\".image" "$file_in")
                jq --arg img "ci/$img" ".\"$section\".image = \$img" "$file_in" > "$file_out"
              else
                cp "$file_in" "$file_out"
              fi
            }

            # apply updates
            update_image "spawner" "$tmp" "tmp1.json"
            update_image "simulator" "tmp1.json" "tmp2.json"
            update_image "ros1-workspace" "tmp2.json" "tmp3.json"
            update_image "ros2-workspace" "tmp3.json" "$tmp"

            mv "$tmp" "$file"

            # debug
            jq '.spawner.image?, ."ros1-workspace".image?, ."ros2-workspace".image?' "$file"
          done
          deactivate

      - name: Lint docker image
        shell: bash
        run: |
          docker run --rm -i -e HADOLINT_FAILURE_THRESHOLD=error hadolint/hadolint < docker/${{ matrix.workspace['distro'] }}/Dockerfile

      - name: Login to ${{ env.PUSH_REGISTRY }} Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}
          registry: ${{ env.PUSH_REGISTRY }}

      - name: Login to ${{ env.IP_MIRROR_REGISTRY }} Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_password }}
          registry: ${{ env.IP_MIRROR_REGISTRY }}

      - name: Prepare docker build variables
        id: pre_build
        shell: bash
        run: |
          cp ./platform_configs/product.version product.version

          service_name_file_pattern=$(echo "${{ matrix.workspace['service'] }}" | sed 's/-/_/g')
          product_name="${{ inputs.product_name }}"
          version=$(tr -d '[:space:]' < product.version)

          if [[ "${{ matrix.workspace['service'] }}" == "spawner" ]]; then
            ext="_${{ matrix.workspace['distro'] }}"
          else
            ext=""
          fi

          echo "base_name=$(cat ci_artifacts/${service_name_file_pattern}_base_name${ext}.ci)" >> $GITHUB_OUTPUT
          echo "base_version=$(cat ci_artifacts/${service_name_file_pattern}_base_version${ext}.ci)" >> $GITHUB_OUTPUT
          echo "raised_version=${version}" >> $GITHUB_OUTPUT
          echo "target_tag=${product_name}-${{ matrix.workspace['distro'] }}" >> $GITHUB_OUTPUT
          # Check if propagated project is false
          if [ "${{ inputs.propagate_project }}" = "false" ]; then
            mkdir -p dependency_version
            cp "ci_artifacts/${service_name_file_pattern}_base_version${ext}.ci" dependency_version/base_version
          fi

      - name: Stash dependency_version
        if: ${{ inputs.propagate_project == false && matrix.workspace['distro'] == 'noetic' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.Validate-boostrap-configs.outputs.pr_prefix }}dependency_version
          path: dependency_version
          retention-days: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build
        shell: bash
        run: |
          docker build --add-host ${{ env.IP_MIRROR_REGISTRY }}:172.22.0.106 \
            --build-arg DOCKER_REGISTRY=${{ env.IP_MIRROR_REGISTRY }} \
            --build-arg BASE_IMAGE=${{ steps.pre_build.outputs.base_name }} \
            --build-arg TAG=${{ steps.pre_build.outputs.base_version }} \
            --build-arg CI_SCRIPT_VERSION=${{ env.CI_INTEGRATION_SCRIPTS_VERSION }} \
            --file docker/${{ matrix.workspace['distro'] }}/Dockerfile \
            --platform linux/amd64 \
            --tag ${{ env.PUSH_REGISTRY }}/ci/${{ steps.pre_build.outputs.target_tag }}:${{ steps.pre_build.outputs.raised_version }} \
            --pull \
            --push .

      - name: Get current job id
        if: always()
        shell: bash
        id: job_info
        run: |
          job_id=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id}}/attempts/${{ github.run_attempt }}/jobs | jq -r '.jobs | .[0].id')
          job_html_url=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id}}/attempts/${{ github.run_attempt }}/jobs | jq -r '.jobs | map(select(.name | contains("${{ github.job }}"))) | .[0].html_url')
          echo "job_url=$job_html_url" | tee >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Prepare slack variables
        if: ${{ always() && github.event_name != 'pull_request' }}
        id: pre_slack_result
        run: |
          MESSAGE=":white_check_mark: ${{ github.job }} (Attempt: #${{ github.run_attempt }}) job passed"
          MESSAGE_ERR=":x: ${{ github.job }} (Attempt: #${{ github.run_attempt }}) job failed"
          echo "msg=${MESSAGE}" >> $GITHUB_OUTPUT
          echo "msg_error=${MESSAGE_ERR}\n  Details: ${{ steps.job_info.outputs.job_url }}" >> $GITHUB_OUTPUT

      - name: Slack message success
        if: ${{ github.event_name != 'pull_request' }}
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_token_id }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "${{ steps.pre_slack_result.outputs.msg }}",
              "thread_ts": "${{ needs.Validate-boostrap-configs.outputs.slack_thread_id }}"
            }

      - name: Slack message failure
        uses: slackapi/slack-github-action@v3
        if: ${{ failure() && github.event_name != 'pull_request' }}
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_token_id }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "${{ steps.pre_slack_result.outputs.msg_error }}",
              "thread_ts": "${{ needs.Validate-boostrap-configs.outputs.slack_thread_id }}"
            }

      - name: Docker cleanups
        if: always()
        shell: bash
        run: |
          docker system prune -f

name: Rust Tests and Coverage

# Scope is deliberately narrow: format, lint, test, coverage, Sonar. It does NOT
# build release binaries, raise versions, publish to Nexus or cut releases.
#
# Two consumers are in view:
#   workspace-agent   single crate + Python bindings, protoc from apt
#   movai-metaplanner 11 independent crates (no root workspace), protoc
#                     vendored, Docker-backed component tests that must be
#                     separated from unit tests
#
# Everything they disagree about is an input below. Each directory in
# `working_directories` is tested in its own matrix leg; Sonar then runs once,
# from the repository root, over the coverage of every leg.

on:
  workflow_call:
    inputs:
      runner_label:
        required: false
        type: string
        default: ubuntu-24.04
        description: Runner label. Note ubuntu-22.04 is on the deprecation path.

      working_directories:
        required: false
        type: string
        default: '["."]'
        description: >
          JSON list of directories, each holding a Cargo.toml, e.g.
          '["backend", "orderManagement"]'. Each one is formatted, linted and
          tested in its own matrix leg. Use this for a repository of independent
          crates; a Cargo workspace needs only the default '["."]' plus
          `packages: --workspace`.

      packages:
        required: false
        type: string
        default: ''
        description: >
          Cargo package selection, e.g. '--workspace' or '-p my-crate'. Empty
          means cargo's default for the manifest. A virtual workspace manifest
          needs '--workspace' for anything that is not already workspace-wide.

      unit_test_args:
        required: false
        type: string
        default: '--lib --bins'
        description: >
          Target selection for the unit tier. The default excludes tests/, which
          is where integration tests that need Docker or a network normally live.
          Pass an empty string for a repository whose tests/ are all hermetic.

      test_filter:
        required: false
        type: string
        default: ''
        description: >
          A cargo-nextest filter expression appended to the unit run, e.g.
          "not test(regression)" to exclude tests whose name contains
          "regression". This is the nextest equivalent of `cargo test -- --skip
          <pattern>`; nextest has no `--skip`, it filters by expression.

      component_tests:
        required: false
        type: boolean
        default: false
        description: >
          Run a second pass over tests/ with a longer slow-test timeout. Requires
          a Docker daemon on the runner.

      component_test_filter:
        required: false
        type: string
        default: ''
        description: >
          A cargo-nextest filter expression for the component pass, e.g.
          "not binary_id(my-crate::needs_a_local_image)" to leave out one suite
          that cannot run on a hosted runner while every other tests/ target
          still runs.

      component_test_threads:
        required: false
        type: number
        default: 2
        description: >
          Concurrency for the component pass. Several database containers plus an
          identity provider will exhaust a 4 GB hosted runner at full parallelism.

      install_protoc:
        required: false
        type: boolean
        default: false
        description: >
          Install protobuf-compiler from apt. Leave false when build.rs uses
          protoc-bin-vendored, which already ships a pinned binary.

      build_warnings:
        required: false
        type: string
        default: warn
        description: >
          Passed to setup-rust-toolchain, which sets CARGO_BUILD_WARNINGS. That
          action defaults this to 'deny'; the default here is 'warn' so adopting
          the workflow does not immediately fail a repository with an existing
          warning backlog. Move to 'deny' once the backlog is cleared.

      clippy:
        required: false
        type: boolean
        default: true
        description: >
          Run clippy on the codebase. Findings are uploaded to code scanning as SARIF.
          Set this to false to skip clippy entirely.

      clippy_blocking:
        required: false
        type: boolean
        default: false
        description: >
          When false, clippy findings are uploaded to code scanning as SARIF and
          the job does not fail. This is how a repository measures its backlog
          before committing to it.

      coverage_format:
        required: false
        type: string
        default: lcov
        description: lcov or cobertura.

      sonar:
        required: false
        type: boolean
        default: true
        description: >
          Enable SonarQube analysis for the repository. Set this to false to skip SonarQube entirely.
          Requires a valid `sonar_token` secret to be set.

      sonar_args:
        required: false
        type: string
        default: ''
        description: >
          Extra -D flags. Prefer a sonar-project.properties file in the consuming
          repository: source and exclusion lists belong in a reviewable file, not
          in a one-line string. The quality-gate wait is added automatically.

    secrets:
      sonar_token:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  rust:
    name: Rust (${{ matrix.dir }})
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.working_directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      # Artifact names, SARIF categories and cache keys cannot carry a path.
      - name: Name this leg
        id: leg
        env:
          DIR: ${{ matrix.dir }}
        run: |
          slug=$(printf '%s' "$DIR" | tr -c 'A-Za-z0-9_-' '_')
          [ "$DIR" = "." ] && slug=root
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

      - name: Install protoc
        if: inputs.install_protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      # Installs whatever rust-toolchain.toml declares when `toolchain` is
      # omitted, and caches internally — so no separate rust-cache step.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-shared-key: rust-test-${{ steps.leg.outputs.slug }}
          cache-workspaces: ${{ matrix.dir }}
          cache-save-if: ${{ github.event_name == 'push' }}
          build-warnings: ${{ inputs.build_warnings }}

      # Prebuilt binaries. `cargo install` would compile each of these from
      # source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,clippy-sarif,sarif-fmt

      - name: Format
        id: fmt
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        if: inputs.clippy
        continue-on-error: ${{ !inputs.clippy_blocking }}
        run: |
          set -o pipefail
          cargo clippy ${{ inputs.packages }} --all-targets --all-features \
            --message-format=json | clippy-sarif \
            | tee "$GITHUB_WORKSPACE/clippy-${{ steps.leg.outputs.slug }}.sarif" | sarif-fmt

      - name: Upload clippy SARIF
        if: always() && inputs.clippy && hashFiles(format('clippy-{0}.sarif', steps.leg.outputs.slug)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: clippy-${{ steps.leg.outputs.slug }}.sarif
          category: clippy-${{ steps.leg.outputs.slug }}

      # `--lib` on a binary-only crate, and `--doc` on any crate without a
      # library, make cargo stop with "no library targets found". The default
      # unit selection is therefore narrowed to the targets that exist.
      - name: Detect targets
        id: targets
        if: ${{ !cancelled() }}
        env:
          UNIT_TEST_ARGS: ${{ inputs.unit_test_args }}
        run: |
          kinds=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].targets[].kind[]] | unique | join(" ")')
          has_lib=false
          case " $kinds " in *" lib "*|*" rlib "*|*" proc-macro "*) has_lib=true ;; esac
          unit="$UNIT_TEST_ARGS"
          if [ "$unit" = "--lib --bins" ]; then
            unit=""
            [ "$has_lib" = true ] && unit="--lib"
            case " $kinds " in *" bin "*) unit="$unit --bins" ;; esac
          fi
          echo "Target kinds: $kinds -> unit selection: '${unit}', doc tests: ${has_lib}"
          echo "has_lib=${has_lib}" >> "$GITHUB_OUTPUT"
          echo "unit=${unit}" >> "$GITHUB_OUTPUT"

      # --no-tests=warn: a crate with no unit tests is not a failure.
      # The output is kept for the report job: nextest's Summary line and its
      # FAIL lines are the test counts and the failing test names.
      - name: Unit tests with coverage
        id: unit
        if: ${{ !cancelled() && steps.targets.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo llvm-cov ${{ inputs.packages }} ${{ steps.targets.outputs.unit }} \
            --${{ inputs.coverage_format }} \
            --output-path "$GITHUB_WORKSPACE/coverage-unit-${{ steps.leg.outputs.slug }}.${{ inputs.coverage_format == 'lcov' && 'info' || 'xml' }}" \
            nextest --no-fail-fast --no-tests=warn \
            ${{ inputs.test_filter && format('-E ''{0}''', inputs.test_filter) || '' }} \
            2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Doc tests
        id: doc
        if: ${{ !cancelled() && steps.targets.outputs.has_lib == 'true' }}
        run: cargo test ${{ inputs.packages }} --doc

      - name: Component tests
        id: component
        if: ${{ !cancelled() && inputs.component_tests && steps.targets.outcome == 'success' }}
        env:
          # Ryuk reaps containers, which an ephemeral runner does anyway, and it
          # is a recurring cause of CI hangs.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set -o pipefail
          cargo llvm-cov ${{ inputs.packages }} --tests \
            --${{ inputs.coverage_format }} \
            --output-path "$GITHUB_WORKSPACE/coverage-component-${{ steps.leg.outputs.slug }}.${{ inputs.coverage_format == 'lcov' && 'info' || 'xml' }}" \
            nextest --no-fail-fast --no-tests=warn --test-threads ${{ inputs.component_test_threads }} \
            ${{ inputs.component_test_filter && format('-E ''{0}''', inputs.component_test_filter) || '' }} \
            2>&1 | tee "$RUNNER_TEMP/component-tests.log"

      - name: Coverage summary
        if: always() && inputs.coverage_format == 'lcov'
        working-directory: .
        run: |
          for f in coverage-*.info; do
            [ -f "$f" ] || continue
            awk -F: -v n="$f" '/^LF:/{t+=$2} /^LH:/{h+=$2} END{
              if (t>0) printf "%s: %.1f%% (%d/%d lines)\n", n, 100*h/t, h, t }' "$f"
          done | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage-${{ steps.leg.outputs.slug }}
          path: coverage-*
          if-no-files-found: ignore
          retention-days: 7

      # One small JSON per leg; the report job turns them into one table.
      - name: Record the result of this leg
        if: always()
        working-directory: .
        env:
          DIR: ${{ matrix.dir }}
          SLUG: ${{ steps.leg.outputs.slug }}
          FMT: ${{ steps.fmt.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          DOC: ${{ steps.doc.outcome }}
          COMPONENT: ${{ steps.component.outcome }}
        run: |
          # nextest: "Summary [ 2.0s] 131 tests run: 128 passed, 3 failed, 0 skipped"
          # and one "FAIL [ 0.5s] (1/131) crate::binary test_name" per failure.
          tests() {
            if [ ! -f "$1" ]; then echo null; return; fi
            clean=$(sed -E 's/\x1b\[[0-9;]*m//g' "$1")
            summary=$(printf '%s\n' "$clean" | grep -E '^ *Summary \[' | tail -n 1 \
              | sed -E 's/^ *Summary \[[^]]*\] *//')
            failed=$(printf '%s\n' "$clean" \
              | grep -E '^ *(FAIL|TIMEOUT|SIGSEGV|SIGABRT|SIGKILL|ABORT) \[' \
              | sed -E 's/^ *[A-Z]+ \[[^]]*\] *(\( *[0-9]+\/ *[0-9]+\) *)?//' \
              | sort -u | jq -R . | jq -s .)
            jq -n --arg s "$summary" --argjson f "$failed" '{summary: $s, failed: $f}'
          }
          coverage=null
          f="coverage-unit-${SLUG}.info"
          if [ -f "$f" ]; then
            coverage=$(awk -F: '/^LF:/{t+=$2} /^LH:/{h+=$2} END{ if (t>0) printf "%.1f", 100*h/t; else print "null" }' "$f")
          fi
          jq -n --arg dir "$DIR" --arg fmt "$FMT" --arg unit "$UNIT" --arg doc "$DOC" \
            --arg component "$COMPONENT" --argjson coverage "$coverage" \
            --argjson unit_tests "$(tests "$RUNNER_TEMP/unit-tests.log")" \
            --argjson component_tests "$(tests "$RUNNER_TEMP/component-tests.log")" \
            '{dir: $dir, fmt: $fmt, unit: $unit, doc: $doc, component: $component,
              coverage: $coverage, unit_tests: $unit_tests, component_tests: $component_tests}' \
            | tee "result-${SLUG}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-result-${{ steps.leg.outputs.slug }}
          path: result-${{ steps.leg.outputs.slug }}.json
          retention-days: 7

  # One scan for the whole repository, whatever the number of matrix legs: each
  # leg's scan would otherwise overwrite the previous one on the same project.
  sonar:
    name: SonarCloud
    needs: rust
    if: inputs.sonar
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar derives new-code from git blame. A shallow clone silently
          # degrades that, and the failure is invisible — the scan still passes.
          fetch-depth: 0

      # Rust analysis runs cargo, so the pinned toolchain must be on PATH.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - uses: actions/download-artifact@v4
        with:
          pattern: rust-coverage-*
          merge-multiple: true

      - name: Collect coverage reports
        id: coverage
        run: |
          ext=${{ inputs.coverage_format == 'lcov' && 'info' || 'xml' }}
          paths=$(find . -maxdepth 1 -name "coverage-*.${ext}" -printf '%f\n' | sort | paste -sd, -)
          echo "Coverage reports: ${paths:-none}"
          [ -n "$paths" ] && echo "arg=-Dsonar.rust.${{ inputs.coverage_format }}.reportPaths=${paths}" >> "$GITHUB_OUTPUT"
          true

      # Creates the project if absent and turns Automatic Analysis off, which is
      # required: Rust analysis runs only in CI and needs cargo on PATH.
      - uses: MOV-AI/action-sonarcloud-proj-config@v1
        with:
          sonar_org: mov-ai
          sonar_token: ${{ secrets.sonar_token }}

      - uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}
        with:
          # Organization and key match the project the bootstrap step creates
          # and the dashboard link below. sonar_args comes last, so a caller
          # can still override either.
          args: >
            -Dsonar.organization=mov-ai
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ steps.coverage.outputs.arg }}
            ${{ inputs.sonar_args }}

      - name: Link to the SonarCloud dashboard
        if: always()
        run: |
          key="${{ github.repository_owner }}_${{ github.event.repository.name }}"
          echo "Report: https://sonarcloud.io/project/overview?id=${key}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # One readable table for the whole run, in the run summary and, on a pull
  # request, in a single comment that every push updates instead of adding one.
  report:
    name: Report
    needs: [rust, sonar]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-result-*
          merge-multiple: true
          path: results

      - name: Build the report
        env:
          DIRS: ${{ inputs.working_directories }}
          COMPONENT_TESTS: ${{ inputs.component_tests }}
          SONAR: ${{ inputs.sonar }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          SONAR_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; *) echo "–";; esac; }
          # "131 tests run: 128 passed, 3 failed, 0 skipped" -> "128 passed, 3 failed"
          counts() {
            jq -r 'if . == null or .summary == "" then "" else
              (.summary | sub("^[0-9]+ tests? run: "; "") | gsub(", 0 [a-z ]+"; "")) end'
          }
          total=0; ok=0; rows=""; failures=""
          for dir in $(jq -r '.[]' <<<"$DIRS"); do
            total=$((total + 1))
            slug=$(printf '%s' "$dir" | tr -c 'A-Za-z0-9_-' '_'); [ "$dir" = "." ] && slug=root
            f="results/result-${slug}.json"
            if [ ! -f "$f" ]; then
              row="| \`${dir}\` | ❔ | ❔ no result | ❔ |"
              [ "$COMPONENT_TESTS" = true ] && row+=" ❔ |"
              rows+="${row} |"$'\n'; continue
            fi
            r=$(cat "$f")
            fmt=$(jq -r .fmt <<<"$r"); unit=$(jq -r .unit <<<"$r"); doc=$(jq -r .doc <<<"$r")
            comp=$(jq -r .component <<<"$r")
            unit_counts=$(jq '.unit_tests' <<<"$r" | counts)
            case "$unit_counts" in "") [ "$unit" = failure ] && unit_counts="build or run failed" ;; esac
            [ "$(jq -r '.unit_tests.summary // ""' <<<"$r")" = "0 tests run: 0 passed, 0 skipped" ] && unit_counts="no tests"
            cov=$(jq -r 'if .coverage == null then "" else "\(.coverage)%" end' <<<"$r")
            row="| \`${dir}\` | $(icon "$fmt") | $(icon "$unit") ${unit_counts} | $(icon "$doc") |"
            if [ "$COMPONENT_TESTS" = true ]; then
              comp_counts=$(jq '.component_tests' <<<"$r" | counts)
              row+=" $(icon "$comp") ${comp_counts} |"
            fi
            rows+="${row} ${cov} |"$'\n'
            leg_ok=true
            for o in "$fmt" "$unit" "$doc" "$comp"; do [ "$o" = failure ] || [ "$o" = cancelled ] && leg_ok=false; done
            [ "$leg_ok" = true ] && ok=$((ok + 1))
            [ "$fmt" = failure ] && failures+="- \`${dir}\`: formatting differs — run \`cargo fmt --all\` in \`${dir}\`"$'\n'
            # "crate::binary test_name" -> "`test_name` (crate::binary)"
            while IFS= read -r t; do
              [ -n "$t" ] && failures+="- \`${dir}\`: \`${t#* }\` (${t%% *})"$'\n'
            done < <(jq -r '[.unit_tests.failed[]?, .component_tests.failed[]?] | unique | .[]' <<<"$r")
          done

          header="| Crate | Format | Unit tests | Doc tests |"; sep="|---|:-:|---|:-:|"
          if [ "$COMPONENT_TESTS" = true ]; then header+=" Component tests |"; sep+="---|"; fi
          header+=" Coverage |"; sep+="--:|"

          title="✅ Rust: all ${total} crates passed"
          [ "$ok" -lt "$total" ] && title="❌ Rust: ${ok}/${total} crates passed"
          {
            echo "<!-- rust-test-workflow -->"
            echo "### ${title}"
            echo
            echo "$header"; echo "$sep"; printf '%s' "$rows"
            if [ -n "$failures" ]; then
              echo; echo "**To fix**"; echo; printf '%s' "$failures"
            fi
            if [ "$SONAR" = true ]; then
              link="https://sonarcloud.io/dashboard?id=${SONAR_KEY}${PR:+&pullRequest=${PR}}"
              echo
              case "$SONAR_RESULT" in
                success) echo "**SonarCloud:** ✅ quality gate passed — [dashboard](${link})" ;;
                failure) echo "**SonarCloud:** ❌ quality gate failed or the scan errored — [dashboard](${link})" ;;
                *) echo "**SonarCloud:** – not run, because a crate failed" ;;
              esac
            fi
            echo
            echo "Coverage is line coverage of the unit tests. [Logs of this run](${RUN_URL})"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md

      # A pull request from a fork gets a read-only token; the table is still
      # in the run summary.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]"
                    and (.body | contains("<!-- rust-test-workflow -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${id}" -F body=@report.md >/dev/null
            echo "Updated comment ${id}"
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR}/comments" -F body=@report.md >/dev/null
            echo "Added a comment"
          fi
